            `· ${o.source_name} · ${fmtDate(o.published_at) || "?"}`;
          // `article_id` a NULL veut dire purge : l'observation survit a son
          // article (ON DELETE SET NULL), le renvoi ne peut donc pas exister.
          poserParties(ligne.querySelector(".renvois"), [
            o.article_id != null ? renvoiArticle(o.article_id, o.url) : "archivé",
            o.post_id != null ? renvoiPost(o.post_id) : null,
          ]);
          // L'actu representante seulement : un doublon serait refuse.
          if (o.representant) {
            const hote = nouvelElement("div", "prog-hote");
            ligne.appendChild(hote);
            poserProgrammer(hote, o.article_id, "Programmer");
          }
          obsZone.appendChild(ligne);
        }
      } catch (erreur) {
        obsZone.textContent = "Échec du chargement des observations.";
        charge = false;
      }
    };
    list.appendChild(row);
  }
}


// --- Panneau Artistes : la moitie DETECTION de Kinda -----------------------
//
// `CLAUDE.md` appelle la courbe des citations « l'actif de Kinda » et le flux
// scoré « le deal-flow du label ». En production : 4 752 artistes et 13 533
// citations archivees depuis des semaines, et jusqu'au 2026-10-04 aucune
// interface ne les montrait -- `GET /artists` existait, teste, sans un seul
// consommateur. L'audit UX du 02/10 l'avait releve.
//
// Ce panneau n'aurait PAS du etre construit plus tot, et c'est important : le
// signal etait faux jusqu'au 03/10 (la shortlist rendait Taylor Swift et BTS,
// parce qu'elle triait par VOLUME de citations). Un panneau pose sur cet ancien
// signal aurait propose de signer Taylor Swift.

// REGLE QUI GOUVERNE CE BLOC, et la plus facile a casser par un `|| 0` bien
// intentionne : une valeur qu'on n'a PAS PU MESURER ne s'affiche jamais comme un
// zero. `velocite` vaut `None` sous deux citations datees, `acceleration` sous
// trois (c'est `app/pipeline/event_features.py` qui le decide, et qui explique
// pourquoi : couper en deux une fenetre d'une minute ne compare rien), et 17 %
// des citations de la base ne portent aucune note d'emergence. Une acceleration
// inconnue affichee « 0 » se lit « cet artiste stagne » : c'est une affirmation
// fausse sur la seule grandeur qui separe une decouverte d'une star.
//
// UN SEUL point de passage, donc une seule chose a muter pour verifier la regle
// (`tests/dashboard/test_dashboard_artistes.py`).
function mesure(valeur, decimales) {
  return valeur == null ? null : Number(valeur).toFixed(decimales);
}

// `classe` met en avant la CLE DE TRI (l'emergence moyenne) et rien d'autre.
// Elle ne s'applique jamais au cas inconnu : une valeur qu'on n'a pas pu lire
// n'a pas a porter l'accent de la marque, qui se lirait comme une promesse.
function badgeMesure(nom, valeur, decimales, aide, classe) {
  const t = mesure(valeur, decimales);
  return t == null
    ? `<span class="badge inconnu" title="${escapeHtml(aide)} — pas assez de matière pour mesurer">${nom} inconnue</span>`
    : `<span class="badge${classe ? " " + classe : ""}" title="${escapeHtml(aide)}">${nom} ${t}</span>`;
}

// Les deux seuils de la TENDANCE, et pourquoi ils ne sont pas symetriques.
//
// `acceleration` est bornee dans [-1, +1] et porte un BIAIS STRUCTUREL que son
// propre docstring documente : un nombre IMPAIR de citations regulierement
// espacees penche de +1/n, donc TROIS citations equidistantes valent +0,33 et
// non 0. Or trois est precisement le plancher par defaut (`citations_min`). Un
// seuil « monte » place sous 0,33 qualifierait donc de montee la regularite la
// plus plate possible du cas le plus frequent. On exige 0,34, strictement
// au-dessus de ce plancher : au-dela de trois citations le biais ne fait que
// diminuer, le seuil est donc conservateur dans le bon sens -- on prefere ne pas
// annoncer une montee que l'annoncer a tort.
const ACCELERATION_MONTE = 0.34;
const ACCELERATION_RETOMBE = -0.2;

// « On commence a en parler » contre « on en parle beaucoup » : c'est LA lecture
// que ce panneau existe pour rendre immediate. Le libelle porte le sens, le
// nombre reste a cote -- un mot sans sa mesure n'est pas verifiable.
function badgeTendance(acceleration) {
  const t = mesure(acceleration, 2);
  if (t == null) {
    return '<span class="badge tendance inconnu" title="L\'accélération compare la densité de la seconde moitié de la fenêtre à celle de la première. Elle demande au moins trois citations datées et un étalement suffisant : ici la matière manque.">tendance inconnue</span>';
  }
  const v = Number(acceleration);
  const [classe, libelle] = v >= ACCELERATION_MONTE
    ? ["monte", "↗ on commence à en parler"]
    : v <= ACCELERATION_RETOMBE
      ? ["retombe", "↘ ça retombe"]
      : ["stable", "→ régulier"];
  return `<span class="badge tendance ${classe}" title="Accélération : densité de la seconde moitié de la fenêtre contre la première, bornée dans [-1, +1]. Seuil « monte » à ${ACCELERATION_MONTE} — au-dessous, trois citations régulières suffiraient à le franchir sans qu\'il monte.">${libelle} ${t}</span>`;
}

// Les comptes auxquels une fiche peut etre liee a la main : sources Instagram
// ACTIVES de categorie artiste, c'est-a-dire exactement ce que le pipeline
// appelle « artiste suivi » (`comptes_artistes.IndexComptes`). Lu une fois par
// chargement du panneau, et son ECHEC est une information : le selecteur est
// alors desactive AVEC SA RAISON ecrite a cote, jamais gris et muet.
let comptesSuivis = null;        // [{id, name}] ou null si illisible
let comptesSuivisRaison = "";

async function chargerComptesSuivis() {
  try {
    const reponse = await fetch("/sources");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    const sources = await reponse.json();
    comptesSuivis = sources
      .filter((s) => s.type === "instagram" && s.categorie === "artiste" && s.active)
      .sort((a, b) => a.name.localeCompare(b.name));
    comptesSuivisRaison = comptesSuivis.length
      ? ""
      : "aucune source Instagram active de catégorie artiste en base";
  } catch (erreur) {
    comptesSuivis = null;
    comptesSuivisRaison = "sources illisibles (" + erreur.message + ")";
  }
}

function reglagesArtistes() {
  const params = new URLSearchParams({
    window_days: document.getElementById("art-fenetre").value,
    citations_min: document.getElementById("art-citations-min").value,
    limit: document.getElementById("art-limite").value,
  });
  const pic = document.getElementById("art-min-emergence").value;
  if (pic) params.set("min_emergence", pic);
  if (document.getElementById("art-inclure-suivis").checked) params.set("inclure_suivis", "true");
  return params;
}

async function loadArtistesPanel() {
  const list = document.getElementById("artistes-list");
  list.innerHTML = "Chargement…";
  document.getElementById("artistes-aide").textContent =
    "Classé par émergence MOYENNE des citations principales de la fenêtre, puis par "
    + "accélération, puis par volume — jamais par volume seul, qui remonte "
    + "mécaniquement les artistes les plus couverts, donc les plus célèbres. "
    + "Clique une ligne pour lire les citations : juger sur pièces, pas sur un score.";
  const params = reglagesArtistes();
  await chargerComptesSuivis();
  let signaux;
  try {
    const reponse = await fetch(`/artists?${params}`);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status} ${(await reponse.text()).slice(0, 200)}`);
    signaux = await reponse.json();
  } catch (erreur) {
    if (panneau !== "artistes") return;
    afficherErreur(list, "Échec du chargement des artistes : " + erreur.message, loadArtistesPanel);
    document.getElementById("count").textContent = "";
    return;
  }
  // Meme lecon que `load()` : un chargement qui se termine APRES un changement
  // de panneau ne doit pas reecrire le compteur de l'entete.
  if (panneau !== "artistes") return;
  document.getElementById("count").textContent =
    `${signaux.length} artiste${signaux.length > 1 ? "s" : ""}`;
  if (!signaux.length) {
    list.innerHTML = '<div id="empty">Aucun artiste ne passe ces réglages — baisse le plancher de citations, élargis la fenêtre, ou inclus les comptes déjà suivis.</div>';
    return;
  }
  list.innerHTML = "";
  signaux.forEach((s, rang) => list.appendChild(ligneArtiste(s, rang + 1)));
}

function ligneArtiste(s, rang) {
  const row = document.createElement("div");
  row.className = "artiste-row";
  row.innerHTML = `
    <div class="artiste-head">
      <div><span class="rang"></span> <span class="nom"></span></div>
      <div class="sub"></div>
      <div class="artiste-metrics"></div>
    </div>
    <div class="lier-compte" hidden></div>
    <div class="artiste-citations" hidden></div>`;
  row.querySelector(".rang").textContent = `#${rang}`;
  row.querySelector(".nom").textContent = s.artist.name;
  // `mentions_count` est le TOTAL DEPUIS TOUJOURS (les citations ne sont jamais
  // purgees), `citations` le total de la FENETRE : deux nombres differents qu'il
  // ne faut pas confondre, d'ou deux libelles explicites.
  row.querySelector(".sub").textContent =
    `fiche #${s.artist.id} · ${s.artist.slug} · cité du ${fmtDate(s.artist.first_seen_at)} `
    + `au ${fmtDate(s.artist.last_seen_at)} · ${s.artist.mentions_count} citation`
    + `${s.artist.mentions_count > 1 ? "s" : ""} depuis toujours`;

  // « Deja suivi » est un FAIT, pas un jugement de notorieté : si Kinda suit
  // deja le compte, la question « merite-t-il d'etre suivi ? » est repondue.
  // C'est l'action implicite du panneau, donc elle se lit en premier.
  const suivi = s.deja_suivi
    ? `<span class="badge suivi" title="Kinda suit déjà ce compte Instagram (source #${s.artist.source_instagram_id} — ${escapeHtml(sourceName(s.artist.source_instagram_id))}) : sa question A&amp;R est déjà répondue.">✓ déjà suivi — ${escapeHtml(sourceName(s.artist.source_instagram_id))}</span>`
    : '<span class="badge a-decouvrir" title="Aucun compte Instagram suivi n\'est rattaché à cette fiche.">à découvrir</span>';
  row.querySelector(".artiste-metrics").innerHTML = `
    ${badgeTendance(s.acceleration)}
    ${suivi}
    ${badgeMesure("émergence moyenne", s.emergence_moyenne, 1, "moyenne des notes d'émergence des citations PRINCIPALES de la fenêtre — la clé de tri", "moyenne")}
    <span class="badge">${s.citations} citation${s.citations > 1 ? "s" : ""} sur la fenêtre</span>
    <span class="badge" title="Une citation est principale si l'artiste porte l'actu, et non s'il n'est qu'un nom de passage (rang, titre, ou titre qui ne singularise personne).">${s.citations_principales} principale${s.citations_principales > 1 ? "s" : ""}</span>
    ${badgeMesure("pic fenêtre", s.emergence_max_principale, 0, "meilleure note d'émergence d'une citation principale DANS la fenêtre")}
    ${badgeMesure("pic historique", s.artist.max_emergence, 0, "Artist.max_emergence : un cliquet, la meilleure note d'émergence principale jamais vue")}
    ${badgeMesure("vélocité", s.velocite, 2, "citations par heure sur l'étalement de la fenêtre")}`;

  posterLiaison(row.querySelector(".lier-compte"), s);

  const zone = row.querySelector(".artiste-citations");
  let charge = false;
  row.querySelector(".artiste-head").onclick = async () => {
    zone.hidden = !zone.hidden;
    if (zone.hidden || charge) return;
    charge = true;
    zone.textContent = "Chargement…";
    try {
      const reponse = await fetch(`/artists/${s.artist.id}/mentions?limit=100`);
      if (!reponse.ok) throw new Error("HTTP " + reponse.status);
      remplirCitations(zone, await reponse.json());
    } catch (erreur) {
      zone.textContent = "Échec du chargement des citations : " + erreur.message;
      charge = false;
    }
  };
  return row;
}

// Les citations, titre et source : c'est ce qui permet de juger sur pieces
// plutot que sur un score. Construit en DOM, parce que les renvois sont des
// elements cliquables (`renvoiArticle`).
function remplirCitations(zone, mentions) {
  zone.innerHTML = "";
  if (!mentions.length) {
    const vide = document.createElement("div");
    vide.className = "cit-row";
    vide.textContent = "Aucune citation.";
    zone.appendChild(vide);
    return;
  }
  for (const m of mentions) {
    const ligne = document.createElement("div");
    ligne.className = "cit-row";
    ligne.innerHTML = `
      <span class="tete"></span>
      <span class="titre"><a target="_blank" rel="noopener"></a></span>
      <span class="apres"></span>
      <span class="renvois"></span>`;
    // `principal` a NULL = inconnu (citations anterieures a la migration 0020)
    // et vaut PRINCIPAL partout : la regle du doute du depot. On ne l'affiche
    // donc pas comme « de passage », mais on ne pretend pas non plus l'avoir
    // mesure.
    const tete = ligne.querySelector(".tete");
    if (m.principal === false) {
      tete.classList.add("passage");
      tete.textContent = "de passage";
      tete.title = "L'artiste n'est pas le sujet de cette actu : sa note d'émergence ne compte pas pour lui.";
    } else {
      tete.textContent = m.principal === true ? "principale" : "principale ?";
      tete.title = m.principal === true
        ? "L'artiste porte cette actu."
        : "Rang perdu (citation antérieure à la migration 0020) : lue comme principale, règle du doute.";
    }
    const lien = ligne.querySelector("a");
    lien.href = m.url;
    lien.textContent = m.title;
    ligne.querySelector(".apres").textContent =
      `· ${sourceName(m.source_id)} · ${fmtDate(m.mentioned_at) || "?"}`
      + ` · pertinence ${m.relevance_score ?? "inconnue"}`
      + ` · émergence ${m.emergence_score ?? "inconnue"}`;
    // `article_id` a NULL : l'article a ete purge (2 jours de retention), la
    // citation lui survit (ON DELETE SET NULL). C'est tout l'interet de cette
    // table, et le renvoi ne peut alors pas exister.
    poserParties(ligne.querySelector(".renvois"), [
      m.article_id != null ? renvoiArticle(m.article_id, m.url) : "archivée",
    ]);
    // Une citation vivante : l'actu existe encore, elle se programme comme sur sa carte.
    if (m.article_id != null) {
      const hote = nouvelElement("div", "prog-hote");
      ligne.appendChild(hote);
      poserProgrammer(hote, m.article_id, "Programmer");
    }
    zone.appendChild(ligne);
  }
}

// Le SEUL geste d'ecriture du panneau : rattacher une fiche a son compte suivi
// quand le nom ne suffit pas (« Guy-Man » et son compte). C'est la raison pour
// laquelle `PATCH /artists/{id}` garde `source_instagram_id` apres la
// disparition de `tracked` (migration 0021).
function posterLiaison(zone, s) {
  zone.hidden = false;
  zone.innerHTML = `
    <span class="libelle">Compte Instagram suivi :</span>
    <select></select>
    <span class="verdict"></span>
    <span class="pourquoi-desactive"></span>`;
  const sel = zone.querySelector("select");
  const verdict = zone.querySelector(".verdict");
  const pourquoi = zone.querySelector(".pourquoi-desactive");
  const vide = document.createElement("option");
  vide.value = "";
  vide.textContent = "— aucun —";
  sel.appendChild(vide);
  // Un controle DESACTIVE imprime sa raison : un selecteur gris et muet ne dit
  // pas s'il manque des comptes ou si la lecture a echoue.
  if (comptesSuivis === null || !comptesSuivis.length) {
    sel.disabled = true;
    pourquoi.textContent = "liaison impossible — " + comptesSuivisRaison;
    return;
  }
  for (const compte of comptesSuivis) {
    const opt = document.createElement("option");
    opt.value = compte.id;
    opt.textContent = compte.name;
    sel.appendChild(opt);
  }
  sel.value = s.artist.source_instagram_id == null ? "" : String(s.artist.source_instagram_id);
  sel.onclick = (evenement) => evenement.stopPropagation();
  sel.onchange = async () => {
    const precedente = s.artist.source_instagram_id == null ? "" : String(s.artist.source_instagram_id);
    verdict.className = "verdict";
    verdict.textContent = "…";
    try {
      const reponse = await fetch(`/artists/${s.artist.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_instagram_id: sel.value ? Number(sel.value) : null }),
      });
      if (!reponse.ok) {
        const corps = await reponse.json().catch(() => ({}));
        throw new Error(typeof corps.detail === "string" ? corps.detail : "HTTP " + reponse.status);
      }
      const maj = await reponse.json();
      s.artist.source_instagram_id = maj.source_instagram_id;
      verdict.textContent = "✓";
      // Le lien change la reponse A&R de cette ligne (« deja suivi » contre « a
      // decouvrir »), et l'exclusion par defaut de la shortlist : on recharge.
      loadArtistesPanel();
    } catch (erreur) {
      // Retour en arriere VISIBLE : le selecteur ne doit jamais afficher une
      // valeur que la base n'a pas.
      sel.value = precedente;
      verdict.classList.add("ko");
      verdict.textContent = "⚠";
      alert("Lien non enregistré (" + erreur.message + ") — « " + s.artist.name + " » est inchangé.");
    }
  };
}

for (const id of ["art-fenetre", "art-citations-min", "art-min-emergence", "art-limite", "art-inclure-suivis"])
  document.getElementById(id).onchange = loadArtistesPanel;

// --- Bandeau de supervision ---------------------------------------------
// « La machine tourne-t-elle, et qu'a-t-elle fait en mon nom ? » Une seule
// requete (GET /supervision), aucun appel paye, aucun appel reseau vers Meta ni
// Anthropic : tout est deja ecrit en base et dans les fichiers d'etat.
//
// REGLE QUI GOUVERNE CE CODE : une valeur qu'on n'a pas pu lire s'affiche
// INCONNUE, jamais « tout va bien ». Donc aucun defaut vert nulle part -- le
// bandeau part en `inconnu`, une requete en echec le laisse en `inconnu` avec sa
// raison, et le niveau global vient du serveur (jamais recalcule ici, ou un
// `|| "ok"` bien intentionne le casserait).
const SUP_ICONES = { ok: "✅", attention: "⚠️", panne: "⛔", inconnu: "❔" };
const SUP_GLOBAL = {
  ok: "✅ Tout tourne",
  attention: "⚠️ À regarder",
  panne: "⛔ Panne en cours",
  inconnu: "❔ État inconnu",
};
let supDetailsOuverts = false;
// Au-dela de deux raisons NON BLOQUANTES, le surplus se replie : l'entete est
// `sticky` et sa hauteur se paie en zone utile. Les pannes, elles, ne se
// replient jamais.
const SUP_RAISONS_DEPLIEES = 2;
let supRaisonsOuvertes = false;

document.getElementById("sup-plier").onclick = () => {
  supDetailsOuverts = !supDetailsOuverts;
  const zone = document.getElementById("sup-details");
  zone.hidden = !supDetailsOuverts;
  document.getElementById("sup-plier").setAttribute("aria-expanded", String(supDetailsOuverts));
};

function supInconnu(raison) {
  return {
    niveau: "inconnu",
    releve_le: null,
    voyants: [{ cle: "supervision", libelle: "Supervision", niveau: "inconnu", valeur: "?", raison, details: [] }],
  };
}

function rendreSupervision(etat) {
  const bandeau = document.getElementById("supervision");
  const niveau = SUP_ICONES[etat.niveau] ? etat.niveau : "inconnu";
  bandeau.className = "supervision niv-" + niveau;
  document.getElementById("sup-global").textContent = SUP_GLOBAL[niveau];
  document.getElementById("sup-releve").textContent = etat.releve_le
    ? "relevé " + fmtDate(etat.releve_le)
    : "relevé : inconnu";

  const voyants = Array.isArray(etat.voyants) ? etat.voyants : [];
  const pills = document.getElementById("sup-pills");
  pills.innerHTML = "";
  for (const v of voyants) {
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const pill = document.createElement("span");
    pill.className = "sup-pill niv-" + niv;
    pill.innerHTML = `${SUP_ICONES[niv]} <b></b> <span></span>`;
    pill.querySelector("b").textContent = v.libelle;
    pill.querySelector("span").textContent = v.valeur;
    pills.appendChild(pill);
  }

  // Les raisons des voyants qui ne sont pas au vert : visibles, pas en infobulle.
  //
  // REPLI, parce que l'entete est `sticky` : cinq raisons lui faisaient ~230 px
  // et mangeaient autant de zone utile. Mais gagner de la place ne doit jamais
  // faire disparaitre une panne -- une PANNE est toujours rendue, le repli ne
  // touche que les raisons `attention`/`inconnu`, et le bouton dit combien il
  // en cache, ce qui n'est donc pas un masquage mais un pli.
  const raisons = document.getElementById("sup-raisons");
  raisons.innerHTML = "";
  const ligneRaison = (v) => {
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const ligne = document.createElement("div");
    ligne.className = "sup-raison niv-" + niv;
    ligne.innerHTML = `${SUP_ICONES[niv]} <b></b> — <span></span>`;
    ligne.querySelector("b").textContent = v.libelle;
    ligne.querySelector("span").textContent = v.raison;
    return ligne;
  };
  const aRaison = voyants.filter((v) => v.niveau !== "ok" && v.raison);
  const pannes = aRaison.filter((v) => v.niveau === "panne");
  const secondaires = aRaison.filter((v) => v.niveau !== "panne");
  for (const v of pannes) raisons.appendChild(ligneRaison(v));
  const replie = secondaires.length > SUP_RAISONS_DEPLIEES && !supRaisonsOuvertes;
  const montrees = replie ? secondaires.slice(0, SUP_RAISONS_DEPLIEES) : secondaires;
  for (const v of montrees) raisons.appendChild(ligneRaison(v));
  if (secondaires.length > SUP_RAISONS_DEPLIEES) {
    const caches = secondaires.length - montrees.length;
    const plus = document.createElement("button");
    plus.className = "sup-raison-plus";
    plus.setAttribute("aria-expanded", String(!replie));
    plus.textContent = replie
      ? `+ ${caches} autre${caches > 1 ? "s" : ""} point${caches > 1 ? "s" : ""} à regarder`
      : "Replier les points à regarder";
    plus.onclick = () => {
      supRaisonsOuvertes = !supRaisonsOuvertes;
      rendreSupervision(etat);
    };
    raisons.appendChild(plus);
  }

  const details = document.getElementById("sup-details");
  details.innerHTML = "";
  for (const v of voyants) {
    if (!Array.isArray(v.details) || !v.details.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "sup-bloc";
    bloc.innerHTML = "<b></b>";
    bloc.querySelector("b").textContent = v.libelle + " : ";
    bloc.appendChild(document.createTextNode(v.details.join(" · ")));
    details.appendChild(bloc);
  }
  details.hidden = !supDetailsOuverts;
  mesurerEntete();
}

// `scroll-padding-top` ne peut pas etre fige en CSS : le bandeau grandit avec le
// nombre de raisons affichees, et une ancre atterrirait sous l'entete `sticky`.
// On publie donc la hauteur REELLE dans `--entete-h`.
function mesurerEntete() {
  const entete = document.querySelector("header");
  if (!entete) return;
  document.documentElement.style.setProperty("--entete-h", entete.offsetHeight + "px");
}

async function chargerSupervision() {
  try {
    const reponse = await fetch("/supervision");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    rendreSupervision(await reponse.json());
  } catch (erreur) {
    rendreSupervision(supInconnu(
      "supervision injoignable (" + erreur.message + ") : rien ne dit que la machine tourne."));
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

(async () => {
  // La grille ne depend PAS de ce filtre, et son chargement ne doit donc jamais
  // dependre de lui : `load()` etait la derniere instruction d'un bloc sans
  // rattrapage, si bien qu'un `/sources` en echec laissait l'ecran d'accueil sur
  // « Chargement… » pour toujours -- sans un mot, et sans que la grille,
  // parfaitement joignable, soit meme tentee.
  // Les reglages d'abord : ils n'alimentent que des TEXTES, et leur echec est
  // deja traite (la phrase perd son chiffre). `await` ici plutot qu'en
  // parallele, pour que le premier rendu de la grille porte deja la bonne
  // cadence au lieu d'une phrase amputee reparee au rafraichissement suivant.
  await chargerReglages();
  const sel = document.getElementById("source");
  try {
    const reponse = await fetch("/sources");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    for (const s of await reponse.json()) {
      sourceNames[s.id] = s.name;
      const opt = document.createElement("option");
      opt.value = s.id; opt.textContent = (s.active ? "" : "⏸ ") + s.name;
      sel.appendChild(opt);
    }
  } catch (erreur) {
    // Inconnu, jamais « tout va bien » : le filtre dit qu'il n'a pas pu etre lu.
    sel.querySelector("option").textContent = "⚠ sources illisibles (" + erreur.message + ")";
  }
  load();
})();

mesurerEntete();
addEventListener("resize", mesurerEntete);

chargerSupervision();
// Le bandeau vit sa vie : il doit rester vrai meme quand l'utilisateur laisse
// l'onglet ouvert toute la journee sur un panneau.
setInterval(chargerSupervision, 60000);
</script>
</body>
</html>
