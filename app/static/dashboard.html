<title>Kinda — console</title>
<style>
  /* --- La charte Kinda, et pourquoi elle tient sur un fond SOMBRE ----------
     La console portait un violet #7c5cff qui n'avait aucun rapport avec la
     marque, et qui en plus ne passait pas : 4,37:1 sur le fond sombre (sous le
     seuil de 4,5), et 4,35:1 pour du blanc sur un bouton violet plein -- un
     echec. Le rose de la charte, lui, mesure 8,60:1 sur le meme fond, presque
     le double. Le fond crème de la charte n'est PAS repris : la console se
     regarde des heures et le sombre sert la densite de donnees. La marque y
     entre en ACCENT.

     Le piege, contre-intuitif et mesure : du blanc sur le rose plein ne vaut
     que 2,21:1 -- interdit. Un bouton rose plein porte donc un texte SOMBRE
     (`--sur-accent`, 8,60:1). Toute surface rose pleine suit cette regle.

     Et une separation qui compte plus que l'harmonie : le ROSE NE SIGNALE
     JAMAIS UNE PANNE. Rose (teinte 330) et rouge d'alerte se ressemblent assez
     pour qu'une panne se fonde dans l'accent -- un defaut qui ne casse rien a
     l'ecran, il rend seulement la supervision aveugle, et la supervision est ce
     qui a ete construit en premier. Les rouges d'alerte sont donc ramenes a la
     teinte 0 EXACTE (#ff8a8a etait a 0 mais aussi pale que le rose ; #ff9aa5
     penchait carrement vers lui, a 353) et montes en saturation : ils lisent
     comme une alarme, pas comme un accent. `tests/dashboard/test_dashboard_marque.py`
     echoue si l'un d'eux se rapproche du rose. */
  :root {
    --bg: #101014; --panel: #18181f; --border: #2a2a35;
    --text: #fef1f7; --muted: #8a8a99;
    /* Le rose signature, mesure au pixel sur le PDF de marque. A un cheveu du
       #fd8bc3 des gabarits de post (`app/content/layout.py`) : la charte etait
       deja dans le produit PUBLIE, elle manquait seulement a la console. */
    --accent: #fb8ac2;
    --accent-clair: #fbacd3;   /* le surlignage de la charte : texte sur sombre */
    --accent-doux: #3a1f33;    /* le rose fondu dans le fond : etat « actif » */
    --sur-accent: #101014;     /* le seul texte admis sur du rose PLEIN */
    --creme: #fef1f7;
    /* Le langage « attention », tenu a l'ecart du rose (voir ci-dessus). */
    --hot: #ff4d4d;
    --alerte: #ff7b7b; --alerte-douce: #ff8c8c;
    --alerte-fond: #3d1f1f; --alerte-bord: #5a2a2a;
    /* Une grotesque CONDENSEE pour les titres, chasse etroite et interlettrage
       serre, comme les phrases-manifestes de la charte. AUCUNE police web :
       le fichier reste autonome, sans CDN et sans dependance bloquante au
       premier rendu. macOS fournit « Avenir Next Condensed » (quatre graisses
       reelles, donc un 600 vrai et non synthetise) et « DIN Condensed » ; les
       suivantes couvrent Linux/Windows, et le dernier repli est exactement la
       pile d'aujourd'hui -- une machine sans condensee rend la page telle
       qu'elle etait, jamais cassee. Le texte courant, lui, ne change pas :
       « pas de fantaisie dans le texte courant ». */
    --police-titre: "Avenir Next Condensed", "DIN Condensed", "Archivo Narrow",
      "Roboto Condensed", "Arial Narrow", -apple-system, "Segoe UI", sans-serif;
    /* Les deux signes de marque, en `data:` plutot que servis : `app/main.py`
       rend la page par un `FileResponse` unique et ne monte aucun
       `StaticFiles`. Les PNG de `app/static/marque/` restent la source de
       verite ; `scripts/outillage/inliner_marque.py` en derive les deux URI (ici
       l'etoile en MASQUE, 1,9 ko, que le CSS recolore ; le logo, aplati a la
       creme de la charte, 13,7 ko, va dans l'attribut `src` de son `<img>`,
       seul endroit ou un `alt` lui donne un nom accessible). La page reste UN
       SEUL FICHIER, et le logo est la au premier rendu. */
    --etoile-kinda: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABGCAQAAADWOVpIAAAFe0lEQVR42sWaXYhVVRTHf3uf48xDMzrWVNpF07KExHzoY5KKwHCQiDRstNDXfKgoMAikl6KoKBGhwgeRiiiCLAhf8kGwD4ZKnEGyh7DJb5sUZ2RGzWnu2f8ezrmfc+45Z2bOndZ+udxzz16/vfZae6+99kWkNiu0Vr0a03Ht1HIh5MlkeDNDy6Z+kwKVZFjva2EEkVWNidoUAKyMFmlI0rgkF4Gc08u6TsjKJii18uTJVikOvzOTA0DvSiqWLeCiz/16ItYORp78OjCrdrWrtWZY0WcjEsQg2ujndoSt+l44POBTXmcAGw4Fg8VR6tDjNpayhGXMp4P5GEY4x3G+p5fTgMVFfaWM/1HFS6BA0hn11DllQU/pee3Szxpt8OYFfaibo95TADyhrTUTUCvjkqQPdKMQ6tQ6faO/q547FVVUUUHUws+S9Lu6QoR0gPcSAKRATtKf+kR7dbZGbfgkTpzGJQ3qVhnZtPBBXycChBDVI3bKIv9K2iNkbYoLtrAEMEmeisVRJEAYvJTfUnZR0cNinE35oU9Lhu4sfmbVpTdEO49AGoCLgiV/EdCZDuDjN0W9w3KZb5MBDFCgkOoDU1FvMGzlKF6aBYYYasroxSvsxhL4KbM0wgigHG3gsAyxha/CxdhPDRcvZ9eznGYdfXgEYTjMZBQIGGU9ffih+nSAFlpzBTC8wSF8ipUFIWmxMCxlYQbM7OY/we7yRpwKIMTGirFycD/RyyXIBmARBTbnugoY9k/oL3Er3pm6E2aXoqR9mlWfnCblQit0VS7j9pomgaQTKpTyoDQAI6sW7c9t/E5O41odl8rHA/hCW2pSjemOP9CrUb91LS4r9ikyj8PMyykAheECdzISZc91vh6nfi57uCW3+AdHJ4/hYvubcA5CK3QoR/OXXPCYOie6YK0PhA7ynC7mGHzVCHvlyTSKgvBBQV+WYzZvKUraI1tvhcrpFa3XgJQ5sZ4awseaXRuMlIneatrYaxEO6qZqhFD9HH1RdfhuNsJR3VVZExBq08Gmmn4iwkmtKlkBtWU4fOWPMKrHQwS0bYbVVxDWCFmjYWZjcs/80yTAY5CVnLDM4f8Qj4B5vAOWz7E4AjTDCBbxJPf7vIDPxsgs4fYzM9NhcLTQY7nE02xgP2N4eBgMAUHTzsT1ssDIRMa/h4fo5m4KZQsEmNw25EZ5wi9hQuKVy2vXs4wHuJf7WNz00QvDsUpGZDFVVb4OulhANz25HkwnAgzUp2Sh0UsgqzgwKQCHsJMCLvoTqIIIxEcMM0ZrZoRSNbWIoeRZpSXONfAn32/YWYDjEuOZD6fCcISzrGZW7MJTsasiLGG46qeUJ4Zoy2QBh+Uo3Zyni2dYxGKGOctJ/uA8hla6WMsdMe+dalysNgifPpY3yGbrM9sxuvmxVHZgFuN1v5nLRh7kIh4dWG7DQwTsSL5k8PRdpvy4KGlblGRUbgTC+4JSm3j2sjLCT3SpgMFoMpLN7/EDO7AE5aO3qT2ER/GlaO4r/mDTakTnMpVdLvMSY9gqVMW6dW0JEMD5KXXCvtTNyeHxNv3l2c9eLSLtwsIKrcxQKf9JbTU3Q5Nqaf59gWsJXiDENbZyubzwTCEtSDbTIGcSABweu+idpPnJVqIpXVjsa5i0BpJ+0w2NbgTzmQIqFb0Y+wS8yMWpm59MFQCTsPhu5wDe9LInO+WSg8dh3sRMN3mzU675XuHZ6Xh/NgADnIo9Vlheo3+65s8GcDxGvc9nbM9Dfbar29piZVHSkekGX9bbcyPUroGqykEg6S8tjys3NWMdEJZRPiq7msPyDxv4NSfzp05BWLjr0DEpunYe1+ZJ/Xcip79wPKxhSdIVbcpXfRaAEGGVTuu81uStXvwH2eXIuAs0+QMAAAAASUVORK5CYII=);

  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(16,16,20,.94);
           backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
           padding: 14px 20px; }
  h1, h2 { font-family: var(--police-titre); letter-spacing: 0; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 9px; }
  /* Le mot-symbole remplace le « 🎧 Kinda » textuel. C'est une `<img>` et non un
     fond CSS : son `alt` donne le nom accessible, sans texte masque a
     entretenir. Hauteur fixe, largeur deduite du ratio du lettrage. */
  h1 .logo-kinda { height: 30px; width: auto; display: block; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px;
             font-family: -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; }
  /* L'etoile dessinee a la main, motif recurrent de la charte. Un MASQUE, donc
     recoloree par `background-color` : rose la ou elle ponctue, jamais un
     bloc d'image a part. Avec parcimonie -- c'est un outil de travail. */
  .etoile { display: inline-block; background-color: currentColor;
    -webkit-mask: var(--etoile-kinda) no-repeat center / contain;
    mask: var(--etoile-kinda) no-repeat center / contain;
    width: 1em; height: 1.1em; vertical-align: -.15em; }
  /* --- Navigation et filtrage : DEUX PORTEES, donc deux rangees ----------
     Les douze boutons de l'entete partageaient `.chip`, une rangee et une
     apparence ; seul `data-preset` separait « change le filtre de la grille »
     (portee grille) de « remplace tout l'ecran » (portee application). Ce
     n'etait pas une redondance a supprimer -- deux portees ne sont pas une
     repetition -- mais une COMPOSITION a ecrire : la navigation prend sa
     rangee, titree, en onglets RECTANGULAIRES sur la ligne du titre ; les
     filtres gardent la leur, en PASTILLES, et quittent l'ecran des qu'un
     panneau non-grille est affiche. Deux formes distinctes pour deux portees
     distinctes, et la hauteur d'entete rendue (la rangee de navigation
     rejoint celle du titre au lieu de s'ajouter). */
  .entete-haut { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
  .rangee-titre { font-family: var(--police-titre);
          font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
          color: #6a6a78; }
  nav.nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
  .onglet { border: 1px solid var(--border); background: #14141a; color: var(--muted);
          border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12.5px; }
  .onglet:hover { color: var(--text); border-color: #3a3a48; }
  .onglet.on { background: var(--accent-doux); border-color: var(--accent); color: var(--creme);
          font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  /* `.bar` porte `display: flex`, qui l'emporterait sur l'attribut `hidden`. */
  .bar[hidden] { display: none; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text);
          border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 12.5px; }
  .chip.on { border-color: var(--accent); background: var(--accent-doux); }
  /* --- Renvois entre panneaux ---------------------------------------------
     « article #123 », « post 45 » et « IG 17894… » etaient du texte inerte :
     chaque trajet d'un panneau a l'autre etait un copier-coller, sur l'outil
     de travail quotidien. Souligne en pointille : un renvoi interne, pas un
     titre d'actu. */
  .ref { font: inherit; color: var(--accent-clair); background: none; border: none; padding: 0;
          cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }
  .ref:hover { color: var(--creme); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px;
         display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  main[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card.st-used { opacity: .45; }
  .card.st-reviewed { border-color: #3d5c3d; }
  .thumb { width: 100%; height: 165px; object-fit: cover; background: #0c0c10; display: block; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .scores { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .badge { border-radius: 6px; padding: 2px 7px; background: #23232d; color: var(--muted); }
  .badge.rel { background: var(--accent-doux); color: var(--accent-clair); }
  .badge.hot-high { background: var(--alerte-fond); color: var(--alerte); }
  .badge.visuel { background: #1f2d3d; color: #8ac4ff; }
  .badge.sans-visuel { background: #3d2a1f; color: #ffb38a; }
  /* Hors file : meme rouge que .render-warning, le langage « attention » deja en
     service. La raison est ECRITE a cote, pas seulement en infobulle. */
  .badge.exclu { background: var(--alerte-fond); color: var(--alerte); flex-basis: 100%;
    line-height: 1.35; }
  a.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 15.5px;
    font-family: var(--police-titre); letter-spacing: .1px; }
  a.title:hover { color: var(--accent-clair); }
  .summary { color: var(--muted); font-size: 12.5px; }
  .meta { color: #6a6a78; font-size: 11px; margin-top: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .actions button.reintegrer { flex-basis: 100%; border-color: var(--alerte-bord); color: var(--alerte); }
  /* --- Programmer : le selecteur, sur la carte comme sur la ligne de creneau --- */
  .obs-row:has(.prog-hote), .cit-row:has(.prog-hote), .post-row:has(> .prog-zone:not(:empty)) { flex-wrap: wrap; }
  .prog-hote { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; min-width: 0; }
  .prog-etat { font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
  .prog-etat.note-file { color: var(--muted); }
  .prog-resultat { flex-basis: 100%; }
  .prog-zone { flex-basis: 100%; min-width: 0; }
  .prog-zone:empty { display: none; }
  .prog-selecteur { margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    background: #17171f; font-size: 12px; display: flex; flex-direction: column; gap: 6px; cursor: default;
    max-height: 420px; overflow-y: auto; min-width: 0; }
  .prog-entete { color: var(--muted); overflow-wrap: anywhere; }
  .prog-mode { color: #ffb38a; font-weight: 600; }
  .prog-jour { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .prog-ligne { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .prog-selecteur button.prog-option { flex: none; width: 100%; text-align: left; padding: 6px 8px; display: block;
    background: #20202a; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 12px; white-space: normal; overflow-wrap: anywhere; }
  .prog-selecteur button.prog-option:hover:enabled { border-color: var(--accent); }
  .prog-selecteur button.prog-option:disabled { opacity: .55; cursor: not-allowed; }
  .prog-selecteur button.prog-option.choisie { border-color: var(--accent); }
  .prog-detail { display: block; color: var(--muted); font-size: 11px; }
  .prog-raison { color: #ffb38a; font-size: 11px; overflow-wrap: anywhere; }
  .prog-annonce { color: #ffb38a; font-size: 11px; overflow-wrap: anywhere; }
  .prog-validation { border-left: 2px solid var(--accent); padding: 4px 0 4px 8px; display: flex;
    flex-direction: column; gap: 5px; overflow-wrap: anywhere; }
  .prog-gestes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prog-selecteur .prog-gestes button { flex: 0 1 auto; padding: 5px 10px; border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 6px; cursor: pointer; font-size: 12px; white-space: normal; text-align: left; }
  .prog-selecteur .prog-gestes button.confirmer { border-color: var(--accent); }
  .verif-publication { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px;
    font-size: 12px; color: var(--alerte); }
  .verif-publication[hidden] { display: none; }
  .actions button { flex: 1; border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 6px 0; cursor: pointer; font-size: 12px; }
  .actions button:hover { border-color: var(--accent); }
  /* L'etoile de la charte sur l'etat vide : le seul endroit assez calme pour
     qu'un signe de marque ne dispute rien a une donnee. */
  #empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
  #empty::before { content: ""; display: block; margin: 0 auto 14px; width: 30px; height: 33px;
    background-color: var(--accent); opacity: .55;
    -webkit-mask: var(--etoile-kinda) no-repeat center / contain;
    mask: var(--etoile-kinda) no-repeat center / contain; }
  /* Un etat d'ECHEC TERMINAL, avec sa raison et une relance. Sans relance, une
     base lente (`attendre_base`) laissait « Chargement… » a l'ecran pour
     toujours : indistinguable d'un chargement en cours. */
  .zone-erreur { grid-column: 1/-1; text-align: center; padding: 50px 0; }
  .zone-erreur .pourquoi { color: var(--alerte-douce); font-size: 13px; margin-bottom: 12px; }
  .zone-erreur .relance { border: 1px solid var(--accent); background: var(--accent-doux); color: var(--accent-clair);
    border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 12.5px; }
  #sources-panel { max-width: 820px; margin: 0 auto; padding: 20px; }
  .src-form { display: grid; grid-template-columns: 1fr 160px; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .src-form input, .src-form select { background: #0c0c10; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .src-form .full { grid-column: 1/-1; }
  .src-form .hint { grid-column: 1/-1; color: var(--muted); font-size: 11.5px; margin-top: -4px; }
  /* Texte SOMBRE sur le rose plein : du blanc n'y vaudrait que 2,21:1. */
  .src-form button { grid-column: 1/-1; background: var(--accent); color: var(--sur-accent); border: none;
    border-radius: 8px; padding: 9px 0; cursor: pointer; font-weight: 600; }
  .src-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .src-row { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .src-row.off { opacity: .5; }
  .src-row .nm { font-weight: 600; }
  .src-row .u { color: var(--muted); font-size: 11.5px; word-break: break-all; }
  .src-row .grow { flex: 1; min-width: 0; }
  .src-row .tag { font-size: 10.5px; background: #23232d; color: var(--muted);
    border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  /* La sante de la source, sous son URL : `last_error` etait ecrit a chaque
     ingestion et n'apparaissait nulle part. Meme rouge que .render-warning. */
  .src-row .sante { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .src-row .sante.ko { color: var(--alerte-douce); }
  /* Le verdict de l'ecriture de categorie, a cote du selecteur : ce PATCH
     partait sans que personne ne lise la reponse (cf. `catSel.onchange`). */
  .src-row .cat-etat { font-size: 12px; color: #7ee2a0; width: 12px; text-align: center; }
  .src-row .cat-etat.ko { color: var(--alerte-douce); }
  .src-row .toggle { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px; white-space: nowrap; }

  /* --- Panneau Posts --- */
  #posts-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  #schedule-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  .mode-control { display: flex; margin-left: auto; border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden; }
  .mode-choix { border: none; background: var(--panel); color: var(--muted);
    padding: 6px 14px; cursor: pointer; font-size: 12.5px; border-left: 1px solid var(--border); }
  .mode-choix:first-child { border-left: none; }
  .mode-choix.on { background: var(--accent); color: var(--sur-accent); font-weight: 600; }
  .mode-choix.mode-reel { color: var(--alerte); }
  .mode-choix.mode-reel.on { background: var(--hot); color: var(--sur-accent); }
  .mode-explication { color: var(--muted); font-size: 11.5px; margin: 8px 0 16px; }
  .slot-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  /* Le titre est l'information qu'on vient verifier : les boutons le tronquaient
     (« Charlotte de Witte ann… ») a 1440 px. Il prend la ligne, le reste passe dessous. */
  #schedule-list .post-row { flex-wrap: wrap; }
  #schedule-list .post-row .grow { flex: 1 1 100%; }
  /* --- Une ligne de creneau HIERARCHISEE ---------------------------------
     Constat a l'ecran : « (creneau libre) » occupait la position de titre sur
     six lignes sur dix -- le texte le plus VISIBLE de la ligne etait une
     non-information. Pendant ce temps la vraie information (« creneau manque :
     gele mais jamais publie ») etait tassee en gris au milieu d'une phrase
     jointe par des « · », ou une erreur se noie.
     Remede en trois positions : l'HEURE prend la tete (c'est ce qu'un
     calendrier porte en premier, et c'est la seule information qu'un creneau
     libre possede vraiment) ; le titre la suit, efface quand il n'y en a pas ;
     et l'ERREUR a sa PROPRE ligne, dans le rouge d'alerte deja en service
     (.render-warning). Une panne y devient plus visible qu'avant, jamais
     moins -- c'est la regle qui prime sur toute compacite. */
  .slot-tete { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .slot-heure { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
    font-family: var(--police-titre);
    color: var(--text); white-space: nowrap; }
  .slot-titre { font-size: 14.5px; font-weight: 600; font-family: var(--police-titre);
    min-width: 0; overflow-wrap: anywhere; }
  .slot-titre.vide { font-weight: 400; font-style: italic; color: #6a6a78; }
  .slot-alerte { background: var(--alerte-fond); color: var(--alerte); border: 1px solid var(--alerte-bord);
    border-radius: 8px; padding: 5px 10px; font-size: 12.5px; margin-top: 6px; }
  .slot-alerte[hidden] { display: none; }
  /* Les quatre gestes portent desormais un LIBELLE : « 📌 » et « 📍 » sont deux
     actions OPPOSEES que seule l'inclinaison de l'icone distinguait, et un
     `title` ne se lit ni au premier coup d'oeil ni au lecteur d'ecran. */
  .slot-actions button { background: none; border: 1px solid #2c2c38; border-radius: 6px;
    cursor: pointer; padding: 3px 9px; color: var(--text); font-size: 12px; white-space: nowrap; }
  .slot-actions button:hover { border-color: var(--accent); }
  .status-pill.libre { background: #23232d; color: var(--muted); }
  .status-pill.programme { background: var(--accent-doux); color: var(--accent-clair); }
  .status-pill.gele { background: #1f2f3d; color: #8fd0ff; }
  .status-pill.publie { background: #1d3325; color: #7ee2a0; }
  .status-pill.apercu { background: #33301d; color: #e8d27a; }
  .status-pill.echec { background: #3d1f23; color: var(--alerte-douce); }
  .status-pill.manque { background: #2d2323; color: #c9a3a3; }
  .format-pill { font-size: 11px; border-radius: 999px; padding: 2px 8px; background: #23232d; color: var(--muted); white-space: nowrap; }
  .format-pill.reel { background: var(--accent-doux); color: var(--accent-clair); }
  .reels-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: 12px; }
  .posts-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .post-row { display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .post-row:hover { border-color: var(--accent); }
  .post-row .grow { flex: 1; min-width: 0; }
  .post-row .hl { font-weight: 600; font-size: 14.5px; font-family: var(--police-titre);
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .post-row .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .status-pill { font-size: 10.5px; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .status-pill.draft { background: #23232d; color: var(--muted); }
  .status-pill.approved { background: var(--accent-doux); color: var(--accent-clair); }
  .status-pill.published { background: #1f3d2a; color: #7fe0a0; }

  /* --- Détail d'un post (overlay) --- */
  #post-detail { position: fixed; inset: 0; background: rgba(8,8,10,.7); z-index: 20;
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 16px; }
  #post-detail[hidden] { display: none; }
  #post-detail .sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 960px; width: 100%; padding: 20px 22px 26px; }
  #post-detail .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #post-detail .sheet-head h2 { font-size: 15.5px; flex: 1; }
  /* `article_url` etait dans la reponse et n'etait utilise NULLE PART : le
     titre de l'actu s'affichait en clair, et l'ouvrir se faisait a la main. */
  #post-detail .sheet-head h2 a.titre-lien { color: inherit; text-decoration: none; }
  #post-detail .sheet-head h2 a.titre-lien:hover { color: var(--accent-clair); text-decoration: underline; }
  #post-detail .sheet-head h2 .ref-article { font-size: 11.5px; font-weight: 400; margin-left: 8px; }
  #post-detail .close-btn { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  #post-detail textarea { width: 100%; background: #0c0c10;
    color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px;
    font-family: inherit; resize: vertical; }
  .hl-hint { color: var(--muted); font-size: 11px; margin: 10px 0 12px; }
  /* Meme palette que .badge.hot-high : le rouge est deja le langage "attention"
     du dashboard, pas une nouvelle convention. */
  .render-warning { background: var(--alerte-fond); color: var(--alerte); border: 1px solid var(--alerte-bord);
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field textarea { min-height: 70px; }
  /* --- La fiche RESPIRE : des BLOCS, pas une colonne de titres -------------
     « L'interface ne respire pas » (utilisateur, 2026-10-05). La fiche
     enchainait neuf `.section-title` de meme poids sur un fond uni : aucune
     hierarchie, donc aucun endroit ou l'oeil se pose. Trois niveaux desormais --
     le bloc (Cover / Ce que Meta recevra / Texte publié), le sous-titre a
     l'interieur d'un bloc (Format, Image de fond), et la note explicative. */
  .bloc { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px 18px;
    margin-bottom: 18px; background: rgba(255,255,255,.012); }
  .bloc-titre { font-family: var(--police-titre); font-size: 15px; font-weight: 600;
    letter-spacing: .02em; color: var(--text); margin-bottom: 12px;
    display: flex; align-items: baseline; gap: 10px; }
  .bloc-titre .compte-el { font-family: inherit; font-weight: 400; font-size: 12px;
    color: var(--muted); }
  .sous-titre { font-family: var(--police-titre); font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  /* Une NOTE explique, elle n'alerte pas. Jusqu'au 2026-10-05 ces phrases
     portaient `.reel-reason`, donc le rouge d'alerte : la moitie de la fiche
     criait, et le rouge ne voulait plus rien dire la ou il compte (une raison de
     refus, une cover qui deborde). Le rouge reste reserve aux alertes. */
  .note { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin: 6px 0 2px; }
  /* Le bandeau de depart : quand, dans quel etat. En TETE de fiche, parce que
     c'est le cadre de tout le reste -- et non une section de plus en bas. */
  .depart-bandeau { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 9px 12px; margin-bottom: 14px; font-size: 12.5px; }
  .depart-bandeau.inconnu { border-left-color: var(--muted); border-style: dashed;
    color: var(--muted); }
  .depart-bandeau .quand { font-family: var(--police-titre); font-weight: 600; font-size: 14px; }
  .depart-bandeau .dans, .depart-bandeau .etat { color: var(--muted); font-size: 11.5px; }
  /* L'apercu du texte publie est REPLIE : il repetait mot pour mot la zone
     d'edition juste au-dessus. Les COMPTEURS, eux, restent toujours visibles --
     ils signalent un depassement avant qu'il coute un post. */
  .apercu-publie { margin-top: 10px; }
  .apercu-publie summary { cursor: pointer; font-size: 12px; color: var(--muted);
    padding: 4px 0; }
  .apercu-publie summary:hover { color: var(--accent-clair); }
  .apercu-publie .depart-apercu { margin-top: 8px; }
  .ajouts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .ajouts select { flex: 0 1 320px; }
  .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-top: 18px; padding: 12px 0 2px; border-top: 1px solid var(--border);
    position: sticky; bottom: -26px; background: var(--panel); z-index: 2; }
  /* « Supprimer » est DESTRUCTIF et n'a pas a etre le voisin de meme poids
     d'« Enregistrer » : il part a l'autre bout de la barre. */
  .detail-actions .danger { margin-left: auto; }
  /* UNE ECRITURE DIT TOUJOURS SI ELLE A REUSSI. Zone adjacente aux boutons,
     visible sans faire defiler (la barre est `sticky`), et qui survit au
     re-rendu de la fiche (`dernierGeste`). */
  .etat-geste { font-size: 12px; min-height: 1em; }
  .etat-geste:empty { display: none; }
  .relecture-actions, .depart-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .relecture-actions:empty, .depart-actions:empty { display: none; }
  .etat-geste.en-cours { color: var(--muted); }
  .etat-geste.ok { color: var(--accent-clair); }
  .etat-geste.erreur { color: var(--alerte); }

  /* --- Relecture avant publication -----------------------------------------
     Pas de rouge par defaut : un post qui attend une relecture n'est PAS une
     alerte, il part quand meme a l'heure. */
  .relecture-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .relecture-row { display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .relecture-row:hover { border-color: var(--accent); }
  .relecture-row .grow { flex: 1; min-width: 0; }
  .relecture-row .quand { font-family: var(--police-titre); font-weight: 600; font-size: 13px;
    white-space: nowrap; }
  .relecture-row .hl { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .relecture-row .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  /* « Ce qui va partir » : du texte PRE, parce que les retours a la ligne et les
     lignes vides que `aerer_legende` fabrique sont justement ce qu'on relit. */
  .depart-apercu { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5;
    max-height: 260px; overflow: auto; }
  .depart-mesures { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .depart-mesures span { font-size: 11.5px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 9px; }
  .depart-mesures span.limite { color: var(--alerte); border-color: var(--alerte-bord); }
  /* L'inconnu porte sa propre teinte, celle de la supervision : jamais celle d'un
     verdict, qui se lirait comme une promesse (regle du panneau Artistes). */
  .depart-mesures span.inconnu { color: var(--muted); border-style: dashed; }
  /* --- La liste finale : ce que Meta recevra, element par element ------------
     Les vignettes sont les FICHIERS FIGES eux-memes (`/relecture/{id}/fichiers/`)
     quand ils existent : c'est la seule facon de voir le recadrage reel -- le logo
     Wikipedia du post 164 etait coupe au point que les lettres manquaient, et
     aucune description ne l'aurait dit. */
  .elements-liste { display: flex; flex-direction: column; gap: 8px; }
  .element-ligne { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .element-ligne img, .element-ligne video { width: 54px; height: 68px; object-fit: cover;
    border-radius: 6px; background: var(--bg); flex: none; }
  .element-ligne .rang { font-family: var(--police-titre); font-weight: 600; font-size: 12px;
    color: var(--muted); width: 18px; text-align: right; flex: none; }
  .element-ligne .quoi { flex: 1; min-width: 0; font-size: 12.5px; }
  .element-ligne .quoi .d2 { color: var(--muted); font-size: 11.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; }
  .element-ligne .gestes { display: flex; gap: 4px; flex: none; flex-wrap: wrap;
    justify-content: flex-end; }
  .element-ligne .gestes button { border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 6px; padding: 3px 7px; cursor: pointer; font-size: 12px; }
  .element-ligne .gestes button:disabled { opacity: .4; cursor: not-allowed; }
  /* ECARTE : pointille et gris, pas rouge. Le gel l'a refuse pour une raison
     legitime (trop petite, carrousel plein) -- ce n'est pas une panne, c'est
     l'information qui manquait. Seul le MOTIF est en rouge : c'est lui qu'on lit. */
  .element-ligne.ecarte { border-style: dashed; opacity: .8; }
  .element-ligne .motif { color: var(--alerte); }
  .element-ligne.cover { border-left: 3px solid var(--accent); }
  @media (max-width: 560px) {
    /* Six gestes sur une ligne de telephone ne tiennent pas : la rangee passe en
       colonne, les gestes sous la description, et la vignette garde sa place. */
    .element-ligne { flex-wrap: wrap; }
    .element-ligne .quoi { flex-basis: 100%; order: 3; }
    .element-ligne .gestes { flex-basis: 100%; order: 4; justify-content: flex-start; }
  }
  /* --- Deposer un visuel depuis le disque ------------------------------------
     Le dernier recours quand aucun barreau de l'echelle (medias de l'actu, compte
     source, artiste cite, web) n'a donne l'image que l'utilisateur voulait
     montrer. Le refus s'imprime ICI, a cote du controle, jamais dans une alerte
     qui disparait : on le relit pendant qu'on choisit un autre fichier. */
  .depot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .depot input[type=file] { flex: 1; min-width: 160px; font-size: 12px; color: var(--muted); }
  .depot input[type=file]::file-selector-button { border: 1px solid var(--border);
    background: #20202a; color: var(--text); border-radius: 6px; padding: 6px 12px;
    cursor: pointer; font-size: 12.5px; margin-right: 10px; }
  .depot input[type=file]:disabled { opacity: .5; }
  .depot input[type=file]:disabled::file-selector-button { opacity: .4; cursor: not-allowed; }
  .depot-motif { font-size: 11.5px; margin-top: 4px; color: var(--muted); }
  /* Une raison de refus est une information de PANNE : teinte d'alerte, jamais
     l'accent de la marque (rose et rouge sont voisins -- une panne qui vire au
     rose ne casse rien et rend la lecture aveugle). */
  .depot-motif.erreur { color: var(--alerte); }
  .detail-actions button, .detail-actions a { border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 12.5px;
    text-decoration: none; }
  .detail-actions .primary { background: var(--accent); border-color: var(--accent);
    color: var(--sur-accent); font-weight: 600; }
  .detail-actions .danger { border-color: var(--alerte-bord); color: var(--alerte); }
  .detail-actions button:hover, .detail-actions a:hover { border-color: var(--accent); }
  .detail-actions button:disabled { opacity: .4; cursor: not-allowed; }

  /* --- Covers, switch, fond, medias --- */
  .section-title { font-family: var(--police-titre); font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .7px; margin: 18px 0 8px; }
  .covers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cover-choice { background: #0c0c10; border: 2px solid var(--border); border-radius: 10px;
    padding: 6px; cursor: pointer; }
  .cover-choice img { width: 100%; aspect-ratio: 1080 / 1350; object-fit: cover; border-radius: 6px;
    background: #16161c; display: block; }
  .cover-choice.retenue { border-color: var(--accent); }
  .cover-choice .tag { display: block; text-align: center; font-size: 11px; color: var(--muted);
    margin-top: 4px; }
  /* La variante RETENUE est le seul choix valide de la fiche : l'etoile le dit
     en un signe, a cote du libelle, sans une ligne de plus. */
  .cover-choice.retenue .tag { color: var(--accent-clair); font-weight: 600; }
  .cover-choice.retenue .tag::before { content: ""; display: inline-block; width: .85em;
    height: .95em; margin-right: 4px; vertical-align: -.12em; background-color: var(--accent);
    -webkit-mask: var(--etoile-kinda) no-repeat center / contain;
    mask: var(--etoile-kinda) no-repeat center / contain; }
  /* Meme rouge que .render-warning : "attention" est deja ce langage-la dans le
     dashboard, pas une nouvelle convention. */
  .cover-choice.en-defaut { border-color: var(--alerte-bord); }
  .cover-choice.en-defaut .tag { color: var(--alerte); }
  .reel-reason { color: var(--alerte); font-size: 11.5px; }
  .bg-field { display: flex; gap: 8px; }
  .bg-field input { flex: 1; background: #0c0c10; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font-size: 12.5px; }
  .bg-field button { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 0 14px; cursor: pointer; font-size: 12.5px; }
  .media-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .media-choice { background: #0c0c10; border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    display: flex; flex-direction: column; gap: 4px; }
  .media-choice img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px;
    background: #16161c; display: block; }
  .media-choice label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .media-empty { color: var(--muted); font-size: 12px; }

  /* --- Panneau Événements (Phase 2A, lecture seule) --- */
  #events-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  .event-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; }
  /* COMPOSITION, pas rustine : le titre a SA ligne, les metriques la leur.
     `.event-head` etait un flex en rangee ou le titre portait `flex: 1` (donc
     `flex-basis: 0`) pendant que les onze badges revendiquaient leur largeur
     INTRINSEQUE -- le titre perdait l'arbitrage et tombait a zero de large (on
     n'en voyait qu'un fragment de glyphe), et les metadonnees tombaient un mot
     par ligne dans 40 px. Un titre et onze badges ne sont pas des pairs qui se
     partagent une rangee : la pile verticale est la seule disposition ou la
     largeur du titre ne depend pas du nombre de badges. */
  .event-head { display: block; cursor: pointer; }
  .event-head .hl { font-weight: 600; font-size: 14.5px; font-family: var(--police-titre);
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .event-head .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .event-metrics { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; margin-top: 8px; }
  /* Meme rouge d'alerte que .render-warning : sert a signaler l'ecart
     corroboration/pertinence, jamais a decider quoi que ce soit. */
  .badge.corrob { background: #23232d; color: var(--muted); }
  .badge.corrob.ecart { background: var(--alerte-fond); color: var(--alerte); }
  .event-observations { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; }
  .event-observations[hidden] { display: none; }
  .obs-row { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .obs-row a { color: var(--text); text-decoration: none; }
  .obs-row a:hover { color: var(--accent-clair); }
  .obs-row .plateforme { font-size: 10.5px; background: #23232d; color: var(--muted);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  /* Une observation disait ce que la PRESSE a publie et liait vers le web ;
     elle ne disait jamais ce que KINDA en a fait. Les renvois sont a la fin
     de la ligne, apres la source et la date, pour ne pas disputer la place au
     titre. */
  .obs-row .renvois { margin-left: auto; white-space: nowrap; }

  /* --- Panneau Artistes : la moitie DETECTION de Kinda ---------------------
     `artists` / `artist_mentions` sont « l'actif de Kinda » (CLAUDE.md) et le
     flux scoré est « le deal-flow du label ». 4 752 artistes et 13 533
     citations archivees depuis des semaines, et jusqu'ici AUCUNE interface ne
     les montrait : l'API existait, testee, sans un seul consommateur.

     Trois choses doivent se lire d'un coup d'oeil, parce que ce sont elles qui
     separent une DECOUVERTE d'une star : la TENDANCE (« on commence a en
     parler » contre « on en parle beaucoup »), le fait qu'un compte soit DEJA
     SUIVI (la question A&R est alors deja repondue, c'est un fait et non un
     jugement), et les CITATIONS elles-memes, titre et source -- juger sur
     pieces plutot que sur un score.

     Meme lecon qu'`.event-head` : des blocs EMPILES, jamais un titre en
     `flex: 1` face a des badges a largeur intrinseque -- Chromium comptait
     alors le titre lui-meme comme masque. */
  #artistes-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  .artiste-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; }
  .artiste-head { display: block; cursor: pointer; }
  .artiste-head .rang { color: #6a6a78; font-size: 11.5px; font-variant-numeric: tabular-nums;
    font-family: var(--police-titre); }
  .artiste-head .nom { font-weight: 600; font-size: 16px; font-family: var(--police-titre);
    letter-spacing: .2px; }
  .artiste-head .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .artiste-metrics { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; margin-top: 8px;
    align-items: center; }
  /* La MOYENNE d'emergence est la cle de tri : elle porte donc l'accent, et
     elle est la seule a le porter. */
  .badge.moyenne { background: var(--accent-doux); color: var(--accent-clair); font-weight: 600; }
  /* Une valeur NON MESUREE. Gris-bleu, la teinte deja en service pour
     « inconnu » dans le bandeau de supervision -- volontairement differente du
     vert comme de l'accent : ne pas savoir n'est ni une bonne ni une mauvaise
     nouvelle. */
  .badge.inconnu { background: #1f2630; color: #9fb0c4; font-style: italic; }
  /* La TENDANCE, le signal que ce panneau existe pour montrer. Trois etats
     possibles PLUS l'inconnu, et l'inconnu n'emprunte la couleur d'aucun des
     trois. */
  .badge.tendance { font-weight: 600; }
  .badge.tendance.monte { background: var(--accent-doux); color: var(--accent-clair); }
  .badge.tendance.stable { background: #23232d; color: var(--muted); }
  .badge.tendance.retombe { background: #2b2420; color: #ffb38a; }
  /* « Deja suivi » n'est PAS une alerte : c'est une reponse. Le vert deja en
     service pour « publie » (.status-pill), jamais le rouge. */
  .badge.suivi { background: #1f3d2a; color: #7ee2a0; }
  .badge.a-decouvrir { background: #23232d; color: var(--muted); }
  .artiste-citations { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; }
  .artiste-citations[hidden] { display: none; }
  .cit-row { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline;
    flex-wrap: wrap; }
  .cit-row a { color: var(--text); text-decoration: none; }
  .cit-row a:hover { color: var(--accent-clair); }
  .cit-row .tete { font-size: 10.5px; background: #23232d; color: var(--muted);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .cit-row .tete.passage { background: #2b2420; color: #ffb38a; }
  .cit-row .titre { flex: 1 1 260px; min-width: 0; }
  .cit-row .renvois { margin-left: auto; white-space: nowrap; }
  /* Le lien a la main vers un compte suivi : le seul geste d'ecriture du
     panneau (`PATCH /artists/{id}`), et la raison pour laquelle
     `source_instagram_id` reste quand `tracked` disparait. Un controle
     DESACTIVE imprime sa raison a cote -- jamais un selecteur gris et muet. */
  .lier-compte { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .lier-compte select { font-size: 11.5px; max-width: 260px; }
  .lier-compte .pourquoi-desactive { color: var(--alerte-douce); }
  .lier-compte .verdict { width: 12px; text-align: center; color: #7ee2a0; }
  .lier-compte .verdict.ko { color: var(--alerte-douce); }
  /* La barre de reglages du panneau : des `select` et une case, comme les
     autres panneaux (`.posts-bar`). Ni `.onglet` ni `.chip` -- ces deux formes
     appartiennent a la navigation (portee application) et aux filtres de la
     grille (portee grille) ; melanger les trois est exactement la confusion de
     portees que la refonte du 2026-10-02 a demontee. */
  .artistes-reglages { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 12px; }
  .artistes-reglages label { color: var(--muted); font-size: 11.5px; display: flex;
    gap: 5px; align-items: center; }
  .artistes-aide { color: var(--muted); font-size: 11.5px; margin-bottom: 14px; line-height: 1.5; }
  /* --- Bandeau de supervision (permanent, tous panneaux) ---
     Les quatre niveaux reprennent les couleurs deja en service dans le
     dashboard (.status-pill) : vert = publie, ambre = apercu, rouge = echec.
     Le gris-bleu de « inconnu » est la seule teinte nouvelle, et elle est
     volontairement DIFFERENTE du vert : une valeur qu'on n'a pas pu lire ne
     doit jamais ressembler a « tout va bien ». */
  .supervision { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px;
    background: #14141a; padding: 8px 10px; }
  .supervision.niv-panne { border-color: var(--alerte-bord); }
  .supervision.niv-attention { border-color: #55501f; }
  .supervision.niv-inconnu { border-color: #3a3a48; }
  .supervision.niv-ok { border-color: #2a4a33; }
  .sup-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sup-global { font-size: 13.5px; font-weight: 600; font-family: var(--police-titre);
    letter-spacing: .2px; }
  .niv-ok > .sup-tete > .sup-global, .sup-global.niv-ok { color: #7ee2a0; }
  .niv-attention > .sup-tete > .sup-global { color: #e8d27a; }
  .niv-panne > .sup-tete > .sup-global { color: var(--alerte-douce); }
  .niv-inconnu > .sup-tete > .sup-global { color: #b9b9c8; }
  .sup-releve { color: var(--muted); font-size: 11px; }
  .sup-plier { margin-left: auto; border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 11.5px; }
  .sup-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .sup-pill { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11.5px;
    border-radius: 999px; padding: 3px 10px; background: #23232d; color: var(--muted);
    border: 1px solid transparent; }
  .sup-pill b { font-weight: 600; }
  .sup-pill.niv-ok { background: #1d3325; color: #7ee2a0; }
  .sup-pill.niv-attention { background: #33301d; color: #e8d27a; }
  .sup-pill.niv-panne { background: #3d1f23; color: var(--alerte-douce); border-color: var(--alerte-bord); }
  .sup-pill.niv-inconnu { background: #2d2d38; color: #b9b9c8; }
  /* La raison est ADJACENTE et VISIBLE, jamais seulement dans un `title` :
     c'est la force deja presente dans la fiche de post, etendue ici. */
  .sup-raisons { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
  .sup-raison { font-size: 12px; line-height: 1.35; }
  .sup-raison.niv-attention { color: #e8d27a; }
  .sup-raison.niv-panne { color: var(--alerte-douce); }
  .sup-raison.niv-inconnu { color: #b9b9c8; }
  .sup-raison b { font-weight: 600; }
  .sup-details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 7px;
    display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 11.5px; }
  .sup-details[hidden] { display: none; }
  .sup-details .sup-bloc b { color: var(--text); font-weight: 600; }
  /* Le repli des raisons. L'entete est `sticky` : cinq raisons lui faisaient
     ~230 px et mangeaient autant de zone utile. Mais gagner de la place ne doit
     JAMAIS faire disparaitre une panne -- le repli ne touche donc que les
     raisons `attention`/`inconnu`, et le bouton DIT combien il en cache. */
  .sup-reste[hidden] { display: none; }
  .sup-raison-plus { align-self: flex-start; border: 1px solid var(--border);
    background: #20202a; color: var(--muted); border-radius: 8px; padding: 2px 9px;
    cursor: pointer; font-size: 11.5px; margin-top: 2px; }

  /* --- Ancrage : l'entete est `sticky`, donc une ancre (`#post-...`, un lien
     entre panneaux) atterrissait SOUS elle. `--entete-h` est mesuree en JS a
     chaque changement de hauteur du bandeau : la valeur ne peut pas etre figee
     en CSS puisque l'entete grandit avec le nombre de raisons affichees. */
  html { scroll-padding-top: calc(var(--entete-h, 120px) + 12px); }

  /* --- Responsive. Il n'existait AUCUNE media query : a 820 px le titre d'un
     evenement disparaissait et la barre de l'entete eclatait en quatre rangees.
     Deux paliers seulement -- tablette/petit portable, puis telephone. --- */
  @media (max-width: 900px) {
    header { padding: 10px 12px; }
    h1 { font-size: 17px; }
    h1 .logo-kinda { height: 25px; }
    .bar { gap: 6px; }
    .chip { padding: 5px 10px; font-size: 12px; }
    /* Un `select` a largeur intrinseque poussait la rangee de l'entete a
       deborder ; ici il partage la place au lieu de la revendiquer. Limite a
       `.bar` : les selecteurs d'un panneau sont seuls sur leur ligne et
       n'ont aucune raison d'en occuper toute la largeur. */
    .bar select { flex: 1 1 150px; min-width: 0; }
    /* L'entete cesse d'etre `sticky` sous cette largeur. Mesure sur la page
       reelle : 419 px de haut a 820 px de large, 705 px a 390 px -- soit la
       moitie puis la TOTALITE de la hauteur utile d'un telephone. Une entete
       collante plus haute que l'ecran qu'elle surplombe ne rend plus service,
       elle le confisque ; elle defile donc avec la page, et rien n'est cache
       pour autant. */
    header { position: static; }
    nav.nav { margin-left: 0; }
    main { padding: 14px 12px 50px; grid-template-columns: 1fr; }
    #sources-panel, #posts-panel, #schedule-panel, #events-panel,
    #artistes-panel { padding: 14px 12px; }
    .posts-bar { flex-wrap: wrap; align-items: center; }
    .mode-control { margin-left: 0; }
    .reels-toggle { margin-left: 0; }
    /* Une ligne de creneau porte desormais des libelles (et non quatre icones
       muettes) : elle passe a la ligne plutot que d'ecraser son titre. */
    .post-row { flex-wrap: wrap; }
    .post-row .grow { flex: 1 1 100%; }
    #post-detail { padding: 14px 8px; }
    #post-detail .sheet { padding: 14px 14px 20px; }
  }
  @media (max-width: 560px) {
    .bar { gap: 5px; }
    .chip { padding: 5px 9px; font-size: 11.5px; }
    .bar select { flex: 1 1 100%; }
    .src-form { grid-template-columns: 1fr; }
    .src-row { flex-wrap: wrap; }
    .src-row .grow { flex: 1 1 100%; }
    .detail-actions { position: static; }
    .detail-actions button, .detail-actions a { flex: 1 1 100%; text-align: center; }
    .detail-actions .danger { margin-left: 0; }
    .bloc { padding: 12px 12px 14px; }
    .slot-actions { flex-wrap: wrap; }
    /* Le selecteur de liaison et les reglages du panneau Artistes prennent
       toute la largeur : a 390 px, un `select` a cote de son libelle les
       ecrasait tous les deux. */
    .artistes-reglages label { flex: 1 1 100%; }
    .artistes-reglages label select { flex: 1; min-width: 0; }
    .lier-compte select { flex: 1 1 100%; max-width: none; }
  }
</style>

        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </label>
    <label title="Un artiste dont Kinda suit déjà le compte Instagram n'est pas une découverte : sa question A&R est déjà répondue.">
      <input type="checkbox" id="art-inclure-suivis"> Inclure les comptes déjà suivis
    </label>
  </div>
  <div class="artistes-aide" id="artistes-aide"></div>
  <div id="artistes-list"></div>
</section>

<div id="post-detail" hidden></div>

<script>
const PRESETS = {
  fresh:    { status: "new", min_relevance: 40 },
  digest:   { min_relevance: 60 },
  hot:      { min_hotness: 80 },
  media:    { has_media: true, min_relevance: 40 },
  reviewed: { status: "reviewed" },
  used:     { status: "used" },
  // Tous les posts Instagram, notes ou non : la vue « A traiter » masque ceux qui
  // attendent encore leur note.
  instagram: { source_type: "instagram" },
  // Toute la base (hors reprises d'une meme actu, cf. pipeline/cluster.py).
  tout: {},
};
let preset = "fresh";
// Le numero du chargement de grille en cours : voir la garde de `load()`.
let generationGrille = 0;

const grid = document.getElementById("grid");
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("fr-FR",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";

// --- Les reglages que l'interface ANNONCE -------------------------------
// Trois textes affirmaient des choses fausses, et deux recopiaient un reglage :
// « toutes les 2 h » (l'agent `com.musicnewsradar.pipeline` est HORAIRE depuis
// le 2026-08-15) et « 14 jours de retention » (`retention_days` vaut 2 depuis le
// 2026-09-21 -- on envoyait donc chercher un article supprime douze jours plus
// tot que annonce). Ils sont desormais DERIVES de `GET /reglages`.
//
// Meme regle que le bandeau de supervision : une valeur qu'on n'a pas pu lire
// est INCONNUE. Reglages illisibles, la phrase perd son chiffre -- elle n'en
// invente jamais un, et surtout ne retombe pas sur l'ancienne valeur en dur.
let REGLAGES = null;

async function chargerReglages() {
  try {
    const reponse = await fetch("/reglages");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    REGLAGES = await reponse.json();
  } catch (erreur) {
    REGLAGES = null;
  }
}

function cadencePipeline() {
  const s = REGLAGES && REGLAGES.pipeline_intervalle_s;
  if (!s) return "";
  if (s % 3600 === 0) {
    const h = s / 3600;
    return h === 1 ? " (toutes les heures)" : ` (toutes les ${h} h)`;
  }
  return ` (toutes les ${Math.round(s / 60)} min)`;
}

function retentionTexte() {
  const j = REGLAGES && REGLAGES.retention_days;
  return j
    ? `probablement purgée — ${j} jour${j > 1 ? "s" : ""} de rétention`
    : "probablement purgée (durée de rétention inconnue)";
}

// Un echec de chargement doit etre TERMINAL ET RELANCABLE : il porte sa raison
// et un bouton. Sans ce bouton, la seule issue d'une panne passagere (Neon qui
// demarre, `attendre_base()` qui patiente) etait de recharger la page entiere --
// et avant lui, l'ecran restait sur « Chargement… » sans jamais rien dire.
function afficherErreur(cible, message, relancer) {
  cible.innerHTML = "";
  const zone = document.createElement("div");
  zone.className = "zone-erreur";
  const pourquoi = document.createElement("div");
  pourquoi.className = "pourquoi";
  pourquoi.textContent = message;
  const bouton = document.createElement("button");
  bouton.className = "relance";
  bouton.textContent = "↻ Réessayer";
  bouton.onclick = relancer;
  zone.appendChild(pourquoi);
  zone.appendChild(bouton);
  cible.appendChild(zone);
}

async function load() {
  // CEINTURE DE PORTEE, et le point UNIQUE qui la tient. `load()` ecrit deux
  // choses qui n'appartiennent qu'au panneau grille : la grille elle-meme et
  // le compteur de l'entete. Tant qu'elle manquait, changer le tri pendant que
  // la Programmation etait a l'ecran relancait toute la pagination,
  // reconstruisait la grille CACHEE et reecrivait le compteur -- « 9 creneaux »
  // devenait « 213 articles » sans cause visible.
  //
  // La garde est ICI et non chez chaque appelant : une garde par appelant
  // serait a refaire au suivant, et les filtres ne sont pas les seuls a
  // rappeler `load()` (un PATCH de statut, une remise dans la file, l'amorcage).
  if (panneau !== "grille") return;
  // La garde d'ENTREE ne suffit pas, et c'est une mesure sur donnees reelles
  // qui l'a dit (2026-10-02, 201 articles sur Neon) : une pagination lancee
  // depuis la grille se termine parfois APRES un changement de panneau, et son
  // ecriture ecrase alors le compteur du panneau affiche -- « 24 creneaux »
  // redevenait « 201 articles » tout seul, sans qu'aucun geste de filtrage ne
  // soit en cause. Le jeton de generation ferme les deux cas d'un coup : le
  // chargement perime par un changement de panneau, et celui perime par un
  // chargement plus recent (deux clics rapides sur deux filtres).
  const generation = ++generationGrille;
  const perime = () => panneau !== "grille" || generation !== generationGrille;
  const params = new URLSearchParams({ limit: 200, sort: document.getElementById("sort").value });
  for (const [k, v] of Object.entries(PRESETS[preset])) params.set(k, v);
  const category = document.getElementById("category").value;
  const source = document.getElementById("source").value;
  if (category) params.set("category", category);
  if (source) params.set("source_id", source);

  // L'API plafonne une page a 200 : on enchaine les pages pour tout afficher.
  const articles = [];
  try {
    for (let offset = 0; ; offset += 200) {
      params.set("offset", offset);
      const reponse = await fetch(`/articles?${params}`);
      if (!reponse.ok) throw new Error("HTTP " + reponse.status);
      const page = await reponse.json();
      articles.push(...page);
      if (page.length < 200) break;
    }
  } catch (erreur) {
    if (perime()) return;
    document.getElementById("count").textContent = "";
    afficherErreur(grid, "Échec du chargement des articles : " + erreur.message, load);
    return;
  }
  if (perime()) return;
  document.getElementById("count").textContent = `${articles.length} article${articles.length > 1 ? "s" : ""}`;
  grid.innerHTML = articles.length
    ? ""
    : `<div id="empty">Rien ici — change de filtre ou attends le prochain passage${cadencePipeline()}.</div>`;

  for (const a of articles) {
    const card = document.createElement("div");
    card.className = `card st-${a.status}`;
    // Meme regle que le selecteur de medias du detail : la vignette d'abord,
    // sinon l'URL directe pour une photo seulement -- pas pour une video, dont
    // l'URL est un .mp4 qu'une balise <img> ne peut pas afficher (onerror la
    // retire alors silencieusement, et la carte perd son image).
    const img = (a.media || []).map(m => m.preview_url || (m.type === "photo" ? m.url : null)).filter(Boolean)[0];
    const hotClass = a.hotness_score >= 80 ? "hot-high" : "";
    // D'ou viendra le visuel (presse, compte de l'actu, artistes cites) ou pourquoi
    // il n'y en a pas : un article sans visuel autorise n'entre pas dans la file.
    const visuelBadge = a.visuel
      ? `<span class="badge visuel">📸 ${escapeHtml(a.visuel)}</span>`
      : a.raison_sans_visuel
        ? `<span class="badge sans-visuel" title="${escapeHtml(a.raison_sans_visuel)}">🚫 sans visuel</span>`
        : "";
    // Hors file, et POURQUOI. Le champ refuse l'article partout (le gel, la
    // composition et « Ne pas publier » l'ecrivent) et n'etait affiche nulle part : un
    // article invisible de la file semblait simplement ne jamais sortir.
    const excluBadge = a.file_exclu_raison
      ? `<span class="badge exclu" title="${escapeHtml(a.file_exclu_raison)}">⛔ hors file : ${escapeHtml(a.file_exclu_raison)}</span>`
      : "";
    // « ↩ » seul ne disait pas ou l'on revient : ce geste remet l'article en
    // statut "new", c'est-a-dire dans la vue « A traiter ». D'ou son libelle.
    // Un geste n'apparait que s'il a un effet, et jamais sur un article USED : le
    // robot seul pose ce statut, et le serveur refuse d'en faire sortir l'article
    // (c'est ce qui le protege de la purge et d'une republication).
    card.innerHTML = `
      ${img ? `<img class="thumb" src="${escapeHtml(img)}" loading="lazy" onerror="this.remove()">` : ""}
      <div class="body">
        <div class="scores">
          <span class="badge rel">pertinence ${a.relevance_score ?? "—"}</span>
          <span class="badge ${hotClass}">hot ${a.hotness_score ?? "—"}</span>
          ${a.category ? `<span class="badge">${a.category}</span>` : ""}
          ${a.imprint ? `<span class="badge">${a.imprint}</span>` : ""}
          ${visuelBadge}
          ${excluBadge}
        </div>
        <a class="title" href="${a.url}" target="_blank" rel="noopener"></a>
        <div class="summary"></div>
        <div class="meta"></div>
        <div class="actions">
          ${a.status === "new" ? '<button data-status="reviewed">✓ Vu</button>' : ""}
          ${a.status === "reviewed" ? `<button data-status="new" title="Remettre l'article en « À traiter »">↩ À traiter</button>` : ""}
          <div class="prog-hote"></div>
          ${a.file_exclu_raison || a.exclusion_a_verifier ? '<button class="reintegrer">↩ Remettre dans la file</button>' : ""}
          ${a.exclusion_a_verifier ? `<div class="verif-publication" hidden>
            <span>Le post est peut-être en ligne. Vérifie le compte</span>
            <button class="pas-parti">Vérifié, il n'est pas parti</button>
          </div>` : ""}
          ${a.file_exclu_raison || a.exclusion_a_verifier ? '<span class="etat-geste erreur refus-reintegrer"></span>' : ""}
          <span class="etat-geste erreur refus-statut"></span>
        </div>
      </div>`;
    card.querySelector(".title").textContent = a.title;
    card.querySelector(".summary").textContent = a.summary || "";
    card.querySelector(".meta").textContent =
      `#${a.id} · ${sourceName(a.source_id)} · publié ${fmtDate(a.published_at) || "?"}`;
    const refusStatut = card.querySelector(".refus-statut");
    for (const btn of card.querySelectorAll(".actions button[data-status]")) {
      btn.onclick = async () => {
        btn.disabled = true;
        refusStatut.textContent = "";
        const reponse = await fetch(`/articles/${a.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: btn.dataset.status }),
        });
        if (!reponse.ok) {
          refusStatut.textContent = "Refusé : " + await raisonDuRefus(reponse);
          btn.disabled = false;
          return;
        }
        load();
      };
    }
    card.dataset.article = a.id;
    peindreProgrammation(card, a);
    // Le retour en arriere de « 🚫 Ne pas publier » -- et de toute exclusion posee par
    // l'agent (gel, composition). Avant lui, le seul recours etait un UPDATE
    // a la main en base.
    const btnReintegrer = card.querySelector(".reintegrer");
    if (btnReintegrer) {
      const refus = card.querySelector(".refus-reintegrer");
      const envoyer = async (bouton, options) => {
        bouton.disabled = true;
        refus.textContent = "";
        try {
          const reponse = await fetch(`/articles/${a.id}/reintegrer`, options);
          if (!reponse.ok) {
            const corps = await reponse.json().catch(() => ({}));
            throw new Error(corps.detail || "HTTP " + reponse.status);
          }
          load();
        } catch (erreur) {
          refus.textContent = "Remise dans la file refusée : " + erreur.message;
          bouton.disabled = false;
        }
      };
      // Le post est peut-etre en ligne (machine coupee apres media_publish,
      // delai depasse) : le clic ouvre la verification, il ne remet rien en file.
      const verification = card.querySelector(".verif-publication");
      btnReintegrer.onclick = verification
        ? () => { verification.hidden = false; btnReintegrer.hidden = true; }
        : () => envoyer(btnReintegrer, { method: "POST" });
      if (verification) {
        const btnPasParti = verification.querySelector(".pas-parti");
        btnPasParti.onclick = () => envoyer(btnPasParti, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ confirmation: "PAS_PARTI" }),
        });
      }
    }
    grid.appendChild(card);
  }
}

let sourceNames = {};
function sourceName(id) { return sourceNames[id] || "?"; }

// --- Renvois entre panneaux ------------------------------------------------
//
// `article #123`, `post 45` et `IG 17894…` etaient du TEXTE INERTE partout :
// lignes de creneau, lignes de post, fiche de post, lignes d'evenement. Le
// code disait lui-meme pourquoi il affichait le dernier -- « il permet de
// retrouver le post sur Instagram » -- pour un trajet que l'utilisateur
// faisait donc a la main, plusieurs fois par jour.
//
// Trois destinations, une seule fabrique : un post ouvre SA FICHE (l'overlay
// est global, donc depuis la Programmation comme depuis les Evenements), un
// article mene a l'actu, un identifiant media ouvre la publication.

const IG_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

// Le shortcode d'un post Instagram est son identifiant media (la part AVANT le
// « _ », qui porte l'identifiant du compte) ecrit en base 64 avec cet
// alphabet. Le lien est donc DEDUIT, sans un seul appel reseau : demander le
// `permalink` a Graph serait un appel vers Meta a chaque affichage, ce que les
// contraintes de ce chantier interdisent, et aucun permalien n'est stocke
// apres `media_publish`. L'identifiant brut reste ecrit DANS le lien : si la
// deduction se trompe, on garde exactement ce qu'on avait avant.
function permalienInstagram(igMediaId) {
  const pk = String(igMediaId || "").split("_")[0];
  if (!/^[0-9]{6,25}$/.test(pk)) return null;
  let reste = BigInt(pk);
  let code = "";
  while (reste > 0n) {
    code = IG_ALPHABET[Number(reste % 64n)] + code;
    reste /= 64n;
  }
  return code ? `https://www.instagram.com/p/${code}/` : null;
}

// `stopPropagation` : une ligne de post s'ouvre au clic sur la ligne entiere.
// Sans lui, cliquer un renvoi declencherait AUSSI le geste de sa ligne.
function renvoiLien(texte, href, titre, classe) {
  const a = document.createElement("a");
  a.className = classe || "ref";
  a.textContent = texte;
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener";
  if (titre) { a.title = titre; a.setAttribute("aria-label", titre); }
  a.onclick = (evenement) => evenement.stopPropagation();
  return a;
}

function renvoiPost(postId) {
  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.className = "ref";
  bouton.textContent = `post ${postId}`;
  bouton.title = `Ouvrir la fiche du post ${postId}`;
  bouton.setAttribute("aria-label", bouton.title);
  bouton.onclick = (evenement) => { evenement.stopPropagation(); ouvrirPost(postId); };
  return bouton;
}

// Sans URL -- l'article a ete purge (`retention_days`), et le creneau comme le
// post lui survivent -- on rend du TEXTE : un identifiant inerte vaut mieux
// qu'un lien mort.
function renvoiArticle(articleId, url) {
  const texte = `article #${articleId}`;
  if (!url) return texte;
  return renvoiLien(texte, url, `Ouvrir l'actu d'origine (article #${articleId})`);
}

function renvoiInstagram(igMediaId) {
  const url = permalienInstagram(igMediaId);
  const texte = `IG ${igMediaId}`;
  if (!url) return texte;
  return renvoiLien(
    texte, url,
    "Ouvrir la publication sur Instagram (lien deduit de l'identifiant media)");
}

// Une ligne de metadonnees dont certaines parties sont CLIQUABLES :
// `textContent` les aurait aplaties en texte, et un `innerHTML` concatene
// demanderait d'echapper a la main ce que le DOM echappe tout seul.
function poserParties(zone, parties) {
  zone.innerHTML = "";
  parties.filter((partie) => partie != null && partie !== "").forEach((partie, rang) => {
    if (rang) zone.appendChild(document.createTextNode(" · "));
    zone.appendChild(partie instanceof Node ? partie : document.createTextNode(String(partie)));
  });
}

const gridEl = document.getElementById("grid");
const panelEl = document.getElementById("sources-panel");
const postsPanelEl = document.getElementById("posts-panel");
const schedulePanelEl = document.getElementById("schedule-panel");
const eventsPanelEl = document.getElementById("events-panel");
const artistesPanelEl = document.getElementById("artistes-panel");
const barreFiltres = document.getElementById("barre-filtres");

// --- Deux portees, deux variables ----------------------------------------
//
// `panneau` dit CE QUI EST A L'ECRAN (portee application) ; `preset` dit
// comment la grille est filtree (portee grille). Une seule variable portait
// les deux, et le melange avait un prix mesurable : les trois `select` et les
// huit pastilles restaient actifs sous un panneau non-grille.
let panneau = "grille";

function afficherPanneau(nom) {
  panneau = nom;
  for (const onglet of document.querySelectorAll(".onglet"))
    onglet.classList.toggle("on", onglet.dataset.panneau === nom);
  gridEl.hidden = nom !== "grille";
  // Les filtres quittent l'ecran hors de la grille : ils n'y ont pas de sens,
  // et ce qui n'est pas a l'ecran ne peut pas etre actionne par megarde. La
  // garde de `load()` reste la ceinture -- celle-ci est la bretelle, et c'est
  // elle qui rend aussi l'entete plus courte sous les autres panneaux.
  barreFiltres.hidden = nom !== "grille";
  panelEl.hidden = nom !== "sources";
  postsPanelEl.hidden = nom !== "posts";
  schedulePanelEl.hidden = nom !== "schedule";
  eventsPanelEl.hidden = nom !== "events";
  artistesPanelEl.hidden = nom !== "artistes";
  document.getElementById("count").textContent = "";
  mesurerEntete();
  if (nom === "sources") loadSourcesPanel();
  else if (nom === "posts") loadPostsPanel();
  else if (nom === "schedule") loadSchedulePanel();
  else if (nom === "events") loadEventsPanel();
  else if (nom === "artistes") loadArtistesPanel();
  else load();
}

document.querySelectorAll(".onglet").forEach((onglet) => {
  onglet.onclick = () => afficherPanneau(onglet.dataset.panneau);
});

// Les pastilles de filtre ne touchent QUE la grille : elles ne changent plus
// de panneau, elles ne sont meme plus visibles ailleurs.
document.querySelectorAll(".chip[data-preset]").forEach((chip) => chip.onclick = () => {
  document.querySelectorAll(".chip[data-preset]").forEach((c) => c.classList.remove("on"));
  chip.classList.add("on");
  preset = chip.dataset.preset;
  load();
});
for (const id of ["category", "source", "sort"])
  document.getElementById(id).onchange = load;

// --- Panneau Sources ---

const HINTS = {
  instagram: "Convention ig:<compte>, ex. ig:tsugimag (ou l'URL instagram.com/<compte> complète). Compte professionnel (business/creator) uniquement — business_discovery ne voit pas les profils perso.",
  x: 'Compte : https://x.com/pseudo · Recherche : #tag OR #tag2 · Clips fans : ugc:("Artiste") has:videos · Radar auto : radar:',
  rss: "L'URL du flux RSS/Atom (souvent /feed ou /rss.xml).",
  reddit_rss: "L'URL du subreddit, ex. https://www.reddit.com/r/electronicmusic",
};
const typeSel = document.getElementById("s-type");
const hintEl = document.getElementById("s-hint");
const updateHint = () => { hintEl.textContent = HINTS[typeSel.value]; };
typeSel.onchange = updateHint;
updateHint();

async function loadSourcesPanel() {
  const sources = await (await fetch("/sources")).json();
  const list = document.getElementById("src-list");
  list.innerHTML = "";
  for (const s of sources.sort((a, b) => b.active - a.active || a.name.localeCompare(b.name))) {
    const row = document.createElement("div");
    row.className = "src-row" + (s.active ? "" : " off");
    row.innerHTML = `
      <div class="grow">
        <div class="nm"></div>
        <div class="u"></div>
        <div class="sante"></div>
      </div>
      <span class="tag">${s.type}</span>
      ${s.genre ? `<span class="tag">${s.genre}</span>` : ""}
      <select class="categorie" title="Catégorie du compte (pondère le scoring)">
        <option value="">Catégorie inconnue</option>
      <option value="artiste">Artiste</option>
      <option value="media">Média</option>
      <option value="festival">Festival</option>
      <option value="label">Label</option>
      <option value="club">Club</option>
      <option value="autre">Autre</option>
      </select>
      <span class="cat-etat"></span>
      <button class="toggle">${s.active ? "⏸ Désactiver" : "▶ Activer"}</button>`;
    row.querySelector(".nm").textContent = s.name;
    row.querySelector(".u").textContent = s.url;
    // La raison en clair, adjacente : jamais un etat de sante en infobulle.
    const sante = row.querySelector(".sante");
    if (s.last_error) {
      sante.classList.add("ko");
      sante.textContent = `⚠ ${fmtDate(s.last_error_at)} — ${s.last_error}`;
    } else if (s.last_ok_at) {
      sante.textContent = `✓ lue ${fmtDate(s.last_ok_at)}`;
    } else {
      sante.textContent = "jamais lue avec succès";
    }
    const catSel = row.querySelector(".categorie");
    const catEtat = row.querySelector(".cat-etat");
    catSel.value = s.categorie || "";
    // Ce PATCH partait sans que PERSONNE ne lise la reponse : un refus
    // ressemblait exactement a une reussite. Or cette categorie pilote les
    // regles 5-6 du prompt de scoring, l'eligibilite reel, et la regle « jamais
    // les visuels d'un compte media » -- se tromper sur sa valeur se paie en
    // production, pas a l'ecran.
    //
    // Contrairement a son voisin `.toggle`, qui RECHARGE tout le panneau (il
    // change l'ordre et l'opacite des lignes), on ne recharge pas ici : avec
    // ~145 sources, perdre sa position de defilement a chaque classement rendrait
    // le tri a la main impraticable. On affiche donc ce que le SERVEUR a retenu,
    // sur la ligne meme.
    catSel.onchange = async () => {
      const precedente = s.categorie || "";
      catEtat.className = "cat-etat";
      catEtat.textContent = "…";
      try {
        const reponse = await fetch(`/sources/${s.id}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categorie: catSel.value || null }),
        });
        if (!reponse.ok) {
          const corps = await reponse.json().catch(() => ({}));
          throw new Error(typeof corps.detail === "string" ? corps.detail : "HTTP " + reponse.status);
        }
        const maj = await reponse.json();
        s.categorie = maj.categorie || null;
        catSel.value = s.categorie || "";
        catEtat.textContent = "✓";
      } catch (erreur) {
        // Retour en arriere VISIBLE : le selecteur ne doit jamais afficher une
        // valeur que la base n'a pas.
        catSel.value = precedente;
        catEtat.classList.add("ko");
        catEtat.textContent = "⚠";
        alert("Catégorie non enregistrée (" + erreur.message + ") — « "
          + (s.name) + " » garde « " + (precedente || "inconnue") + " ».");
      }
    };
    row.querySelector(".toggle").onclick = async () => {
      // Le rechargement rend un refus VISIBLE (la ligne ne bouge pas) mais muet :
      // on dit aussi pourquoi, comme pour la categorie juste au-dessus.
      const reponse = await fetch(`/sources/${s.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: !s.active }),
      });
      if (!reponse.ok) {
        const corps = await reponse.json().catch(() => ({}));
        alert("Changement refusé : " + (typeof corps.detail === "string" ? corps.detail : reponse.status));
      }
      loadSourcesPanel();
    };
    list.appendChild(row);
  }
}
