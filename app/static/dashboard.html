// --- Programmer -------------------------------------------------------------
//
// La console publie seule et l'utilisateur gere le planning : il ne genere jamais a
// la main (decision du 2026-10-31). Un seul selecteur, dans les deux sens : les
// creneaux d'une actu, les actus d'un creneau. Le navigateur ne porte AUCUNE regle :
// ce qui est possible, pourquoi, et le mode viennent du serveur
// (`app/schedule/programmation.py`), qui applique les memes controles au PATCH.
const fmtCreneau = (iso) => iso ? new Date(iso).toLocaleString("fr-FR",
  { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "heure inconnue";
const fmtJour = (iso) => new Date(iso).toLocaleDateString("fr-FR",
  { weekday: "long", day: "numeric", month: "long" });

function texteComposition(c) {
  if (c.composition_suspendue) return "composition suspendue (mode arrêt)";
  if (c.composition_due) return "composé au prochain passage de l'agent";
  return c.composition_a ? `composé vers ${fmtCreneau(c.composition_a)}` : null;
}

function texteAge(heures) {
  if (heures == null) return "âge inconnu";
  return heures < 24 ? `il y a ${heures} h` : `il y a ${Math.floor(heures / 24)} j ${heures % 24} h`;
}

function nouvelElement(balise, classe, texte) {
  const el = document.createElement(balise);
  if (classe) el.className = classe;
  if (texte != null) el.textContent = texte;
  return el;
}

// Ce qui sort, nomme. Une etape de plus quand l'occupant est epingle ou compose : le
// geste defait alors un choix humain, ou un post deja paye.
function etapesDeValidation(occupant) {
  if (!occupant) return [{ texte: null, bouton: "Programmer ici" }];
  const nom = occupant.titre || `post ${occupant.post_id}`;
  const sortie = { texte: `« ${nom} » sort de ce créneau et redevient candidate.`, bouton: `Remplacer « ${nom} »` };
  if (!occupant.epingle && !occupant.compose) return [sortie];
  const raisons = [occupant.epingle ? "épinglée" : null, occupant.compose ? "déjà composée" : null]
    .filter(Boolean).join(" et ");
  const brouillon = occupant.compose ? " Son post reste en brouillon, repris si elle revient sur un créneau." : "";
  return [
    { ...sortie, bouton: "Continuer" },
    { texte: `« ${nom} » est ${raisons}.${brouillon}`, bouton: `Oui, faire sortir « ${nom} »` },
  ];
}

async function envoyerProgrammation(creneauId, articleId, occupant) {
  const reponse = await fetch(`/schedule/${creneauId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ article_id: articleId, occupant_attendu: occupant ? occupant.article_id : null }),
  });
  if (!reponse.ok) throw new Error(await raisonDuRefus(reponse));
  return reponse.json();
}

function afficherValidation(ligne, option, apres) {
  const selecteur = ligne.closest(".prog-selecteur");
  selecteur.querySelector(".prog-validation")?.remove();
  selecteur.querySelector(".prog-option.choisie")?.classList.remove("choisie");
  ligne.querySelector(".prog-option").classList.add("choisie");
  const bloc = nouvelElement("div", "prog-validation");
  ligne.appendChild(bloc);
  const etapes = etapesDeValidation(option.occupant);
  const montrer = (rang) => {
    bloc.innerHTML = "";
    const etape = etapes[rang];
    if (etape.texte) bloc.appendChild(nouvelElement("div", null, etape.texte));
    for (const annonce of option.annonces || []) bloc.appendChild(nouvelElement("div", "prog-annonce", `⚠ ${annonce}`));
    const gestes = nouvelElement("div", "prog-gestes");
    const confirmer = nouvelElement("button", "confirmer", etape.bouton);
    const annuler = nouvelElement("button", null, "Annuler");
    const refus = nouvelElement("span", "etat-geste erreur prog-refus");
    annuler.onclick = () => { bloc.remove(); ligne.querySelector(".prog-option").classList.remove("choisie"); };
    confirmer.onclick = async () => {
      if (rang + 1 < etapes.length) { montrer(rang + 1); return; }
      confirmer.disabled = true;
      refus.textContent = "";
      try {
        const creneau = await envoyerProgrammation(option.creneauId, option.articleId, option.occupant);
        await apres(creneau, option);
      } catch (erreur) {
        refus.textContent = "Refusé : " + erreur.message;
        confirmer.disabled = false;
      }
    };
    gestes.append(confirmer, annuler, refus);
    bloc.appendChild(gestes);
  };
  montrer(0);
}

function ligneOption(option, apres) {
  const ligne = nouvelElement("div", "prog-ligne");
  const bouton = nouvelElement("button", "prog-option", option.titre);
  for (const detail of option.details) bouton.appendChild(nouvelElement("span", "prog-detail", detail));
  bouton.disabled = !option.possible;
  if (option.possible) bouton.onclick = () => afficherValidation(ligne, option, apres);
  ligne.appendChild(bouton);
  // Une option impossible dit pourquoi, A COTE d'elle et non dans une infobulle.
  if (option.raison) ligne.appendChild(nouvelElement("div", "prog-raison", option.raison));
  else for (const annonce of option.annonces || []) ligne.appendChild(nouvelElement("div", "prog-annonce", `⚠ ${annonce}`));
  return ligne;
}

// Le squelette commun aux deux sens. `lire` rend les textes d'en-tete et les options,
// `groupes` l'ordre d'affichage ; un clic sur le bouton qui l'a ouvert le referme.
async function ouvrirSelecteur(zone, { url, lire, apres }) {
  if (zone.firstChild) { zone.innerHTML = ""; return; }
  zone.appendChild(nouvelElement("div", "prog-selecteur", "Chargement…"));
  const relancer = () => { zone.innerHTML = ""; ouvrirSelecteur(zone, { url, lire, apres }); };
  let donnees;
  try {
    const reponse = await fetch(url);
    if (!reponse.ok) throw new Error(await raisonDuRefus(reponse));
    donnees = await reponse.json();
  } catch (erreur) {
    afficherErreur(zone.firstChild, "Options indisponibles : " + erreur.message, relancer);
    return;
  }
  const selecteur = nouvelElement("div", "prog-selecteur");
  const { entete, refus, groupes, vide, pied } = lire(donnees);
  // Le mode est LU, jamais recopie : en arret, rien ne partira, et il faut le savoir ici.
  if (donnees.annonce_mode) selecteur.appendChild(nouvelElement("div", "prog-mode", donnees.annonce_mode));
  for (const texte of entete) selecteur.appendChild(nouvelElement("div", "prog-entete", texte));
  if (refus) selecteur.appendChild(nouvelElement("div", "prog-raison", refus));
  for (const groupe of groupes) {
    selecteur.appendChild(nouvelElement("div", "prog-jour", groupe.titre));
    for (const option of groupe.options) selecteur.appendChild(ligneOption(option, apres));
  }
  if (!groupes.length && vide) selecteur.appendChild(nouvelElement("div", "prog-entete", vide));
  if (pied) selecteur.appendChild(nouvelElement("div", "prog-entete", pied));
  zone.innerHTML = "";
  zone.appendChild(selecteur);
}

function lireCreneaux(articleId) {
  return (d) => {
    const options = d.options.map((o) => ({
      creneauId: o.creneau_id,
      articleId,
      publierA: o.publier_a,
      titre: `${fmtCreneau(o.publier_a)} · ${FORMATS_CRENEAU[o.format] || o.format}`,
      details: [
        o.occupant ? `occupé : ${o.occupant.titre || `post ${o.occupant.post_id}`}`
          + (o.occupant.epingle ? " · 📌 épinglée" : "") + (o.occupant.compose ? " · déjà composée" : "") : "libre",
        o.brouillon ? "brouillon déjà prêt" : (o.possible ? texteComposition(o) : null),
      ].filter(Boolean),
      possible: o.possible,
      raison: o.raison,
      annonces: o.annonces,
      occupant: o.occupant,
      prochain: o.creneau_id === d.prochain_creneau_id,
    }));
    const groupes = [];
    const prochain = options.find((o) => o.prochain);
    if (prochain) groupes.push({ titre: "Prochain créneau compatible", options: [prochain] });
    for (const option of options) {
      if (option.prochain) continue;
      const jour = fmtJour(option.publierA);
      const dernier = groupes[groupes.length - 1];
      if (dernier && dernier.titre === jour) dernier.options.push(option);
      else groupes.push({ titre: jour, options: [option] });
    }
    const raisonArticle = d.raison_article;
    return {
      entete: [[
        `pertinence ${d.pertinence ?? "inconnue"}`, texteAge(d.age_heures), ...d.notes,
      ].join(" · ")],
      refus: raisonArticle,
      // Refuse pour lui-meme, l'article n'a pas neuf fois la meme raison a lire.
      groupes: raisonArticle ? [] : groupes,
      vide: raisonArticle ? null : "Aucun créneau à venir : recalcule la file depuis Programmation.",
    };
  };
}

function lireActus(creneauId) {
  return (d) => {
    const quand = `${fmtCreneau(d.publier_a)} · ${FORMATS_CRENEAU[d.format] || d.format}`;
    const options = d.candidats.map((c) => ({
      creneauId,
      articleId: c.article_id,
      titre: c.titre,
      details: [
        [`pertinence ${c.pertinence ?? "inconnue"}`, texteAge(c.age_heures), ...c.notes].join(" · "),
        c.creneau_actuel ? `quitte ${fmtCreneau(c.creneau_actuel)}` : null,
        c.brouillon ? "brouillon déjà prêt" : (c.possible ? texteComposition(c) : null),
      ].filter(Boolean),
      possible: c.possible,
      raison: c.raison,
      annonces: d.annonces,
      occupant: d.occupant,
    }));
    const possibles = options.filter((o) => o.possible);
    const impossibles = options.filter((o) => !o.possible);
    return {
      entete: [quand + (d.occupant ? ` · occupé : ${d.occupant.titre || `post ${d.occupant.post_id}`}` : " · libre")],
      refus: d.raison_creneau,
      groupes: d.raison_creneau ? [] : [
        possibles.length ? { titre: "Actus possibles", options: possibles } : null,
        impossibles.length ? { titre: "Impossibles ici", options: impossibles } : null,
      ].filter(Boolean),
      vide: d.raison_creneau ? null : "Aucune actu en base pour ce créneau.",
      pied: d.non_affichees ? `${d.non_affichees} autre(s) non affichée(s), les moins pertinentes.` : null,
    };
  };
}

function texteResultat(creneau) {
  const composition = creneau.post_id != null ? "brouillon repris, composition déjà faite" : texteComposition(creneau);
  return `✓ Programmé ${fmtCreneau(creneau.publier_a)}` + (composition ? ` · ${composition}` : "");
}

// Le geste, partout ou une actu vivante se montre : carte, citation, evenement. Il pose
// le bouton, la zone et le resultat ; `apres` met a jour ce qui entoure.
function poserProgrammer(hote, articleId, libelle, apres) {
  const bouton = nouvelElement("button", "programmer", libelle);
  const resultat = hote.querySelector(":scope > .prog-resultat") || nouvelElement("div", "etat-geste ok prog-resultat");
  const zone = nouvelElement("div", "prog-zone");
  // Le selecteur vit dans des lignes cliquables : un clic dedans ne les ouvre pas.
  zone.onclick = (evenement) => evenement.stopPropagation();
  bouton.onclick = (evenement) => {
    evenement.stopPropagation();
    ouvrirSelecteur(zone, {
      url: `/articles/${articleId}/creneaux-possibles`,
      lire: lireCreneaux(articleId),
      apres: async (creneau, option) => {
        zone.innerHTML = "";
        resultat.textContent = texteResultat(creneau);
        if (apres) await apres(creneau, option);
      },
    });
  };
  hote.append(bouton, resultat, zone);
}

// L'etat REEL de la carte : ce qui est au programme, et le geste qui reste possible.
function peindreProgrammation(card, a) {
  const hote = card.querySelector(".prog-hote");
  const resultat = hote.querySelector(":scope > .prog-resultat");
  hote.innerHTML = "";
  if (resultat) hote.appendChild(resultat);
  const c = a.creneau;
  // Un creneau a venir se montre toujours : gele il part a l'heure, modifiable il offre
  // « Changer », dont les options disent elles-memes ce qui reste possible.
  if (a.raison_non_programmable && !c) {
    // L'exclusion a deja son badge et son « Remettre dans la file ».
    if (!a.file_exclu_raison) {
      hote.prepend(nouvelElement("span", "prog-etat note-file", a.raison_non_programmable));
    }
    return;
  }
  if (c && c.etat === "gele") {
    hote.prepend(nouvelElement("span", "prog-etat", `🧊 ${fmtCreneau(c.publier_a)} · gelé, part à l'heure`));
    return;
  }
  if (c) {
    const composition = c.post_id != null ? "composé" : texteComposition(c);
    hote.prepend(nouvelElement("span", "prog-etat", `🗓 ${fmtCreneau(c.publier_a)}` + (composition ? ` · ${composition}` : "")));
  }
  const apres = async (_creneau, option) => {
    // Pas de `load()` : la grille garderait sa place, mais perdrait ce resultat. Seules
    // les cartes touchees se repeignent : celle-ci, et celle de l'actu qui sort.
    const touchees = [a.id, option.occupant && option.occupant.article_id].filter(Boolean);
    for (const id of touchees) {
      const carte = grid.querySelector(`.card[data-article="${id}"]`);
      const article = await fetchArticleById(id);
      if (carte && article) peindreProgrammation(carte, article);
    }
  };
  poserProgrammer(hote, a.id, c ? "Changer" : "Programmer", apres);
}

async function loadSchedulePanel() {
  const list = document.getElementById("schedule-list");
  list.innerHTML = "Chargement…";
  chargerMode();
  chargerOffreReels();
  chargerReels();
  // Ce qui partira, par post. L'utilisateur travaille depuis CE panneau (« l'onglet
  // Flux d'actus ne me sert plus ») : il doit y voir le nombre d'éléments figés et
  // pouvoir ouvrir l'éditeur sans passer par un autre onglet.
  await chargerDeparts();
  let creneaux;
  try {
    const reponse = await fetch("/schedule");
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status} ${(await reponse.text()).slice(0, 200)}`);
    creneaux = await reponse.json();
  } catch (erreur) {
    afficherErreur(list, "Échec du chargement de la file : " + erreur.message, loadSchedulePanel);
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${creneaux.length} créneau${creneaux.length > 1 ? "x" : ""}`;
  if (!creneaux.length) {
    list.innerHTML = '<div id="empty">Aucun créneau : cliquez sur « Recalculer la file ».</div>';
    return;
  }
  list.innerHTML = "";
  for (const c of creneaux) {
    const row = document.createElement("div");
    row.className = "post-row";
    row.innerHTML = `
      <div class="grow">
        <div class="slot-tete">
          <span class="slot-heure"></span>
          <span class="slot-titre"></span>
        </div>
        <div class="slot-alerte" hidden></div>
        <div class="sub"></div>
      </div>
      <span class="format-pill"></span>
      <span class="status-pill"></span>
      <span class="slot-actions"></span>`;
    // L'HEURE en tete : c'est ce qu'un calendrier porte en premier, et la
    // seule information qu'un creneau LIBRE possede vraiment. Le titre la
    // suit, et s'efface (poids normal, italique, gris) quand il n'y en a pas
    // -- « (creneau libre) » occupait la position de titre sur six lignes sur
    // dix, le texte le plus visible de la ligne etant une non-information.
    row.querySelector(".slot-heure").textContent = fmtDate(c.publier_a) || "heure inconnue";
    const titreCreneau = row.querySelector(".slot-titre");
    titreCreneau.textContent = c.article_title || "créneau libre";
    if (!c.article_title) titreCreneau.classList.add("vide");
    // Reclame par l'agent il y a peu : conteneur en creation ou attente de
    // l'heure affichee, pas un echec (voir RAISON_RECLAMATION, runner.py).
    const enCours = c.etat === "echec" && c.erreur === "publication interrompue avant confirmation"
      && new Date(c.publier_a).getTime() > Date.now() - 20 * 60 * 1000;
    // L'ERREUR a sa PROPRE ligne, dans le rouge d'alerte deja en service :
    // elle etait tassee en gris au milieu d'une phrase jointe par des « · »,
    // ou une panne se noie. Plus visible qu'avant, jamais moins.
    const alerte = row.querySelector(".slot-alerte");
    if (c.erreur && !enCours) {
      alerte.hidden = false;
      alerte.textContent = `⚠ ${c.erreur}`;
    }
    // Les identifiants servent, et servent MIEUX en liens : `article_id`
    // mene a l'actu, `post_id` ouvre sa fiche, `ig_media_id` ouvre la
    // publication.
    // Ce qui partira, résumé sur la ligne : combien d'éléments, et combien le gel
    // a écartés. C'est l'information qui manquait — le post 164 annonçait 1 slide
    // et Instagram en a reçu 3. `null` = pas encore gelé : on l'écrit, on ne
    // suppose rien.
    const depart = departsParPost ? departsParPost.get(c.post_id) : null;
    const elements = depart && depart.elements;
    const ecartes = elements ? elements.filter((e) => e.ecarte).length : 0;
    poserParties(row.querySelector(".sub"), [
      `créneau ${c.id}`,
      c.article_id != null ? renvoiArticle(c.article_id, c.article_url) : null,
      c.post_id != null ? renvoiPost(c.post_id) : null,
      c.ig_media_id ? renvoiInstagram(c.ig_media_id) : null,
      elements
        ? `${elements.filter((e) => !e.ecarte).length} élément(s)`
          + (ecartes ? ` · ${ecartes} écarté(s) au gel` : "")
        : null,
      c.relevance != null ? `pertinence ${c.relevance}` : null,
      c.epingle ? "📌 épinglé" : null,
      // Programme sans post : la ligne dit quand l'agent s'en chargera.
      texteComposition(c),
    ]);
    // Cliquer la ligne OUVRE ce qui va partir, et le rend modifiable. L'éditeur
    // vivait dans l'onglet Posts seulement, et il fallait y aller à la main.
    if (c.post_id != null) {
      row.style.cursor = "pointer";
      row.title = "Voir et modifier ce qui va partir";
      row.onclick = (evenement) => {
        // Les boutons d'action de la ligne (épingler, choisir, décaler, ne pas publier)
        // et les liens ne doivent pas ouvrir la fiche par-dessus leur effet.
        if (evenement.target.closest("button, a")) return;
        ouvrirPost(c.post_id);
      };
    }
    const formatPill = row.querySelector(".format-pill");
    formatPill.classList.add(c.format);
    formatPill.textContent = FORMATS_CRENEAU[c.format] || c.format;
    const pastille = row.querySelector(".status-pill");
    pastille.classList.add(enCours ? "gele" : c.etat);
    pastille.textContent = enCours ? "Publication en cours" : (ETATS_CRENEAU[c.etat] || c.etat);
    const actions = row.querySelector(".slot-actions");
    if (CRENEAUX_MODIFIABLES.has(c.etat)) {
      // `libelle` est VISIBLE, `titre` reste l'explication longue. Quatre icones
      // nues ne disaient rien -- et « 📌 » / « 📍 » sont deux actions opposees
      // que seule l'inclinaison du dessin separait.
      const bouton = (libelle, titre, donnees) => {
        const b = document.createElement("button");
        b.textContent = libelle;
        b.title = titre;
        b.setAttribute("aria-label", titre);
        b.onclick = () => modifierCreneau(c.id, donnees);
        actions.appendChild(b);
      };
      // `c.epingle` seul : un creneau mort (article purge) doit pouvoir se desepingler.
      if (c.article_id || c.epingle) {
        bouton(
          c.epingle ? "📍 Désépingler" : "📌 Épingler",
          c.epingle
            ? "Désépingler : ce créneau redevient arbitrable par le pipeline"
            : "Épingler : l'arbitrage ne touchera plus ce créneau",
          { epingle: !c.epingle },
        );
      }
      const choisir = document.createElement("button");
      choisir.textContent = "Choisir une actu";
      choisir.title = "Voir les actus possibles pour ce créneau";
      choisir.setAttribute("aria-label", choisir.title);
      const zoneChoix = nouvelElement("div", "prog-zone");
      zoneChoix.onclick = (evenement) => evenement.stopPropagation();
      row.appendChild(zoneChoix);
      choisir.onclick = () => ouvrirSelecteur(zoneChoix, {
        url: `/schedule/${c.id}/actus-possibles`,
        lire: lireActus(c.id),
        apres: async (creneau) => {
          document.getElementById("retrait-programmation").textContent = texteResultat(creneau);
          await loadSchedulePanel();
        },
      });
      actions.appendChild(choisir);
      if (c.article_id) {
        bouton("⏬ Décaler", "Décaler au créneau suivant", { decaler: true });
      }
    }
    if (RETIRABLES.has(c.etat) && (c.article_id || c.post_id)) {
      boutonNePasPublier(actions, {
        creneauId: c.id,
        titre: c.article_title,
        postId: c.post_id,
        publierA: c.publier_a,
        articleConnu: c.article_id != null,
        zoneResultat: "retrait-programmation",
        apres: loadSchedulePanel,
      });
    }
    list.appendChild(row);
  }
}

// --- Ne pas publier ---------------------------------------------------------
//
// Le seul retrait de la console (decision du 2026-10-30), sur les trois surfaces qui
// montrent ce qui va partir. Un RETRAIT, jamais une condition : ne rien faire publie
// a l'heure. A ne pas confondre avec `RAISON_RELECTURE`, l'etat d'un gel refait.
async function envoyerRetrait(creneauId) {
  const reponse = await fetch(`/schedule/${creneauId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sauter: true }),
  });
  if (!reponse.ok) throw new Error(await raisonDuRefus(reponse));
  return "retrait";
}

// `postId` nomme le post quand l'article a ete purge : plus de carte, donc plus de
// retour possible, et la confirmation ne le promet pas.
function boutonNePasPublier(parent, { creneauId, titre, postId, publierA, articleConnu, zoneResultat, apres }) {
  const b = document.createElement("button");
  b.className = "ne-pas-publier";
  b.textContent = "🚫 Ne pas publier";
  const nom = titre || `post ${postId}`;
  const heure = fmtDate(publierA) || "heure inconnue";
  const retour = articleConnu
    ? "Réversible depuis sa carte, bouton « ↩ Remettre dans la file »."
    : "Son article a été purgé : ce retrait ne se défait pas.";
  b.title = `Retirer du programme. ${retour}`;
  b.setAttribute("aria-label", b.title);
  const refus = document.createElement("span");
  refus.className = "etat-geste erreur refus-retrait";
  b.onclick = async (evenement) => {
    evenement.stopPropagation();
    if (!confirm(`Ne pas publier « ${nom} » à ${heure} ?\n\n`
      + `Le créneau se libère, le robot peut y mettre une autre actu. Le brouillon reste en base.\n${retour}`)) return;
    b.disabled = true;
    refus.textContent = "";
    try {
      await envoyerRetrait(creneauId);
    } catch (erreur) {
      refus.textContent = "Retrait refusé : " + erreur.message;
      b.disabled = false;
      return;
    }
    const resultat = `✓ « ${nom} » ne partira pas à ${heure}.`;
    const zone = zoneResultat && document.getElementById(zoneResultat);
    if (zone) zone.textContent = resultat;
    await apres(resultat);
  };
  parent.append(b, refus);
}

async function modifierCreneau(id, donnees) {
  const reponse = await fetch(`/schedule/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(donnees),
  });
  if (!reponse.ok) {
    const corps = await reponse.json().catch(() => ({}));
    alert("Action refusée : " + (corps.detail || reponse.status));
  }
  loadSchedulePanel();
}

document.getElementById("schedule-rebuild").onclick = async () => {
  const reponse = await fetch("/schedule/rebuild", { method: "POST" });
  if (!reponse.ok) alert("Échec du recalcul de la file : " + reponse.status);
  loadSchedulePanel();
};

// --- Relecture avant publication -------------------------------------------
//
// Ce que `GET /relecture` apporte et que la fiche de post ne savait PAS dire :
// quand ce post part, et CE QUI PARTIRA -- `texte_legende` aere les paragraphes,
// remet le diese sur les hashtags, les deduplique, ajoute le credit obligatoire
// et tronque a 2150 points de code. La legende editee n'est pas la legende
// publiee, et `posts.credit` n'etait affiche nulle part.
//
// Un cache par post, rempli par la liste, pour que la fiche ouverte depuis cette
// liste n'ait pas a refaire la requete. `null` = on n'a pas pu lire : la section
// dit alors « inconnu », elle n'invente rien (regle du bandeau de supervision).
let departsParPost = null;

async function chargerDeparts() {
  try {
    const reponse = await fetch("/relecture");
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
    const lignes = await reponse.json();
    departsParPost = new Map(lignes.map((d) => [d.post_id, d]));
    return lignes;
  } catch {
    // Degrade sans casser : la fiche et la liste des posts restent utilisables.
    departsParPost = null;
    return null;
  }
}

function minutesLisibles(minutes) {
  if (minutes < 0) return "dépassé";
  if (minutes < 60) return `dans ${minutes} min`;
  const h = Math.floor(minutes / 60);
  return `dans ${h} h ${String(minutes % 60).padStart(2, "0")}`;
}

const ETATS_DEPART = { programme: "programmé", gele: "gelé", echec: "publication en cours" };

async function loadRelectureList() {
  const zone = document.getElementById("relecture-list");
  if (!zone) return;
  const lignes = await chargerDeparts();
  if (lignes === null) {
    // « Inconnu, jamais vert » : on ne dit surtout pas « rien a relire ».
    zone.innerHTML = '<div class="media-empty">Liste de relecture injoignable — on ne sait pas'
      + " ce qui attend une relecture.</div>";
    return;
  }
  if (!lignes.length) {
    zone.innerHTML = '<div class="media-empty">Aucun post composé en attente de départ.</div>';
    return;
  }
  zone.innerHTML = "";
  for (const d of lignes) {
    const row = document.createElement("div");
    row.className = "relecture-row";
    row.innerHTML = `
      <span class="quand"></span>
      <div class="grow"><div class="hl"></div><div class="sub"></div><div class="relecture-actions"></div></div>`;
    row.querySelector(".quand").textContent =
      `${fmtDate(d.publier_a) || "?"} · ${minutesLisibles(d.minutes_restantes)}`;
    row.querySelector(".hl").textContent = d.accroche || `post ${d.post_id}`;
    const parties = [
      d.format === "reel" ? "REELS" : "POST",
      ETATS_DEPART[d.etat] || d.etat,
      `${d.legende_longueur}/${d.legende_maximum} car.`,
      `${d.hashtags_publies.length}/${d.hashtags_maximum} #`,
    ];
    if (!d.editable) parties.push(d.raison_non_editable);
    poserParties(row.querySelector(".sub"), parties);
    row.onclick = () => ouvrirPost(d.post_id);
    if (RETIRABLES.has(d.etat)) {
      boutonNePasPublier(row.querySelector(".relecture-actions"), {
        creneauId: d.creneau_id,
        titre: d.article_title || d.accroche,
        postId: d.post_id,
        publierA: d.publier_a,
        articleConnu: d.article_title != null,
        zoneResultat: "retrait-relecture",
        apres: loadRelectureList,
      });
    }
    zone.appendChild(row);
  }
}

async function loadPostsPanel() {
  const list = document.getElementById("posts-list");
  list.innerHTML = "Chargement…";
  // Rafraichie avec le panneau : la file avance toutes les 10 minutes, un creneau
  // gele entre deux ouvertures de l'onglet.
  loadRelectureList();
  const params = new URLSearchParams({ limit: 100 });
  const status = document.getElementById("post-status").value;
  if (status) params.set("status", status);
  let posts;
  try {
    const reponse = await fetch(`/posts?${params}`);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status} ${(await reponse.text()).slice(0, 200)}`);
    posts = await reponse.json();
  } catch (erreur) {
    afficherErreur(list, "Échec du chargement des posts : " + erreur.message, loadPostsPanel);
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${posts.length} post${posts.length > 1 ? "s" : ""}`;
  if (!posts.length) {
    list.innerHTML = '<div id="empty">Aucun post pour ce filtre.</div>';
    return;
  }
  list.innerHTML = "";
  for (const p of posts) {
    const row = document.createElement("div");
    row.className = "post-row";
    const headline = (p.slides || [])[0]?.headline || "(sans accroche)";
    row.innerHTML = `
      <div class="grow">
        <div class="hl"></div>
        <div class="sub"></div>
      </div>
      <span class="status-pill ${p.status}">${STATUS_LABELS[p.status] || p.status}</span>`;
    row.querySelector(".hl").textContent = headline.replace(/\*\*/g, "");
    // `post ${p.id}` reste du texte : c'est la ligne entiere qui ouvre cette
    // fiche-la. L'article, lui, devient un lien vers l'actu.
    poserParties(row.querySelector(".sub"), [
      `post ${p.id}`,
      p.article_id != null ? renvoiArticle(p.article_id, p.article_url) : null,
      p.source_name || "?",
      fmtDate(p.created_at),
    ]);
    row.onclick = () => ouvrirPost(p.id);
    list.appendChild(row);
  }
}

async function enregistrerPost(postId, donnees) {
  const reponse = await fetch(`/posts/${postId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(donnees),
  });
  if (!reponse.ok) throw new Error(await raisonDuRefus(reponse));
  return reponse.json();
}

// La raison d'un refus, LISIBLE. Le corps brut d'une 409 est un JSON
// (`{"detail": "..."}`) : affiche tel quel dans la fiche, il noie la phrase que
// le serveur a pris soin d'ecrire en francais -- or c'est elle qui dit s'il faut
// attendre, rouvrir ou renoncer.
async function raisonDuRefus(reponse) {
  const texte = await reponse.text();
  try {
    const corps = JSON.parse(texte);
    if (typeof corps.detail === "string") return corps.detail;
    if (Array.isArray(corps.detail)) {
      return corps.detail.map((e) => e.msg || JSON.stringify(e)).join(" ; ");
    }
  } catch {
    // Pas du JSON : le texte brut est deja la meilleure reponse qu'on ait.
  }
  return texte || `HTTP ${reponse.status}`;
}

const detailEl = document.getElementById("post-detail");

// --- Le tampon de la legende ----------------------------------------------
//
// `renderPostDetail` reconstruit TOUTE la fiche depuis la reponse du serveur, et
// SIX gestes de cette meme fiche la rappellent sans rien enregistrer : choisir
// une variante de cover, basculer POST/REELS, valider un fond, cocher un media,
// approuver, marquer publie. Le geste editorial normal -- ecrire la legende,
// puis choisir la cover qui va avec -- detruisait donc le texte en silence, et
// la fermeture le jetait aussi.
//
// UN SEUL point de capture, l'evenement `input` des deux zones de texte : un
// tampon rempli a la main dans chacun des six gestes serait a refaire au
// septieme. Et un seul point de lecture, `textesAReinjecter`, qui est volontairement
// PURE (pas de DOM) pour etre verifiable.
let brouillonTexte = null; // { postId, caption, hashtags }

function textesDuServeur(post) {
  return { caption: post.caption || "", hashtags: (post.hashtags || []).join(" ") };
}

// Les textes a reinjecter apres un re-rendu, ou `null` quand il n'y a rien a
// sauver : pas de tampon, tampon d'un AUTRE post, ou tampon identique a ce que
// le serveur vient de rendre (donc deja enregistre).
function textesAReinjecter(brouillon, post) {
  if (!brouillon || brouillon.postId !== post.id) return null;
  const serveur = textesDuServeur(post);
  if (brouillon.caption === serveur.caption && brouillon.hashtags === serveur.hashtags) return null;
  return { caption: brouillon.caption, hashtags: brouillon.hashtags };
}

// --- Predicat "video exploitable" reimplemente depuis app/content/media.py :
// on ne peut pas importer du Python dans le navigateur. Toute modification de
// la regle cote serveur doit etre reportee ici a la main.
// Limite Instagram pour une slide de carrousel (app.content.media.DUREE_MAX_SLIDE_MS) :
// une video plus longue reste affichee (pour qu'on sache qu'elle existe) mais n'est
// pas cochable comme slide.
const DUREE_MAX_SLIDE_MS = 60000;

// Un post survit a la purge de son article (`retention_days`) : GET peut donc
// legitimement rendre 404, pas seulement en cas de panne reseau -- dans les
// deux cas on degrade a null plutot que de casser l'ouverture du detail.
async function fetchArticleById(id) {
  if (id == null) return null;
  try {
    const reponse = await fetch(`/articles/${id}`);
    if (!reponse.ok) return null;
    return await reponse.json();
  } catch {
    return null;
  }
}

async function chargerCovers(postId) {
  const reponse = await fetch(`/posts/${postId}/covers`, { method: "POST" });
  if (!reponse.ok) throw new Error(await reponse.text());
  return await reponse.json(); // { covers: [...], overflow: [...] } -- cf. CoversOut
}

async function ouvrirPost(postId) {
  // Le tampon est celui d'UNE fiche : ouvrir un autre post le perime.
  if (brouillonTexte && brouillonTexte.postId !== postId) brouillonTexte = null;
  let post;
  try {
    post = await (await fetch(`/posts/${postId}`)).json();
  } catch (erreur) {
    alert("Échec du chargement du post : " + erreur.message);
    return;
  }

  const article = await fetchArticleById(post.article_id);

  // Ce qui va REELLEMENT partir (legende apres `texte_legende`, credit, elements
  // figes). Une seule requete, sans appel paye ni reseau sortant. Un echec
  // degrade la section en « inconnu » et n'empeche jamais d'ouvrir la fiche.
  await chargerDeparts();

  // Un seul Chromium pour l'apercu, pas deux : `/covers` rend les 4 variantes
  // sur le fond du post et renvoie l'`overflow` de chacune (CoversOut) -- la
  // variante retenue (ou la premiere par defaut) y est deja, donc le meme
  // texte/fond qu'un appel a `/render` aurait mesure. Repayer un second
  // lancement pour le meme signal doublait le temps d'ouverture d'un post, le
  // geste que l'utilisateur fait chaque soir. Un echec (Chromium absent en
  // local -> 503, ou toute autre panne) ne doit jamais empecher l'ouverture du
  // detail -- on degrade sans badge plutot que de bloquer l'edition.
  let covers = null;
  try {
    covers = await chargerCovers(postId);
  } catch (erreur) {
    alert("Aperçu des covers indisponible : " + erreur.message);
  }

  renderPostDetail(post, article, covers);
}

// --- La liste finale : ce que Meta recevra ----------------------------------
//
// LE DEFAUT QUE CETTE SECTION COMBLE, mesure. Le post 164 (Tomorrowland)
// affichait 1 slide dans la fiche, et Instagram a recu 3 images -- dont un logo
// Wikipedia recadre au point que les lettres etaient coupees, repere APRES
// publication. `posts.slides` est le BROUILLON ; le gel y ajoutait jusqu'a neuf
// medias de l'actu sans que rien ne persiste le resultat. Sur la base vivante,
// 27 des 48 carrousels geles recalculables ne retombent pas sur le nombre de
// fichiers reellement figes -- la liste publiee etait donc inconnaissable.
//
// Depuis la migration 0022, le gel l'ECRIT (`creneaux.elements`). Cette section
// la montre telle quelle, vignettes = FICHIERS FIGES quand ils existent, et la
// rend modifiable : supprimer, reordonner, remplacer, ajouter.
const ORIGINES_ELEMENT = {
  article: "📰 photo de l'actu",
  artiste: "🎤 compte d'un artiste suivi",
  compte: "📸 compte qui a publié l'actu",
  web: "🌐 image trouvée sur le web",
  kinda: "🎨 aplat Kinda",
  api: "🎬 vidéo donnée par l'API Meta",
  ytdlp: "🎬 vidéo récupérée par yt-dlp",
  depot: "📁 fichier déposé depuis le disque",
};

// Les elements MEDIA sur lesquels l'edition porte. La cover n'en est pas : elle
// se modifie plus haut (variantes, fond), et elle part toujours en premier.
//
// Priorite au MANIFESTE du gel -- c'est ce qui part REELLEMENT. A defaut (creneau
// pas encore gele, ou gele avant la migration 0022), on retombe sur les slides du
// brouillon, en le DISANT : « inconnu, jamais vert ».
function elementsMedia(post, depart) {
  if (depart && depart.elements) return depart.elements.filter((e) => e.kind === "media");
  return (post.slides || []).slice(1).filter((s) => s.kind === "media").map((s) => ({
    kind: "media", type: s.type, source_url: s.url, origine: s.origine || null,
    compte: s.compte || null, fichier: null, ecarte: false, raison: null,
  }));
}

// Un element redevient une SLIDE. L'enrichissement par la reserve est ce qui
// garde les dimensions, la duree et la vignette : le manifeste, denormalise pour
// survivre a la purge, ne porte que l'essentiel.
function slideDepuisElement(element, candidats) {
  const connu = (candidats || []).find((c) => c.url === element.source_url);
  if (connu) return { kind: "media", ...connu };
  return {
    kind: "media", type: element.type || "photo", url: element.source_url,
    origine: element.origine, compte: element.compte,
  };
}

// La vignette d'un element : le FICHIER FIGE d'abord (ce que Meta recevra, avec
// son recadrage reel), la source ensuite, rien si les deux manquent. Une copie
// locale (`file://`) n'est pas affichable par un navigateur : on ne l'essaie pas.
function vignetteElement(element, depart) {
  if (element.fichier && depart) {
    const url = `/relecture/${depart.creneau_id}/fichiers/${encodeURIComponent(element.fichier)}`;
    return element.fichier.endsWith(".mp4")
      ? `<video src="${url}" muted preload="metadata"></video>`
      : `<img src="${url}" loading="lazy" onerror="this.remove()">`;
  }
  const source = element.source_url || "";
  if (/^https?:/.test(source)) {
    return `<img src="${escapeHtml(source)}" loading="lazy" onerror="this.remove()">`;
  }
  return "";
}

// --- UNE ECRITURE DIT TOUJOURS SI ELLE A REUSSI ----------------------------
//
// LE DEFAUT QUI A FAIT ECRIRE A L'UTILISATEUR « je n'arrive pas a enregistrer »
// (2026-10-05). Verifie au navigateur : le clic envoyait bien `PATCH /posts/176`,
// le serveur repondait 200, la fiche se rechargeait -- et RIEN ne le disait.
// Aucun etat « en cours », aucun libelle qui change, aucune confirmation. Un
// succes muet est indistinguable d'un echec muet, donc l'utilisateur conclut que
// ca ne marche pas, et il a raison de le conclure. Meme defaut que l'ecriture
// muette de la categorie d'une source, corrigee le 2026-10-02, reste sur CINQ
// boutons de cette fiche -- et un double-clic envoyait deux ecritures.
//
// `dernierGeste` survit au re-rendu, comme `brouillonTexte` : tous les gestes de
// la fiche rappellent `renderPostDetail`, donc un message pose dans le DOM juste
// avant serait efface par le rendu qui suit l'ecriture reussie. C'est exactement
// ce qui rend la propriete SILENCIEUSE a casser -- d'ou la preuve par mutation de
// `tests/dashboard/test_dashboard_ecritures.py`.
let dernierGeste = null; // { postId, niveau: "ok" | "erreur" | "en-cours", texte }
let gesteEnCours = false;

function annoncerGeste(postId, niveau, texte) {
  dernierGeste = { postId, niveau, texte };
  const zone = detailEl.querySelector("#etat-geste");
  if (zone) peindreGeste(zone, postId);
}

function peindreGeste(zone, postId) {
  const a = dernierGeste && dernierGeste.postId === postId ? dernierGeste : null;
  zone.className = "etat-geste" + (a ? " " + a.niveau : "");
  zone.textContent = a ? a.texte : "";
}

// Le point de passage de TOUTE ecriture de la fiche. Il fait trois choses qu'on
// ne peut pas obtenir d'un `try/catch` nu : il empeche la seconde ecriture d'un
// double-clic, il montre que quelque chose se passe, et il DIT le resultat --
// reussite comprise. Un echec reste a l'ecran (pas d'`alert` a chasser) avec sa
// raison, a cote du bouton qui l'a provoque.
async function ecrireDepuisLaFiche(postId, { bouton, libelle, action }) {
  if (gesteEnCours) return undefined;
  gesteEnCours = true;
  const ancien = bouton ? bouton.textContent : null;
  if (bouton) { bouton.disabled = true; bouton.textContent = "…"; }
  annoncerGeste(postId, "en-cours", `${libelle}…`);
  try {
    const resultat = await action();
    annoncerGeste(postId, "ok", `✓ ${libelle} — enregistré`);
    gesteEnCours = false;
    return resultat;
  } catch (erreur) {
    annoncerGeste(postId, "erreur", `✕ ${libelle} — ${erreur.message}`);
    gesteEnCours = false;
    if (bouton) { bouton.disabled = false; bouton.textContent = ancien; }
    return undefined;
  }
}

// --- La reserve de visuels, avec ou sans creneau ----------------------------
//
// `GET /relecture` ne rend `candidats` que pour un post POSE SUR UN CRENEAU. Un
// brouillon qui n'est sur aucun creneau a venir doit rester editable : la liste
// unique remplace les cases « Medias de l'actu », qui etaient jusqu'ici le seul
// chemin dans ce cas-la. On refait donc localement ce que fait
// `app/publish/preparation.py::candidats_editables` -- memes regles, meme ordre :
// actifs du post d'abord, medias de l'actu ensuite, dedupe, et JAMAIS le visuel
// d'un compte media (decision du 2026-09-17).
function reserveLocale(post, article) {
  const pool = [];
  for (const actif of post.assets || []) {
    if (actif.type === "photo" || actif.type === "video") pool.push(actif);
  }
  // Decision du 2026-09-17 : jamais l'image ni la video d'un compte média.
  const interdit = !!(article && article.visuels_interdits);
  if (article && !interdit) {
    for (const m of article.media || []) {
      if (m.type === "photo" || m.type === "video") pool.push({ ...m, origine: "article" });
    }
  }
  const vus = new Set();
  const reserve = [];
  for (const m of pool) {
    const cle = m.url || m.preview_url;
    if (!cle || vus.has(cle)) continue;
    vus.add(cle);
    reserve.push({
      kind: "media", type: m.type, url: m.url, preview_url: m.preview_url || null,
      duration_ms: m.duration_ms != null ? m.duration_ms : null,
      width: m.width != null ? m.width : null, height: m.height != null ? m.height : null,
      origine: m.origine || "article", compte: m.compte || null,
      permalink: m.permalink || null, publie_le: m.publie_le || null,
    });
  }
  return reserve;
}

// Ce que la reserve sait d'un element de la liste, et que le manifeste ne porte
// pas : dimensions, duree, permalien du post d'origine, date. C'est ce qui a
// disparu avec la section « Visuels retenus » -- et qui devait se retrouver ici.
function infosDeLElement(element, reserve) {
  return (reserve || []).find(
    (c) => c.url === element.source_url || (c.preview_url && c.preview_url === element.source_url)
  ) || {};
}

function detailsDuVisuel(media) {
  const bouts = [];
  if (media.width && media.height) bouts.push(`${media.width}×${media.height}px`);
  if (media.duration_ms != null) bouts.push(`${Math.round(media.duration_ms / 1000)} s`);
  return bouts.join(" · ");
}

function renderPostDetail(post, article, covers) {
  const cover = (post.slides || [])[0] || {};
  const variantes = (post.variants && post.variants.variantes) || [];
  const retenue = post.variants ? post.variants.retenue : null;
  // La cover EFFECTIVEMENT servie (slides[0]) est la variante retenue, ou la
  // premiere par defaut (cf. create_post) -- c'est donc aussi l'index a lire
  // dans `covers.overflow` pour savoir si CE qui sera publie tient.
  const indexActif = retenue != null ? retenue : 0;
  const enDefaut = !!(covers && covers.overflow && covers.overflow[indexActif]);

  const avertissementHtml = enDefaut ? `
      <div class="render-warning">
        ⚠ Texte trop long même à la taille de police minimale sur la cover retenue --
        à corriger avant publication.
      </div>` : "";

  const coversHtml = variantes.length ? variantes.map((v, i) => {
    const variantEnDefaut = !!(covers && covers.overflow && covers.overflow[i]);
    return `
    <div class="cover-choice${retenue === i ? " retenue" : ""}${variantEnDefaut ? " en-defaut" : ""}" data-index="${i}">
      ${covers ? `<img src="${covers.covers[i]}" loading="lazy">` : `<div class="media-empty">aperçu indisponible</div>`}
      <span class="tag">Variante ${i + 1}${retenue === i ? " · retenue" : ""}${variantEnDefaut ? " · texte trop long" : ""}</span>
    </div>`;
  }).join("") : `<div class="media-empty">Pas de variantes pour ce post.</div>`;

  // --- Format : lu, jamais choisi -----------------------------------------------
  //
  // Le creneau l'impose (decision du 2026-10-31) : basculer un gabarit a la main faisait
  // lacher le post au gel, et repayait une composition. Plus de selecteur, donc plus
  // de miroir navigateur des regles de reel : c'est le serveur qui les applique au geste
  // de programmation, et au gel.
  const estReel = post.template === "kinda_reel";
  // D'où vient le FOND de la cover. Posé à la composition (`variants.fond`),
  // jamais déduit : une fois l'URL dans la slide, plus rien ne dirait si elle
  // vient de l'actu, du compte qui l'a publiée, d'un artiste cité, ou du web.
  //
  // Deux de ces libellés décrivaient un comportement RETIRÉ. `kinda` disait
  // « mieux vaut l'aplat sombre » : depuis la Tâche 5 du chantier visuels
  // (2026-09-21), une composition neuve ne pose plus jamais cet aplat, elle
  // SAUTE le créneau — un brouillon qui porte encore cette origine est donc un
  // vestige. Et `web` promettait un crédit du site, retiré le même jour.
  const ORIGINES_FOND = {
    article: "📰 photo de l'actu",
    compte: "📸 photo du compte qui a publié l'actu (l'actu n'offrait qu'une affiche)",
    artiste: "🎤 photo d'un artiste suivi cité (l'actu n'offrait qu'une affiche)",
    web: "🌐 image trouvée sur le web (dernier recours) — le site n'est pas crédité",
    kinda: "🎨 aplat Kinda — brouillon composé avant le 2026-09-21 : aucune photo"
      + " n'avait été trouvée. Une composition d'aujourd'hui sauterait le créneau"
      + " au lieu de publier cet aplat.",
  };
  const origineFond = ((post.variants || {}).fond || {}).origine;
  const fondSection = origineFond
    ? `<div class="note">${escapeHtml(ORIGINES_FOND[origineFond] || origineFond)}</div>`
    : "";

  // --- Le DEPART : quand, dans quel etat, et ce qui peut encore se modifier ---
  //
  // `departsParPost === null` veut dire qu'on n'a PAS PU lire : on l'ecrit. Une
  // valeur non lue s'affiche inconnue, jamais verte.
  const depart = departsParPost ? departsParPost.get(post.id) : undefined;
  let bandeauDepart;
  if (departsParPost === null) {
    bandeauDepart = `<div class="depart-bandeau inconnu">Aperçu du départ injoignable —`
      + ` on ne sait pas ce qui partira, ni quand.</div>`;
  } else if (!depart) {
    bandeauDepart = `<div class="depart-bandeau">Ce post n'est sur aucun créneau à venir :`
      + ` rien ne partira tout seul.</div>`;
  } else {
    // PLUS DE BOUTON « Rouvrir » (2026-10-04). Le re-gel est AUTOMATIQUE : toute
    // edition de la cover ou des slides invalide les fichiers figés toute seule.
    // Ce qu'on garde, c'est la RAISON quand l'édition va être refusée — règle de
    // la refonte : un contrôle indisponible imprime pourquoi, jamais un bouton
    // gris et muet.
    const noteRegel = depart.etat !== "gele"
      ? ""
      : depart.reouvrable
        ? `<div class="note">Créneau gelé : modifier la cover ou les éléments refait les`
          + ` fichiers figés automatiquement (l'agent repasse dans les 10 min). La légende et`
          + ` les hashtags, eux, sont relus juste avant l'envoi.</div>`
        : `<div class="reel-reason">⚠ ${escapeHtml(depart.raison_non_reouvrable || "")}`
          + ` — la légende et les hashtags restent modifiables.</div>`;
    bandeauDepart = `
      <div class="depart-bandeau">
        <span class="quand">${escapeHtml(fmtDate(depart.publier_a) || "?")}</span>
        <span class="dans">${escapeHtml(minutesLisibles(depart.minutes_restantes))}</span>
        <span class="etat">${escapeHtml(depart.format)} · ${escapeHtml(depart.etat)}</span>
      </div>
      <div class="depart-actions"></div>
      ${depart.raison_non_editable ? `<div class="reel-reason">${escapeHtml(depart.raison_non_editable)}</div>` : ""}
      ${noteRegel}`;
  }

  // --- La LISTE UNIQUE : ce que Meta recevra ---------------------------------
  //
  // TROIS listes montraient le meme visuel jusqu'au 2026-10-05 : « Visuels
  // retenus » (les actifs), « Médias de l'actu (carrousel) » (des cases a cocher
  // sur `article.media`) et « Ce que Meta recevra ». Decision de l'utilisateur :
  // il n'en reste qu'UNE, la liste finale -- celle qui part. Les candidats
  // disponibles se proposent AU MOMENT D'AJOUTER, pas en permanence dans deux
  // sections concurrentes.
  //
  // Rien d'utile n'a disparu avec les deux autres : l'origine, le compte, la
  // date du post et le lien « voir le post » (qui ne vivaient que dans « Visuels
  // retenus ») sont desormais sur la ligne de l'element ; cocher/decocher un
  // media de l'actu est devenu « ajouter » / « retirer », qui passent par
  // `carrousel_explicite` et sont donc, eux, REELLEMENT pris en compte par le gel.
  const elementsListe = elementsMedia(post, depart);
  const reserve = (depart && depart.candidats) || reserveLocale(post, article);
  const dejaDansLaListe = new Set(elementsListe.map((e) => e.source_url));
  // Modifiable ? Deux refus possibles, et ils ne portent pas sur la meme chose :
  // la publication EN VOL ferme tout (`editable`), et un créneau gelé trop près de
  // son départ ne peut plus refaire ses fichiers (`reouvrable`) — la légende, elle,
  // reste modifiable jusqu'au bout. Les deux impriment leur raison plus haut.
  const editableListe = !depart
    || (depart.editable && (depart.etat !== "gele" || depart.reouvrable));
  const raisonNonEditable = depart
    ? (depart.raison_non_editable || depart.raison_non_reouvrable || "")
    : "";
  // Les deux refus que les cases a cocher « Médias de l'actu » portaient, et qui
  // devaient survivre a leur suppression : une video SANS URL directe (la source
  // ne donne qu'un lien de page -- rien a telecharger, et un PATCH avec
  // `url: null` echoue en 422 pour une action que l'UI presentait comme
  // possible), et une video trop longue pour une SLIDE de carrousel. L'option
  // reste VISIBLE et porte sa raison : jamais grise et muette.
  const motifInutilisable = (c) => {
    if (!c.url) return "pas d'URL directe : rien à télécharger";
    if (c.type === "video" && c.duration_ms != null && c.duration_ms > DUREE_MAX_SLIDE_MS) {
      return `trop longue pour une slide (max ${DUREE_MAX_SLIDE_MS / 1000} s)`;
    }
    return null;
  };
  const optionsReserve = reserve.map((c, i) => {
    const dims = c.width && c.height ? ` ${c.width}×${c.height}` : "";
    const marque = dejaDansLaListe.has(c.url) ? " (déjà dans la liste)" : "";
    const qui = c.compte || ORIGINES_ELEMENT[c.origine] || c.origine || "?";
    const motif = motifInutilisable(c);
    return `<option value="${i}"${motif ? " disabled" : ""}>${escapeHtml(
      `${c.type}${dims} · ${qui}${marque}${motif ? " — " + motif : ""}`)}</option>`;
  }).join("");
  const reserveUtilisable = reserve.filter((c) => !motifInutilisable(c)).length;
  const lignesElements = [
    // La cover d'abord, toujours : elle n'est ni supprimable ni déplaçable, et le
    // dire explicitement vaut mieux que de l'omettre de la liste.
    `<div class="element-ligne cover">
       <span class="rang">1</span>
       ${vignetteElement(
          (depart && depart.elements && depart.elements.find((e) => e.kind === "cover")) || {},
          depart)}
       <div class="quoi">Cover Kinda
         <div class="d2">${escapeHtml(ORIGINES_ELEMENT[origineFond] || "fond inconnu")}
           — se modifie dans « Cover », plus haut</div>
       </div>
     </div>`,
    // Le rang affiché est la place CHEZ META, donc il ne compte que les éléments
    // qui partent : un écarté porte « — ». Numéroter les écartés avec les autres
    // ferait croire que le carrousel en a un de plus qu'il n'en aura.
    ...elementsListe.map((e, i) => {
      const infos = infosDeLElement(e, reserve);
      const details = detailsDuVisuel(infos);
      const lien = infos.permalink
        ? ` <a href="${escapeHtml(infos.permalink)}" target="_blank" rel="noopener">voir le post</a>`
        : "";
      const date = infos.publie_le ? ` · post du ${escapeHtml(fmtDate(infos.publie_le) || "?")}` : "";
      return `
      <div class="element-ligne${e.ecarte ? " ecarte" : ""}" data-rang="${i}">
        <span class="rang">${e.ecarte ? "—"
          : elementsListe.slice(0, i).filter((x) => !x.ecarte).length + 2}</span>
        ${vignetteElement(e, depart)}
        <div class="quoi">${escapeHtml(e.type || "média")}${details ? " · " + escapeHtml(details) : ""}${
          e.ecarte ? " — écarté au gel" : ""}
          <div class="d2">${escapeHtml(ORIGINES_ELEMENT[e.origine] || e.origine || "origine inconnue")}
            ${e.compte ? "· " + escapeHtml(e.compte) : ""}${date}${lien}</div>
          ${e.raison ? `<div class="d2 motif">${escapeHtml(e.raison)}</div>` : ""}
        </div>
        <div class="gestes">
          <button class="el-haut" title="Monter d'un rang" ${i === 0 || !editableListe ? "disabled" : ""}>↑</button>
          <button class="el-bas" title="Descendre d'un rang"
            ${i === elementsListe.length - 1 || !editableListe ? "disabled" : ""}>↓</button>
          <button class="el-remplacer" title="Remplacer par un autre visuel"
            ${!reserveUtilisable || !editableListe ? "disabled" : ""}>⇄</button>
          <button class="el-retirer" title="Retirer de la liste" ${editableListe ? "" : "disabled"}>✕</button>
        </div>
        <select class="el-choix" hidden><option value="">— remplacer par —</option>${optionsReserve}</select>
      </div>`;
    }),
  ].join("");
  // « Inconnu, jamais vert » : avant le gel, la liste affichée est le BROUILLON,
  // pas ce qui partira — le gel y ajoutera les médias de l'actu. On le dit.
  const avisListe = !depart
    ? `<div class="note">Ce post n'est sur aucun créneau : c'est la liste du brouillon.</div>`
    : depart.elements
      ? `<div class="note">Liste écrite au gel : c'est exactement ce que Meta a reçu`
        + ` ou recevra, dans cet ordre.</div>`
      : depart.liste_arretee
        ? `<div class="note">Pas encore gelé — c'est cette liste, arrêtée à la main, que le`
          + ` gel figera telle quelle.</div>`
        : `<div class="note">Pas encore gelé — liste du brouillon. Le gel y ajoutera les`
          + ` médias de l'actu, sauf si vous l'arrêtez ici (toute modification l'arrête).</div>`;
  // Decision du 2026-09-17 : jamais l'image ni la video d'un compte média. La
  // reserve ne les contient donc pas -- et on le DIT, sinon « rien à ajouter »
  // passerait pour une actu sans visuel.
  const interdit = !!(article && article.visuels_interdits);
  const raisonReserveVide = interdit
    ? `visuel d'un compte média : interdit (watermark, plagiat d'un concurrent)`
    : reserve.length
      // La reserve n'est pas vide, mais rien n'y est publiable : on dit POURQUOI,
      // sinon « aucun visuel disponible » passerait pour une actu sans image.
      ? [...new Set(reserve.map(motifInutilisable))].join(" ; ")
      : `l'actu est purgée ou n'offre aucun visuel autorisé`;
  const sectionElements = `
      <div class="bloc-titre">Ce que Meta recevra
        <span class="compte-el">${elementsListe.filter((e) => !e.ecarte).length + 1} élément(s)</span></div>
      ${avisListe}
      ${depart && depart.liste_arretee && depart.elements
        ? `<div class="note">Liste arrêtée à la main : le gel ne reprend plus ni les visuels`
          + ` retenus à la composition ni les médias de l'actu.</div>`
        : ""}
      <div class="elements-liste" id="elements-liste">${lignesElements}</div>
      <div class="ajouts">
        <select id="el-ajouter" ${reserveUtilisable && editableListe ? "" : "disabled"}>
          <option value="">— ajouter un visuel —</option>${optionsReserve}
        </select>
        <div class="depot">
          <input type="file" id="el-depot" ${editableListe ? "" : "disabled"}
            accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/tiff">
        </div>
      </div>
      ${reserveUtilisable ? "" : `<div class="note">Aucun visuel à ajouter —`
        + ` ${escapeHtml(raisonReserveVide)}.</div>`}
      <div class="depot-motif" id="el-depot-motif">${editableListe
        ? `Ou déposez une image de votre disque — JPEG, PNG, WebP… 25 Mo au maximum. Elle sera`
          + ` recadrée en 1080×1350 (le haut de l'image est conservé) et ajoutée en fin de liste.`
        : escapeHtml(raisonNonEditable)}</div>`;

  // --- Le TEXTE : une zone d'edition, et UN apercu replie --------------------
  //
  // La legende etait affichee DEUX FOIS : la zone editable, puis « Ce qui va
  // partir » en entier. Decision de l'utilisateur : une zone d'edition, plus un
  // apercu REPLIABLE. Mais les COMPTEURS restent toujours visibles -- ils
  // signalent un depassement avant qu'il coute un post, et les cacher dans le
  // repli les rendrait inutiles.
  let mesuresHtml = "";
  let apercuHtml = "";
  if (depart) {
    const mesures = [];
    const trop = depart.legende_longueur > depart.legende_maximum;
    mesures.push(`<span class="${trop ? "limite" : ""}">${depart.legende_longueur} / `
      + `${depart.legende_maximum} caractères${trop ? " — sera tronquée" : ""}</span>`);
    mesures.push(`<span>${depart.hashtags_publies.length} / ${depart.hashtags_maximum} hashtags</span>`);
    mesures.push(depart.credit
      ? `<span>crédit ${escapeHtml(depart.credit)}</span>`
      : `<span class="inconnu">aucun crédit de compte</span>`);
    mesures.push(depart.elements_figes != null
      ? `<span>${depart.elements_figes} élément(s) figé(s)</span>`
      : `<span class="inconnu">éléments pas encore figés</span>`);
    // Pas de compteur de debordement ici (decision du 2026-10-30) : la mesure
    // vivante est `/covers`, rendue a l'ouverture, et son avertissement est en tete
    // de fiche (`avertissementHtml`). « Inconnu » a cote d'elle se contredisait.
    mesuresHtml = `<div class="depart-mesures">${mesures.join("")}</div>`;
    apercuHtml = `
      <details class="apercu-publie">
        <summary>Voir le texte exact que Meta recevra</summary>
        <div class="depart-apercu">${escapeHtml(depart.legende_publiee)}</div>
      </details>`;
  } else if (departsParPost === null) {
    mesuresHtml = `<div class="depart-mesures"><span class="inconnu">longueur publiée et`
      + ` crédit inconnus — l'aperçu du départ est injoignable</span></div>`;
  }

  detailEl.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <h2></h2>
        <span class="status-pill ${post.status}">${STATUS_LABELS[post.status] || post.status}</span>
        <button class="close-btn">✕ Fermer</button>
      </div>
      ${bandeauDepart}
      ${avertissementHtml}

      <section class="bloc">
        <div class="bloc-titre">Cover</div>
        <div class="covers-grid">${coversHtml}</div>
        <div class="hl-hint">Entoure un segment de <code>**deux astérisques**</code> dans une accroche pour le surligner en rose sur l'image.</div>
        <div class="sous-titre">Format</div>
        <div class="note" id="format-lu">${escapeHtml(
          depart
            ? `${FORMATS_CRENEAU[depart.format] || depart.format} — imposé par le créneau`
            : `${estReel ? FORMATS_CRENEAU.reel : FORMATS_CRENEAU.carrousel} — gabarit de ce brouillon`
        )}</div>
        <div class="sous-titre">Image de fond</div>
        ${fondSection}
        <div class="bg-field">
          <input type="text" id="bg-url" value="${escapeHtml(cover.image_url || "")}" placeholder="https://…">
          <button id="bg-valider">Valider le fond</button>
        </div>
      </section>

      <section class="bloc">
        ${sectionElements}
      </section>

      <section class="bloc">
        <div class="bloc-titre">Texte publié</div>
        <div class="field">
          <label for="edit-caption">Légende</label>
          <textarea id="edit-caption">${escapeHtml(post.caption || "")}</textarea>
        </div>
        <div class="field">
          <label for="edit-hashtags">Hashtags (séparés par des espaces)</label>
          <textarea id="edit-hashtags" rows="2">${escapeHtml((post.hashtags || []).join(" "))}</textarea>
        </div>
        ${mesuresHtml}
        ${apercuHtml}
        <div class="render-warning" id="texte-non-enregistre" hidden>
          ⚠ Légende ou hashtags modifiés et NON enregistrés — « Enregistrer » pour les garder.
        </div>
      </section>

      <div class="detail-actions">
        <button class="primary" id="btn-save">Enregistrer</button>
        <div class="etat-geste" id="etat-geste"></div>
        ${post.status === "draft" && departsParPost && !depart ? '<button class="danger" id="btn-delete">🗑 Supprimer</button>' : ""}
      </div>
    </div>`;
  peindreGeste(detailEl.querySelector("#etat-geste"), post.id);
  // Au programme, le retrait c'est ceci : « Supprimer » n'apparait qu'une fois le
  // post sorti du creneau (le serveur le refuse avant).
  const zoneDepart = detailEl.querySelector(".depart-actions");
  // Une correction epingle le creneau (`posts._proteger_la_correction`), sinon
  // l'arbitrage remplacerait le post dans les 10 minutes. Cela se dit, et se defait.
  if (zoneDepart && depart && depart.epingle && CRENEAUX_MODIFIABLES.has(depart.etat)) {
    zoneDepart.appendChild(nouvelElement("span", "note",
      "📌 Épinglé : le robot ne remplacera pas ce post."));
    const desepingler = nouvelElement("button", "desepingler", "📍 Désépingler");
    const refusEpingle = nouvelElement("span", "etat-geste erreur");
    desepingler.onclick = async () => {
      desepingler.disabled = true;
      refusEpingle.textContent = "";
      const reponse = await fetch(`/schedule/${depart.creneau_id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ epingle: false }),
      });
      if (!reponse.ok) {
        refusEpingle.textContent = "Refusé : " + await raisonDuRefus(reponse);
        desepingler.disabled = false;
        return;
      }
      annoncerGeste(post.id, "ok", "✓ Désépinglé : le robot peut de nouveau remplacer ce post.");
      await chargerDeparts();
      renderPostDetail(post, article, covers);
      if (!schedulePanelEl.hidden) loadSchedulePanel();
    };
    zoneDepart.append(desepingler, refusEpingle);
  }
  if (zoneDepart && depart && RETIRABLES.has(depart.etat)) {
    boutonNePasPublier(zoneDepart, {
      creneauId: depart.creneau_id,
      titre: depart.article_title || depart.accroche,
      postId: post.id,
      publierA: depart.publier_a,
      articleConnu: depart.article_title != null,
      apres: async (resultat) => {
        annoncerGeste(post.id, "ok", resultat);
        await chargerDeparts();
        renderPostDetail(post, article, covers);
        if (!postsPanelEl.hidden) loadPostsPanel();
        if (!schedulePanelEl.hidden) loadSchedulePanel();
      },
    });
  }
  // `article_url` etait dans la reponse de l'API et n'etait lu NULLE PART :
  // le titre s'affichait en clair, et ouvrir l'actu se faisait a la main.
  const titreFiche = detailEl.querySelector("h2");
  const libelleFiche = post.article_title || "Post";
  if (post.article_url) {
    titreFiche.textContent = "";
    titreFiche.appendChild(renvoiLien(
      libelleFiche, post.article_url, "Ouvrir l'actu d'origine", "titre-lien"));
    if (post.article_id != null) {
      const petit = document.createElement("small");
      petit.className = "ref-article";
      petit.appendChild(renvoiArticle(post.article_id, post.article_url));
      titreFiche.appendChild(petit);
    }
  } else {
    titreFiche.textContent = libelleFiche;
  }

  // Le texte en cours de frappe survit a ce re-rendu : il est repose AVANT tout
  // le reste, pour qu'aucun chemin (y compris un `return` plus bas) ne puisse
  // laisser la fiche afficher la version du serveur a la place de la saisie.
  const captionEl = detailEl.querySelector("#edit-caption");
  const hashtagsEl = detailEl.querySelector("#edit-hashtags");
  const aReinjecter = textesAReinjecter(brouillonTexte, post);
  if (aReinjecter) {
    captionEl.value = aReinjecter.caption;
    hashtagsEl.value = aReinjecter.hashtags;
  }
  const marquerNonEnregistre = () => {
    detailEl.querySelector("#texte-non-enregistre").hidden =
      textesAReinjecter(brouillonTexte, post) == null;
  };
  const capturerTextes = () => {
    brouillonTexte = { postId: post.id, caption: captionEl.value, hashtags: hashtagsEl.value };
    marquerNonEnregistre();
  };
  captionEl.oninput = capturerTextes;
  hashtagsEl.oninput = capturerTextes;
  marquerNonEnregistre();

  const fermerDetail = () => {
    if (textesAReinjecter(brouillonTexte, post)
        && !confirm("La légende n'est pas enregistrée. Fermer et perdre ces modifications ?")) return;
    brouillonTexte = null;
    dernierGeste = null;
    detailEl.hidden = true;
    detailEl.innerHTML = "";
  };
  detailEl.querySelector(".close-btn").onclick = fermerDetail;

  // --- Selection d'une variante de cover ---
  for (const choix of detailEl.querySelectorAll(".cover-choice")) {
    choix.onclick = async () => {
      const index = Number(choix.dataset.index);
      if (index === indexActif) return;
      const updated = await ecrireDepuisLaFiche(post.id, {
        libelle: `Variante ${index + 1} retenue`,
        action: () => enregistrerPost(post.id, { variante_retenue: index }),
      });
      // Les 4 covers rendues ne changent pas (meme fond, memes 4 textes) --
      // seule la marque "retenue" bouge : pas besoin de repayer un rendu.
      if (updated) {
        // La correction vient d'epingler le creneau : la fiche le dit.
        await chargerDeparts();
        renderPostDetail(updated, article, covers);
      }
    };
  }

  // --- Fond de la cover ---
  const btnFond = detailEl.querySelector("#bg-valider");
  btnFond.onclick = async () => {
    const url = detailEl.querySelector("#bg-url").value.trim() || null;
    const nouvelleCover = { ...cover, image_url: url };
    const slides = [nouvelleCover, ...(post.slides || []).slice(1)];
    const updated = await ecrireDepuisLaFiche(post.id, {
      bouton: btnFond,
      libelle: "Image de fond",
      action: () => enregistrerPost(post.id, { slides }),
    });
    if (!updated) return;
    let nouvellesCovers = null;
    try {
      nouvellesCovers = await chargerCovers(post.id);
    } catch (erreur) {
      annoncerGeste(post.id, "erreur",
        "✓ fond mis à jour, mais l'aperçu des covers a échoué — " + erreur.message);
    }
    await chargerDeparts();
    renderPostDetail(updated, article, nouvellesCovers);
  };

  // --- Éditer la liste finale ---
  //
  // Un SEUL chemin d'écriture pour les cinq gestes (retirer, monter, descendre,
  // remplacer, ajouter) : la liste entière repart avec `carrousel_explicite`, qui
  // dit au gel de ne plus reprendre ni les visuels de la composition ni les médias
  // de l'actu. Sans ce marqueur, retirer un élément n'aurait aucun effet — le gel
  // suivant le remettrait, et l'édition serait annulée en silence.
  //
  // Le RE-GEL est automatique côté serveur : `PATCH /posts/{id}` invalide les
  // fichiers figés lui-même (`app/schedule/reouverture.py`). Aucun bouton ici, et
  // aucune double publication possible — l'écriture est conditionnelle sur
  // (état GELÉ, même post), et `_publier` ne sélectionne que des créneaux GELÉS.
  const ecrireListe = async (medias, libelle, bouton) => {
    const updated = await ecrireDepuisLaFiche(post.id, {
      bouton,
      libelle: libelle || "Liste des éléments",
      action: () => enregistrerPost(post.id, {
        slides: [cover, ...medias],
        carrousel_explicite: true,
      }),
    });
    if (!updated) return;
    // La liste figée vient de changer : sans ce rechargement, la section
    // montrerait l'ancien manifeste — exactement l'écart qu'elle supprime.
    await chargerDeparts();
    renderPostDetail(updated, article, covers);
    if (!document.getElementById("schedule-panel").hidden) loadSchedulePanel();
  };
  const slidesCourantes = () => elementsListe.map((e) => slideDepuisElement(e, reserve));
  const zoneElements = detailEl.querySelector("#elements-liste");
  if (zoneElements) {
    for (const ligne of zoneElements.querySelectorAll(".element-ligne[data-rang]")) {
      const rang = Number(ligne.dataset.rang);
      ligne.querySelector(".el-retirer").onclick = (ev) => {
        const medias = slidesCourantes();
        medias.splice(rang, 1);
        ecrireListe(medias, `Élément ${rang + 2} retiré`, ev.currentTarget);
      };
      ligne.querySelector(".el-haut").onclick = (ev) => {
        const medias = slidesCourantes();
        [medias[rang - 1], medias[rang]] = [medias[rang], medias[rang - 1]];
        ecrireListe(medias, "Élément monté", ev.currentTarget);
      };
      ligne.querySelector(".el-bas").onclick = (ev) => {
        const medias = slidesCourantes();
        [medias[rang], medias[rang + 1]] = [medias[rang + 1], medias[rang]];
        ecrireListe(medias, "Élément descendu", ev.currentTarget);
      };
      // Le choix est un `select` RÉVÉLÉ et non une boîte de dialogue : la réserve
      // peut porter dix visuels, qu'un `prompt` numéroté rendrait illisibles.
      const choix = ligne.querySelector(".el-choix");
      ligne.querySelector(".el-remplacer").onclick = () => { choix.hidden = !choix.hidden; };
      choix.onchange = () => {
        if (choix.value === "") return;
        const medias = slidesCourantes();
        medias[rang] = { kind: "media", ...reserve[Number(choix.value)] };
        ecrireListe(medias, "Élément remplacé");
      };
    }
  }
  const ajouter = detailEl.querySelector("#el-ajouter");
  if (ajouter) {
    ajouter.onchange = () => {
      if (ajouter.value === "") return;
      ecrireListe(
        [...slidesCourantes(), { kind: "media", ...reserve[Number(ajouter.value)] }],
        "Visuel ajouté");
    };
  }

  // --- Déposer un visuel depuis le disque -----------------------------------
  //
  // Le fichier part en CORPS BRUT (`body: fichier`), pas en `multipart` : le
  // serveur ne reçoit donc aucun nom de fichier, et le nom sur disque se dérive
  // du contenu — une traversée de chemin est impossible par construction.
  //
  // Le dépôt rend UN CANDIDAT, et c'est `ecrireListe` — le chemin ORDINAIRE,
  // celui des cinq autres gestes — qui le met dans la liste et déclenche le
  // re-gel. Aucun second chemin d'écriture.
  const depot = detailEl.querySelector("#el-depot");
  if (depot) {
    const motifDepot = detailEl.querySelector("#el-depot-motif");
    depot.onchange = async () => {
      const fichier = depot.files && depot.files[0];
      if (!fichier) return;
      motifDepot.className = "depot-motif";
      motifDepot.textContent = `Vérification de ${fichier.name}…`;
      depot.disabled = true;
      let candidat = null;
      try {
        const reponse = await fetch(`/posts/${post.id}/visuels`, { method: "POST", body: fichier });
        const corps = await reponse.json().catch(() => null);
        if (!reponse.ok) {
          // LA raison, imprimée à côté du contrôle : c'est tout l'intérêt de
          // trancher au dépôt plutôt qu'au gel, où elle arriverait à T-2h.
          motifDepot.className = "depot-motif erreur";
          motifDepot.textContent = "Refusé : " + ((corps && corps.detail) || `HTTP ${reponse.status}`);
          depot.value = "";
          depot.disabled = false;
          return;
        }
        candidat = corps;
      } catch (erreur) {
        motifDepot.className = "depot-motif erreur";
        motifDepot.textContent = "Échec du dépôt : " + erreur.message;
        depot.disabled = false;
        return;
      }
      await ecrireListe(
        [...slidesCourantes(), { kind: "media", ...candidat }], "Visuel déposé ajouté");
    };
  }

  const btnSave = detailEl.querySelector("#btn-save");
  btnSave.onclick = async () => {
    const caption = detailEl.querySelector("#edit-caption").value;
    const hashtags = detailEl.querySelector("#edit-hashtags").value.trim().split(/\s+/).filter(Boolean);
    const updated = await ecrireDepuisLaFiche(post.id, {
      bouton: btnSave,
      libelle: "Légende et hashtags",
      action: () => enregistrerPost(post.id, { caption, hashtags }),
    });
    if (!updated) return;
    // Le serveur porte ce texte : plus rien a sauver, et l'avertissement tombe.
    brouillonTexte = null;
    // La legende PUBLIEE change avec le texte tape : sans ce rechargement,
    // l'apercu montrerait l'ancienne version -- exactement le genre d'ecart que
    // cette section existe pour supprimer.
    await chargerDeparts();
    renderPostDetail(updated, article, covers);
  };
  const btnDelete = detailEl.querySelector("#btn-delete");
  if (btnDelete) {
    btnDelete.onclick = async () => {
      if (!confirm("Supprimer ce brouillon ?")) return;
      const fait = await ecrireDepuisLaFiche(post.id, {
        bouton: btnDelete,
        libelle: "Suppression du brouillon",
        action: async () => {
          const reponse = await fetch(`/posts/${post.id}`, { method: "DELETE" });
          if (!reponse.ok) throw new Error(await raisonDuRefus(reponse));
          return true;
        },
      });
      if (!fait) return;
      brouillonTexte = null;
      dernierGeste = null;
      detailEl.hidden = true; detailEl.innerHTML = "";
      if (!postsPanelEl.hidden) loadPostsPanel();
    };
  }

  detailEl.hidden = false;
}

// --- Panneau Événements (Phase 2A, lecture seule, rien n'est éditable) ---

const PLATEFORMES_LABELS = {
  rss: "RSS", reddit_rss: "Reddit", bluesky: "Bluesky", x: "X", instagram: "Instagram",
};
// primary = compte artiste/festival/label/club (la source du fait) ; secondary
// = média (repackaging) ; unknown = catégorie non classée -- voir "Qui parle"
// dans CLAUDE.md.
const ROLES_LABELS = { primary: "source primaire", secondary: "média", unknown: "?" };

document.getElementById("event-sort").onchange = loadEventsPanel;

// Seuil de l'écart corroboration/pertinence (Tour de correction 1). Les deux
// grandeurs partagent la même échelle 0-100 (relevance_score est comparé aux
// mêmes seuils que le digest : 40/60/80, cf. CLAUDE.md). Un écart de 30 points
// où la corroboration dépasse largement la pertinence dit : la presse en
// parle beaucoup, mais l'article ne franchit même pas le seuil du digest (60)
// avec une marge confortable — exactement le cas Apple/procès/country du plan
// Phase 2A. Non calculable (pertinence inconnue, article purgé) : pas de
// signal, donc pas de classe .ecart plutôt qu'une fausse alerte.
const ECART_CORROBORATION_SEUIL = 30;

// Les features de la Phase 2C sont NULLABLES, et un null n'est pas un zéro :
// il dit « pas assez de matière pour mesurer » (une vélocité demande deux
// preuves datées, une accélération trois — 85 % des événements n'en ont
// qu'une). Le badge affiche donc « ? » plutôt que 0, sinon l'œil lirait
// « mesuré à plat » là où rien n'a été mesuré. Lecture seule : 2C expose,
// c'est 2D qui classera.
function badgeFeature(nom, valeur, decimales, aide) {
  const texte = valeur == null ? "?" : Number(valeur).toFixed(decimales);
  return `<span class="badge" title="${escapeHtml(aide)}">${nom} ${texte}</span>`;
}

async function loadEventsPanel() {
  const list = document.getElementById("events-list");
  list.innerHTML = "Chargement…";
  const sort = document.getElementById("event-sort").value;
  let events;
  try {
    const reponse = await fetch(`/events?sort=${sort}&limit=100`);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status} ${(await reponse.text()).slice(0, 200)}`);
    events = await reponse.json();
  } catch (erreur) {
    afficherErreur(list, "Échec du chargement des événements : " + erreur.message, loadEventsPanel);
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent =
    `${events.length} événement${events.length > 1 ? "s" : ""}`;
  if (!events.length) {
    list.innerHTML = '<div id="empty">Aucun événement pour le moment — la dédup en crée un dès qu\'un article en rejoint un autre.</div>';
    return;
  }
  list.innerHTML = "";
  for (const ev of events) {
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <div class="event-head">
        <div class="hl"></div>
        <div class="sub"></div>
        <div class="event-metrics"></div>
      </div>
      <div class="event-observations" hidden></div>`;
    row.querySelector(".hl").textContent = ev.titre;
    row.querySelector(".sub").textContent =
      `événement #${ev.id}${ev.event_type ? ` · ${ev.event_type}` : ""} · vu du ${fmtDate(ev.first_seen_at)} au ${fmtDate(ev.last_seen_at)}`;
    // La corroboration mesure le bavardage de la presse, pas l'intérêt pour Kinda :
    // elle est affichée À CÔTÉ de la pertinence de l'article représentant, jamais
    // à sa place, pour que l'écart (les événements les plus corroborés sont
    // parfois hors ligne éditoriale) se voie dans l'interface plutôt qu'il ne se
    // découvre plus tard.
    const pertinence = ev.relevance_representant;
    const ecart = pertinence != null && (ev.corroboration - pertinence) >= ECART_CORROBORATION_SEUIL;
    row.querySelector(".event-metrics").innerHTML = `
      <span class="badge">${ev.source_count} source${ev.source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.independent_source_count} indépendante${ev.independent_source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.platform_count} plateforme${ev.platform_count > 1 ? "s" : ""}</span>
      <span class="badge">fraîcheur ${Math.round(ev.freshness)}</span>
      <span class="badge${ecart ? " corrob ecart" : ""}" title="${ecart ? "corroboration élevée, pertinence éditoriale faible : probablement hors ligne éditoriale" : ""}">pertinence ${pertinence ?? "?"}</span>
      <span class="badge corrob${ecart ? " ecart" : ""}">corroboration ${Math.round(ev.corroboration)}</span>
      ${badgeFeature("vélocité", ev.velocity, 2, "preuves par heure, sur les dates de publication")}
      ${badgeFeature("accélération", ev.acceleration, 2, "densité de la seconde moitié contre la première : positif, l'actu monte")}
      ${badgeFeature("nouveauté", ev.nouveaute, 0, "100 = rien d'antérieur n'y ressemble ; 0 = reprise d'une actu archivée")}
      ${badgeFeature("France", ev.pertinence_france, 0, "100 = marqueur France dans le titre ; 70 = compte primaire français ; 0 = aucun marqueur trouvé")}`;
    const obsZone = row.querySelector(".event-observations");
    let charge = false;
    row.querySelector(".event-head").onclick = async () => {
      obsZone.hidden = !obsZone.hidden;
      if (obsZone.hidden || charge) return;
      charge = true;
      obsZone.textContent = "Chargement…";
      try {
        const reponse = await fetch(`/events/${ev.id}`);
        if (!reponse.ok) throw new Error(await reponse.text());
        const detail = await reponse.json();
        // Construit en DOM et non par concatenation : les renvois sont des
        // elements CLIQUABLES. Une observation liait jusqu'ici vers le web et
        // rien d'autre -- elle disait ce que la presse a publie, jamais ce que
        // Kinda en a fait.
        obsZone.innerHTML = "";
        const observations = detail.observations || [];
        if (!observations.length) {
          const vide = document.createElement("div");
          vide.className = "obs-row";
          vide.textContent = "Aucune observation.";
          obsZone.appendChild(vide);
        }
        for (const o of observations) {
          const ligne = document.createElement("div");
          ligne.className = "obs-row";
          ligne.innerHTML = `
            <span class="plateforme"></span>
            <span class="plateforme"></span>
            <a target="_blank" rel="noopener"></a>
            <span class="apres"></span>
            <span class="renvois"></span>`;
          const [plateforme, role] = ligne.querySelectorAll(".plateforme");
          plateforme.textContent = PLATEFORMES_LABELS[o.platform] || o.platform;
          role.textContent = ROLES_LABELS[o.source_role] || o.source_role;
          const lien = ligne.querySelector("a");
          lien.href = o.url;
          lien.textContent = o.title;
          ligne.querySelector(".apres").textContent =
