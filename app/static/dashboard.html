<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music News Radar</title>
<style>
  :root {
    --bg: #101014; --panel: #18181f; --border: #2a2a35;
    --text: #e8e8ee; --muted: #8a8a99; --accent: #7c5cff; --hot: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(16,16,20,.94);
           backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
           padding: 14px 20px; }
  h1 { font-size: 17px; letter-spacing: .3px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text);
          border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 12.5px; }
  .chip.on { border-color: var(--accent); background: #241f3d; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px;
         display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  main[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card.st-used { opacity: .45; }
  .card.st-reviewed { border-color: #3d5c3d; }
  .thumb { width: 100%; height: 165px; object-fit: cover; background: #0c0c10; display: block; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .scores { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .badge { border-radius: 6px; padding: 2px 7px; background: #23232d; color: var(--muted); }
  .badge.rel { background: #241f3d; color: #b9a6ff; }
  .badge.hot-high { background: #3d1f1f; color: #ff8a8a; }
  .badge.visuel { background: #1f2d3d; color: #8ac4ff; }
  .badge.sans-visuel { background: #3d2a1f; color: #ffb38a; }
  a.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 14.5px; }
  a.title:hover { color: #b9a6ff; }
  .summary { color: var(--muted); font-size: 12.5px; }
  .meta { color: #6a6a78; font-size: 11px; margin-top: auto; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 6px 0; cursor: pointer; font-size: 12px; }
  .actions button:hover { border-color: var(--accent); }
  #empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
  .chip.right { margin-left: auto; }
  #sources-panel { max-width: 820px; margin: 0 auto; padding: 20px; }
  .src-form { display: grid; grid-template-columns: 1fr 160px; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .src-form input, .src-form select { background: #0c0c10; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .src-form .full { grid-column: 1/-1; }
  .src-form .hint { grid-column: 1/-1; color: var(--muted); font-size: 11.5px; margin-top: -4px; }
  .src-form button { grid-column: 1/-1; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 9px 0; cursor: pointer; font-weight: 600; }
  .src-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .src-row { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .src-row.off { opacity: .5; }
  .src-row .nm { font-weight: 600; }
  .src-row .u { color: var(--muted); font-size: 11.5px; word-break: break-all; }
  .src-row .grow { flex: 1; min-width: 0; }
  .src-row .tag { font-size: 10.5px; background: #23232d; color: var(--muted);
    border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  /* La sante de la source, sous son URL : `last_error` etait ecrit a chaque
     ingestion et n'apparaissait nulle part. Meme rouge que .render-warning. */
  .src-row .sante { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .src-row .sante.ko { color: #ff9aa5; }
  .src-row .toggle { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px; white-space: nowrap; }

  /* --- Panneau Posts --- */
  #posts-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  #schedule-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  .mode-control { display: flex; margin-left: auto; border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden; }
  .mode-choix { border: none; background: var(--panel); color: var(--muted);
    padding: 6px 14px; cursor: pointer; font-size: 12.5px; border-left: 1px solid var(--border); }
  .mode-choix:first-child { border-left: none; }
  .mode-choix.on { background: var(--accent); color: #fff; }
  .mode-choix.mode-reel { color: #ff8a8a; }
  .mode-choix.mode-reel.on { background: var(--hot); color: #fff; }
  .mode-explication { color: var(--muted); font-size: 11.5px; margin: 8px 0 16px; }
  .slot-actions { display: flex; gap: 4px; }
  .slot-actions button { background: none; border: 1px solid #2c2c38; border-radius: 6px; cursor: pointer; padding: 2px 6px; }
  .status-pill.libre { background: #23232d; color: var(--muted); }
  .status-pill.programme { background: #241f3d; color: #b9a6ff; }
  .status-pill.gele { background: #1f2f3d; color: #8fd0ff; }
  .status-pill.publie { background: #1d3325; color: #7ee2a0; }
  .status-pill.apercu { background: #33301d; color: #e8d27a; }
  .status-pill.echec { background: #3d1f23; color: #ff9aa5; }
  .status-pill.manque { background: #2d2323; color: #c9a3a3; }
  .format-pill { font-size: 11px; border-radius: 999px; padding: 2px 8px; background: #23232d; color: var(--muted); white-space: nowrap; }
  .format-pill.reel { background: #3d1f35; color: #ff9ad5; }
  .reels-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: 12px; }
  .posts-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .post-row { display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .post-row:hover { border-color: var(--accent); }
  .post-row .grow { flex: 1; min-width: 0; }
  .post-row .hl { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .post-row .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .status-pill { font-size: 10.5px; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .status-pill.draft { background: #23232d; color: var(--muted); }
  .status-pill.approved { background: #241f3d; color: #b9a6ff; }
  .status-pill.published { background: #1f3d2a; color: #7fe0a0; }

  /* --- Détail d'un post (overlay) --- */
  #post-detail { position: fixed; inset: 0; background: rgba(8,8,10,.7); z-index: 20;
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 16px; }
  #post-detail[hidden] { display: none; }
  #post-detail .sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 960px; width: 100%; padding: 20px 22px 26px; }
  #post-detail .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #post-detail .sheet-head h2 { font-size: 15.5px; flex: 1; }
  #post-detail .close-btn { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  #post-detail textarea { width: 100%; background: #0c0c10;
    color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px;
    font-family: inherit; resize: vertical; }
  .hl-hint { color: var(--muted); font-size: 11px; margin: 10px 0 12px; }
  /* Meme palette que .badge.hot-high : le rouge est deja le langage "attention"
     du dashboard, pas une nouvelle convention. */
  .render-warning { background: #3d1f1f; color: #ff8a8a; border: 1px solid #5a2a2a;
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field textarea { min-height: 70px; }
  .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .detail-actions button, .detail-actions a { border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 12.5px;
    text-decoration: none; }
  .detail-actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .detail-actions .danger { border-color: #5a2a2a; color: #ff8a8a; }
  .detail-actions button:hover, .detail-actions a:hover { border-color: var(--accent); }
  .detail-actions button:disabled { opacity: .4; cursor: not-allowed; }

  /* --- Covers, switch, fond, medias --- */
  .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .4px; margin: 18px 0 8px; }
  .covers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cover-choice { background: #0c0c10; border: 2px solid var(--border); border-radius: 10px;
    padding: 6px; cursor: pointer; }
  .cover-choice img { width: 100%; aspect-ratio: 1080 / 1350; object-fit: cover; border-radius: 6px;
    background: #16161c; display: block; }
  .cover-choice.retenue { border-color: var(--accent); }
  .cover-choice .tag { display: block; text-align: center; font-size: 11px; color: var(--muted);
    margin-top: 4px; }
  .cover-choice.retenue .tag { color: #b9a6ff; font-weight: 600; }
  /* Meme rouge que .render-warning : "attention" est deja ce langage-la dans le
     dashboard, pas une nouvelle convention. */
  .cover-choice.en-defaut { border-color: #5a2a2a; }
  .cover-choice.en-defaut .tag { color: #ff8a8a; }
  .template-switch { display: flex; gap: 8px; align-items: center; }
  .template-switch button { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 12.5px; }
  .template-switch button.on { border-color: var(--accent); background: #241f3d; color: #b9a6ff; }
  .template-switch button:disabled { opacity: .4; cursor: not-allowed; }
  .reel-reason { color: #ff8a8a; font-size: 11.5px; }
  .bg-field { display: flex; gap: 8px; }
  .bg-field input { flex: 1; background: #0c0c10; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font-size: 12.5px; }
  .bg-field button { border: 1px solid var(--border); background: #20202a; color: var(--text);
    border-radius: 8px; padding: 0 14px; cursor: pointer; font-size: 12.5px; }
  .media-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .media-choice { background: #0c0c10; border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    display: flex; flex-direction: column; gap: 4px; }
  .media-choice img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px;
    background: #16161c; display: block; }
  .media-choice label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .media-empty { color: var(--muted); font-size: 12px; }

  /* --- Panneau Événements (Phase 2A, lecture seule) --- */
  #events-panel { max-width: 900px; margin: 0 auto; padding: 20px; }
  .event-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; }
  .event-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .event-head .grow { flex: 1; min-width: 0; }
  .event-head .hl { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .event-head .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .event-metrics { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  /* Meme rouge d'alerte que .render-warning : sert a signaler l'ecart
     corroboration/pertinence, jamais a decider quoi que ce soit. */
  .badge.corrob { background: #23232d; color: var(--muted); }
  .badge.corrob.ecart { background: #3d1f1f; color: #ff8a8a; }
  .event-observations { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; }
  .event-observations[hidden] { display: none; }
  .obs-row { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .obs-row a { color: var(--text); text-decoration: none; }
  .obs-row a:hover { color: #b9a6ff; }
  .obs-row .plateforme { font-size: 10.5px; background: #23232d; color: var(--muted);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  /* --- Bandeau de supervision (permanent, tous panneaux) ---
     Les quatre niveaux reprennent les couleurs deja en service dans le
     dashboard (.status-pill) : vert = publie, ambre = apercu, rouge = echec.
     Le gris-bleu de « inconnu » est la seule teinte nouvelle, et elle est
     volontairement DIFFERENTE du vert : une valeur qu'on n'a pas pu lire ne
     doit jamais ressembler a « tout va bien ». */
  .supervision { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px;
    background: #14141a; padding: 8px 10px; }
  .supervision.niv-panne { border-color: #5a2a2a; }
  .supervision.niv-attention { border-color: #55501f; }
  .supervision.niv-inconnu { border-color: #3a3a48; }
  .supervision.niv-ok { border-color: #2a4a33; }
  .sup-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sup-global { font-size: 12.5px; font-weight: 600; }
  .niv-ok > .sup-tete > .sup-global, .sup-global.niv-ok { color: #7ee2a0; }
  .niv-attention > .sup-tete > .sup-global { color: #e8d27a; }
  .niv-panne > .sup-tete > .sup-global { color: #ff9aa5; }
  .niv-inconnu > .sup-tete > .sup-global { color: #b9b9c8; }
  .sup-releve { color: var(--muted); font-size: 11px; }
  .sup-plier { margin-left: auto; border: 1px solid var(--border); background: #20202a;
    color: var(--text); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 11.5px; }
  .sup-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .sup-pill { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11.5px;
    border-radius: 999px; padding: 3px 10px; background: #23232d; color: var(--muted);
    border: 1px solid transparent; }
  .sup-pill b { font-weight: 600; }
  .sup-pill.niv-ok { background: #1d3325; color: #7ee2a0; }
  .sup-pill.niv-attention { background: #33301d; color: #e8d27a; }
  .sup-pill.niv-panne { background: #3d1f23; color: #ff9aa5; border-color: #5a2a2a; }
  .sup-pill.niv-inconnu { background: #2d2d38; color: #b9b9c8; }
  /* La raison est ADJACENTE et VISIBLE, jamais seulement dans un `title` :
     c'est la force deja presente dans la fiche de post, etendue ici. */
  .sup-raisons { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
  .sup-raison { font-size: 12px; line-height: 1.35; }
  .sup-raison.niv-attention { color: #e8d27a; }
  .sup-raison.niv-panne { color: #ff9aa5; }
  .sup-raison.niv-inconnu { color: #b9b9c8; }
  .sup-raison b { font-weight: 600; }
  .sup-details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 7px;
    display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 11.5px; }
  .sup-details[hidden] { display: none; }
  .sup-details .sup-bloc b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>🎧 Music News Radar <small id="count"></small></h1>
  <section id="supervision" class="supervision niv-inconnu" aria-live="polite">
    <div class="sup-tete">
      <span class="sup-global" id="sup-global">Supervision…</span>
      <span class="sup-releve" id="sup-releve"></span>
      <button class="sup-plier" id="sup-plier" aria-expanded="false">Détails</button>
    </div>
    <div class="sup-pills" id="sup-pills"></div>
    <div class="sup-raisons" id="sup-raisons"></div>
    <div class="sup-details" id="sup-details" hidden></div>
  </section>
  <div class="bar">
    <button class="chip on" data-preset="fresh">🔎 À traiter</button>
    <button class="chip" data-preset="digest">📰 Pertinents (≥60)</button>
    <button class="chip" data-preset="hot">🔥 Hot (≥80)</button>
    <button class="chip" data-preset="media">🖼 Avec média</button>
    <button class="chip" data-preset="reviewed">✓ Vus</button>
    <button class="chip" data-preset="used">📸 Postés</button>
    <button class="chip" data-preset="instagram">📷 Instagram</button>
    <button class="chip" data-preset="tout">🗂 Tout</button>
    <select id="category">
      <option value="">Toutes catégories</option>
      <option value="new_release">Release</option><option value="announcement">Annonce</option>
      <option value="event_festival">Event/Festival</option><option value="ecology">Écologie</option>
      <option value="industry">Industrie</option>
      <option value="drama">Drama</option><option value="rip">RIP</option>
      <option value="gear_tech">Gear/Tech</option><option value="culture">Culture</option>
      <option value="other">Autre</option>
    </select>
    <select id="source"><option value="">Toutes sources</option></select>
    <select id="sort">
      <option value="relevance">Tri : pertinence</option>
      <option value="date">Tri : plus récent</option>
    </select>
    <button class="chip" data-preset="schedule">🗓 Programmation</button>
    <button class="chip" data-preset="posts">🖼 Posts</button>
    <button class="chip" data-preset="events">🕸 Événements</button>
    <button class="chip right" data-preset="sources">⚙️ Sources</button>
  </div>
</header>
<main id="grid"><div id="empty">Chargement…</div></main>

<section id="sources-panel" hidden>
  <form class="src-form" id="src-form">
    <input id="s-name" class="full" placeholder="Nom (ex. Fred Again — compte fan)" required>
    <select id="s-type">
      <option value="instagram">Instagram</option>
      <option value="x">X / Twitter</option>
      <option value="rss">Flux RSS</option>
      <option value="reddit_rss">Subreddit</option>
    </select>
    <input id="s-genre" placeholder="Genre (electronic, pop…)">
    <select id="s-categorie" title="Qui produit le contenu : un artiste est prioritaire, un média sert de filet de sécurité">
      <option value="">Catégorie inconnue</option>
      <option value="artiste">Artiste</option>
      <option value="media">Média</option>
      <option value="festival">Festival</option>
      <option value="label">Label</option>
      <option value="club">Club</option>
      <option value="autre">Autre</option>
    </select>
    <input id="s-url" class="full" placeholder="URL / requête" required>
    <div class="hint" id="s-hint"></div>
    <button type="submit">Ajouter la source</button>
  </form>
  <div class="src-list" id="src-list"></div>
</section>

<section id="posts-panel" hidden>
  <div class="posts-bar">
    <select id="post-status">
      <option value="">Tous statuts</option>
      <option value="draft">Brouillon</option>
      <option value="approved">Validé</option>
      <option value="published">Publié</option>
    </select>
  </div>
  <div id="posts-list"></div>
</section>

<section id="schedule-panel" hidden>
  <div class="posts-bar">
    <button id="schedule-rebuild">🔄 Recalculer la file</button>
    <div id="mode-control" class="mode-control">
      <button class="mode-choix" data-mode="arret">Arrêt</button>
      <button class="mode-choix" data-mode="apercu">Aperçu</button>
      <button class="mode-choix mode-reel" data-mode="reel">Réel</button>
    </div>
    <label class="reels-toggle" title="Reels automatiques : coupés tant que la case n'est pas cochée">
      <input type="checkbox" id="reels-actifs"> Reels auto
    </label>
  </div>
  <div id="mode-explication" class="mode-explication"></div>
  <div id="offre-reels" class="mode-explication"></div>
  <div id="schedule-list"></div>
</section>

<section id="events-panel" hidden>
  <div class="posts-bar">
    <select id="event-sort">
      <option value="last_seen_at">Tri : dernière observation</option>
      <option value="source_count">Tri : nombre de sources</option>
    </select>
  </div>
  <div id="events-list"></div>
</section>

<div id="post-detail" hidden></div>

<script>
const PRESETS = {
  fresh:    { status: "new", min_relevance: 40 },
  digest:   { min_relevance: 60 },
  hot:      { min_hotness: 80 },
  media:    { has_media: true, min_relevance: 40 },
  reviewed: { status: "reviewed" },
  used:     { status: "used" },
  // Tous les posts Instagram, notes ou non : la vue « A traiter » masque ceux qui
  // attendent encore leur note.
  instagram: { source_type: "instagram" },
  // Toute la base (hors reprises d'une meme actu, cf. pipeline/cluster.py).
  tout: {},
};
let preset = "fresh";

const grid = document.getElementById("grid");
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("fr-FR",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";

async function load() {
  const params = new URLSearchParams({ limit: 200, sort: document.getElementById("sort").value });
  for (const [k, v] of Object.entries(PRESETS[preset])) params.set(k, v);
  const category = document.getElementById("category").value;
  const source = document.getElementById("source").value;
  if (category) params.set("category", category);
  if (source) params.set("source_id", source);

  // L'API plafonne une page a 200 : on enchaine les pages pour tout afficher.
  const articles = [];
  for (let offset = 0; ; offset += 200) {
    params.set("offset", offset);
    const page = await (await fetch(`/articles?${params}`)).json();
    articles.push(...page);
    if (page.length < 200) break;
  }
  document.getElementById("count").textContent = `${articles.length} article${articles.length > 1 ? "s" : ""}`;
  grid.innerHTML = articles.length ? "" : '<div id="empty">Rien ici — change de filtre ou attends le prochain run (toutes les 2 h).</div>';

  for (const a of articles) {
    const card = document.createElement("div");
    card.className = `card st-${a.status}`;
    // Meme regle que le selecteur de medias du detail : la vignette d'abord,
    // sinon l'URL directe pour une photo seulement -- pas pour une video, dont
    // l'URL est un .mp4 qu'une balise <img> ne peut pas afficher (onerror la
    // retire alors silencieusement, et la carte perd son image).
    const img = (a.media || []).map(m => m.preview_url || (m.type === "photo" ? m.url : null)).filter(Boolean)[0];
    const hotClass = a.hotness_score >= 80 ? "hot-high" : "";
    // D'ou viendra le visuel (presse, compte de l'actu, artistes cites) ou pourquoi
    // il n'y en a pas : un article sans visuel autorise n'entre pas dans la file.
    const visuelBadge = a.visuel
      ? `<span class="badge visuel">📸 ${escapeHtml(a.visuel)}</span>`
      : a.raison_sans_visuel
        ? `<span class="badge sans-visuel" title="${escapeHtml(a.raison_sans_visuel)}">🚫 sans visuel</span>`
        : "";
    card.innerHTML = `
      ${img ? `<img class="thumb" src="${escapeHtml(img)}" loading="lazy" onerror="this.remove()">` : ""}
      <div class="body">
        <div class="scores">
          <span class="badge rel">pertinence ${a.relevance_score ?? "—"}</span>
          <span class="badge ${hotClass}">hot ${a.hotness_score ?? "—"}</span>
          ${a.category ? `<span class="badge">${a.category}</span>` : ""}
          ${a.imprint ? `<span class="badge">${a.imprint}</span>` : ""}
          ${visuelBadge}
        </div>
        <a class="title" href="${a.url}" target="_blank" rel="noopener"></a>
        <div class="summary"></div>
        <div class="meta"></div>
        <div class="actions">
          <button data-status="reviewed">✓ Vu</button>
          <button data-status="used">📸 Posté</button>
          <button data-status="new">↩</button>
          <button class="gen-post">Générer le post</button>
        </div>
      </div>`;
    card.querySelector(".title").textContent = a.title;
    card.querySelector(".summary").textContent = a.summary || "";
    card.querySelector(".meta").textContent =
      `#${a.id} · ${sourceName(a.source_id)} · publié ${fmtDate(a.published_at) || "?"}`;
    for (const btn of card.querySelectorAll(".actions button[data-status]")) {
      btn.onclick = async () => {
        await fetch(`/articles/${a.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: btn.dataset.status }),
        });
        load();
      };
    }
    card.querySelector(".gen-post").onclick = (e) => genererPost(a.id, e.target);
    grid.appendChild(card);
  }
}

let sourceNames = {};
function sourceName(id) { return sourceNames[id] || "?"; }

const gridEl = document.getElementById("grid");
const panelEl = document.getElementById("sources-panel");
const postsPanelEl = document.getElementById("posts-panel");
const schedulePanelEl = document.getElementById("schedule-panel");
const eventsPanelEl = document.getElementById("events-panel");

document.querySelectorAll(".chip").forEach((chip) => chip.onclick = () => {
  document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
  chip.classList.add("on");
  preset = chip.dataset.preset;
  gridEl.hidden = true; panelEl.hidden = true; postsPanelEl.hidden = true; schedulePanelEl.hidden = true;
  eventsPanelEl.hidden = true;
  document.getElementById("count").textContent = "";
  if (preset === "sources") {
    panelEl.hidden = false;
    loadSourcesPanel();
  } else if (preset === "posts") {
    postsPanelEl.hidden = false;
    loadPostsPanel();
  } else if (preset === "schedule") {
    schedulePanelEl.hidden = false;
    loadSchedulePanel();
  } else if (preset === "events") {
    eventsPanelEl.hidden = false;
    loadEventsPanel();
  } else {
    gridEl.hidden = false;
    load();
  }
});
for (const id of ["category", "source", "sort"])
  document.getElementById(id).onchange = load;

// --- Panneau Sources ---

const HINTS = {
  instagram: "Convention ig:<compte>, ex. ig:tsugimag (ou l'URL instagram.com/<compte> complète). Compte professionnel (business/creator) uniquement — business_discovery ne voit pas les profils perso.",
  x: 'Compte : https://x.com/pseudo · Recherche : #tag OR #tag2 · Clips fans : ugc:("Artiste") has:videos · Radar auto : radar:',
  rss: "L'URL du flux RSS/Atom (souvent /feed ou /rss.xml).",
  reddit_rss: "L'URL du subreddit, ex. https://www.reddit.com/r/electronicmusic",
};
const typeSel = document.getElementById("s-type");
const hintEl = document.getElementById("s-hint");
const updateHint = () => { hintEl.textContent = HINTS[typeSel.value]; };
typeSel.onchange = updateHint;
updateHint();

async function loadSourcesPanel() {
  const sources = await (await fetch("/sources")).json();
  const list = document.getElementById("src-list");
  list.innerHTML = "";
  for (const s of sources.sort((a, b) => b.active - a.active || a.name.localeCompare(b.name))) {
    const row = document.createElement("div");
    row.className = "src-row" + (s.active ? "" : " off");
    row.innerHTML = `
      <div class="grow">
        <div class="nm"></div>
        <div class="u"></div>
        <div class="sante"></div>
      </div>
      <span class="tag">${s.type}</span>
      ${s.genre ? `<span class="tag">${s.genre}</span>` : ""}
      <select class="categorie" title="Catégorie du compte (pondère le scoring)">
        <option value="">Catégorie inconnue</option>
      <option value="artiste">Artiste</option>
      <option value="media">Média</option>
      <option value="festival">Festival</option>
      <option value="label">Label</option>
      <option value="club">Club</option>
      <option value="autre">Autre</option>
      </select>
      <button class="toggle">${s.active ? "⏸ Désactiver" : "▶ Activer"}</button>`;
    row.querySelector(".nm").textContent = s.name;
    row.querySelector(".u").textContent = s.url;
    // La raison en clair, adjacente : jamais un etat de sante en infobulle.
    const sante = row.querySelector(".sante");
    if (s.last_error) {
      sante.classList.add("ko");
      sante.textContent = `⚠ ${fmtDate(s.last_error_at)} — ${s.last_error}`;
    } else if (s.last_ok_at) {
      sante.textContent = `✓ lue ${fmtDate(s.last_ok_at)}`;
    } else {
      sante.textContent = "jamais lue avec succès";
    }
    const catSel = row.querySelector(".categorie");
    catSel.value = s.categorie || "";
    catSel.onchange = async () => {
      await fetch(`/sources/${s.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ categorie: catSel.value || null }),
      });
    };
    row.querySelector(".toggle").onclick = async () => {
      await fetch(`/sources/${s.id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: !s.active }),
      });
      loadSourcesPanel();
    };
    list.appendChild(row);
  }
}

document.getElementById("src-form").onsubmit = async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById("s-name").value.trim(),
    type: typeSel.value,
    url: document.getElementById("s-url").value.trim(),
    genre: document.getElementById("s-genre").value.trim() || null,
    categorie: document.getElementById("s-categorie").value || null,
  };
  const res = await fetch("/sources", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (res.ok) {
    e.target.reset(); updateHint(); loadSourcesPanel();
  } else {
    alert("Erreur : vérifie le nom, le type et l'URL.");
  }
};

// --- Génération et file éditoriale des posts ---

async function genererPost(articleId, bouton) {
  bouton.disabled = true;
  bouton.textContent = 'Génération…';
  try {
    const reponse = await fetch(`/articles/${articleId}/posts`, { method: 'POST' });
    if (!reponse.ok) throw new Error(await reponse.text());
    const post = await reponse.json();
    ouvrirPost(post.id);
  } catch (erreur) {
    alert('Échec de la génération : ' + erreur.message);
    bouton.disabled = false;
    bouton.textContent = 'Générer le post';
  }
}

const STATUS_LABELS = { draft: "Brouillon", approved: "Validé", published: "Publié" };

document.getElementById("post-status").onchange = loadPostsPanel;

// --- Panneau Programmation ---

const ETATS_CRENEAU = {
  libre: "Libre", programme: "Programmé", gele: "Gelé", publie: "Publié",
  apercu: "Aperçu, non publié", echec: "Échec", manque: "Manqué",
};
const CRENEAUX_MODIFIABLES = new Set(["libre", "programme"]);
const FORMATS_CRENEAU = { carrousel: "🖼 Carrousel", reel: "🎬 Reel" };

async function chargerOffreReels() {
  const zone = document.getElementById("offre-reels");
  try {
    const reponse = await fetch("/schedule/offre-reels");
    if (!reponse.ok) throw new Error(String(reponse.status));
    const offre = await reponse.json();
    zone.textContent = `Reels : ${offre.eligibles} article(s) éligible(s) sur ${offre.avec_video} avec vidéo, dont ${offre.directes} à lien direct — le reste via yt-dlp au gel (${offre.fraicheur_jours} derniers jours).`;
  } catch (erreur) {
    zone.textContent = "Offre de reels indisponible.";
  }
}

async function chargerReels() {
  const caseReels = document.getElementById("reels-actifs");
  try {
    const reponse = await fetch("/publication/reels");
    if (!reponse.ok) throw new Error(String(reponse.status));
    const etat = await reponse.json();
    caseReels.indeterminate = false;
    caseReels.checked = etat.actifs === true;
    caseReels.parentElement.title = etat.ytdlp
      ? "Reels automatiques ; yt-dlp récupère au gel les vidéos sans lien direct"
      : "Reels automatiques ; yt-dlp coupé (PUBLICATION_REEL_YTDLP) : vidéos à lien direct seulement";
  } catch (erreur) {
    caseReels.checked = false;
    caseReels.indeterminate = true;
  }
}

document.getElementById("reels-actifs").onchange = async (evenement) => {
  const reponse = await fetch("/publication/reels", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ actifs: evenement.target.checked }),
  });
  if (!reponse.ok) {
    const corps = await reponse.json().catch(() => ({}));
    alert("Changement refusé : " + (corps.detail || reponse.status));
  }
  loadSchedulePanel();
};

const MODE_EXPLICATIONS = {
  arret: "Arrêt : rien ne tourne.",
  apercu: "Aperçu : tout est préparé chez Meta sauf la publication, chaque aperçu consomme l'article.",
  reel: "Réel : publication publique automatique.",
};

async function chargerMode() {
  const explication = document.getElementById("mode-explication");
  try {
    const reponse = await fetch("/publication/mode");
    if (!reponse.ok) throw new Error(String(reponse.status));
    const { mode } = await reponse.json();
    for (const bouton of document.querySelectorAll(".mode-choix")) {
      bouton.classList.toggle("on", bouton.dataset.mode === mode);
    }
    explication.textContent = MODE_EXPLICATIONS[mode] || "";
  } catch (erreur) {
    explication.textContent = "Échec du chargement du mode de publication.";
  }
}

document.querySelectorAll(".mode-choix").forEach((bouton) => {
  bouton.onclick = async () => {
    const mode = bouton.dataset.mode;
    const payload = { mode };
    if (mode === "reel") {
      const saisie = prompt('Publier réellement et automatiquement sur Instagram : tape PUBLIER pour confirmer.');
      if (saisie === null) return;
      payload.confirmation = saisie;
    }
    const reponse = await fetch("/publication/mode", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!reponse.ok) {
      const corps = await reponse.json().catch(() => ({}));
      alert("Changement de mode refusé : " + (corps.detail || reponse.status));
    }
    chargerMode();
  };
});

async function loadSchedulePanel() {
  const list = document.getElementById("schedule-list");
  list.innerHTML = "Chargement…";
  chargerMode();
  chargerOffreReels();
  chargerReels();
  let creneaux;
  try {
    const reponse = await fetch("/schedule");
    if (!reponse.ok) throw new Error(await reponse.text());
    creneaux = await reponse.json();
  } catch (erreur) {
    list.innerHTML = '<div id="empty">Échec du chargement de la file.</div>';
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${creneaux.length} créneau${creneaux.length > 1 ? "x" : ""}`;
  if (!creneaux.length) {
    list.innerHTML = '<div id="empty">Aucun créneau : cliquez sur « Recalculer la file ».</div>';
    return;
  }
  list.innerHTML = "";
  for (const c of creneaux) {
    const row = document.createElement("div");
    row.className = "post-row";
    row.innerHTML = `
      <div class="grow"><div class="hl"></div><div class="sub"></div></div>
      <span class="format-pill"></span>
      <span class="status-pill"></span>
      <span class="slot-actions"></span>`;
    row.querySelector(".hl").textContent = c.article_title || "(créneau libre)";
    // Les identifiants sont affiches parce qu'ils servent : `article_id` se
    // recopie dans « remplacer », `ig_media_id` retrouve le post sur Instagram.
    const details = [fmtDate(c.publier_a), `créneau ${c.id}`];
    if (c.article_id != null) details.push(`article #${c.article_id}`);
    if (c.post_id != null) details.push(`post ${c.post_id}`);
    if (c.ig_media_id) details.push(`IG ${c.ig_media_id}`);
    if (c.relevance != null) details.push(`pertinence ${c.relevance}`);
    if (c.epingle) details.push("📌 épinglé");
    // Reclame par l'agent il y a peu : conteneur en creation ou attente de
    // l'heure affichee, pas un echec (voir RAISON_RECLAMATION, runner.py).
    const enCours = c.etat === "echec" && c.erreur === "publication interrompue avant confirmation"
      && new Date(c.publier_a).getTime() > Date.now() - 20 * 60 * 1000;
    if (c.erreur && !enCours) details.push(`⚠ ${c.erreur}`);
    row.querySelector(".sub").textContent = details.join(" · ");
    const formatPill = row.querySelector(".format-pill");
    formatPill.classList.add(c.format);
    formatPill.textContent = FORMATS_CRENEAU[c.format] || c.format;
    const pastille = row.querySelector(".status-pill");
    pastille.classList.add(enCours ? "gele" : c.etat);
    pastille.textContent = enCours ? "Publication en cours" : (ETATS_CRENEAU[c.etat] || c.etat);
    if (CRENEAUX_MODIFIABLES.has(c.etat)) {
      const actions = row.querySelector(".slot-actions");
      const bouton = (libelle, titre, donnees) => {
        const b = document.createElement("button");
        b.textContent = libelle;
        b.title = titre;
        b.onclick = () => modifierCreneau(c.id, donnees);
        actions.appendChild(b);
      };
      if (c.article_id) {
        bouton(c.epingle ? "📍" : "📌", c.epingle ? "Désépingler" : "Épingler", { epingle: !c.epingle });
      }
      bouton("✏️", "Remplacer par un autre article (identifiant)", c.format === "reel" ? "remplacer-reel" : "remplacer");
      if (c.article_id) {
        bouton("⏬", "Décaler au créneau suivant", { decaler: true });
        bouton("🚫", "Sauter cet article", { sauter: true });
      }
    }
    list.appendChild(row);
  }
}

async function modifierCreneau(id, donnees) {
  if (donnees === "remplacer" || donnees === "remplacer-reel") {
    const question = donnees === "remplacer-reel"
      ? "Identifiant de l'article (vidéo d'un compte artiste, festival, label ou club) :"
      : "Identifiant de l'article à programmer ici :";
    const saisie = prompt(question);
    if (!saisie) return;
    donnees = { article_id: Number(saisie) };
  }
  const reponse = await fetch(`/schedule/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(donnees),
  });
  if (!reponse.ok) {
    const corps = await reponse.json().catch(() => ({}));
    alert("Action refusée : " + (corps.detail || reponse.status));
  }
  loadSchedulePanel();
}

document.getElementById("schedule-rebuild").onclick = async () => {
  const reponse = await fetch("/schedule/rebuild", { method: "POST" });
  if (!reponse.ok) alert("Échec du recalcul de la file : " + reponse.status);
  loadSchedulePanel();
};

async function loadPostsPanel() {
  const list = document.getElementById("posts-list");
  list.innerHTML = "Chargement…";
  const params = new URLSearchParams({ limit: 100 });
  const status = document.getElementById("post-status").value;
  if (status) params.set("status", status);
  let posts;
  try {
    const reponse = await fetch(`/posts?${params}`);
    if (!reponse.ok) throw new Error(await reponse.text());
    posts = await reponse.json();
  } catch (erreur) {
    alert('Échec du chargement des posts : ' + erreur.message);
    list.innerHTML = '<div id="empty">Échec du chargement des posts.</div>';
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${posts.length} post${posts.length > 1 ? "s" : ""}`;
  if (!posts.length) {
    list.innerHTML = '<div id="empty">Aucun post pour ce filtre.</div>';
    return;
  }
  list.innerHTML = "";
  for (const p of posts) {
    const row = document.createElement("div");
    row.className = "post-row";
    const headline = (p.slides || [])[0]?.headline || "(sans accroche)";
    row.innerHTML = `
      <div class="grow">
        <div class="hl"></div>
        <div class="sub"></div>
      </div>
      <span class="status-pill ${p.status}">${STATUS_LABELS[p.status] || p.status}</span>`;
    row.querySelector(".hl").textContent = headline.replace(/\*\*/g, "");
    row.querySelector(".sub").textContent =
      `post ${p.id}${p.article_id != null ? ` · article #${p.article_id}` : ""} · ${p.source_name || "?"} · ${fmtDate(p.created_at)}`;
    row.onclick = () => ouvrirPost(p.id);
    list.appendChild(row);
  }
}

async function enregistrerPost(postId, donnees) {
  const reponse = await fetch(`/posts/${postId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(donnees),
  });
  if (!reponse.ok) throw new Error(await reponse.text());
  return reponse.json();
}

const detailEl = document.getElementById("post-detail");

// --- Predicat "video exploitable" reimplemente depuis app/content/media.py :
// on ne peut pas importer du Python dans le navigateur. Toute modification de
// la regle cote serveur doit etre reportee ici a la main.
const DUREE_MAX_REEL_MS = 90000;
// Limite Instagram pour une slide de carrousel (app.content.media.DUREE_MAX_SLIDE_MS) :
// une video plus longue reste affichee (pour qu'on sache qu'elle existe) mais n'est
// pas cochable comme slide.
const DUREE_MAX_SLIDE_MS = 60000;

function videosExploitables(media) {
  return (media || []).filter((m) =>
    m.type === "video" && m.url && (m.duration_ms == null || m.duration_ms <= DUREE_MAX_REEL_MS)
  );
}

function raisonPasDeReel(media) {
  if (videosExploitables(media).length) return null;
  const videos = (media || []).filter((m) => m.type === "video");
  if (!videos.length) return "aucune vidéo dans cette actu";
  if (!videos.some((m) => m.url)) return "pas d'URL directe vers la vidéo (la source ne donne qu'un lien de page)";
  const durees = videos.map((m) => m.duration_ms).filter((d) => d != null);
  if (durees.length) {
    const duree = Math.min(...durees);
    return `vidéo trop longue : ${Math.floor(duree / 1000)} s, maximum ${DUREE_MAX_REEL_MS / 1000} s pour un reel`;
  }
  return "aucune vidéo exploitable";
}

// Un post survit a la purge de son article (14 jours) : GET peut donc
// legitimement rendre 404, pas seulement en cas de panne reseau -- dans les
// deux cas on degrade a null plutot que de casser l'ouverture du detail.
async function fetchArticleById(id) {
  if (id == null) return null;
  try {
    const reponse = await fetch(`/articles/${id}`);
    if (!reponse.ok) return null;
    return await reponse.json();
  } catch {
    return null;
  }
}

async function chargerCovers(postId) {
  const reponse = await fetch(`/posts/${postId}/covers`, { method: "POST" });
  if (!reponse.ok) throw new Error(await reponse.text());
  return await reponse.json(); // { covers: [...], overflow: [...] } -- cf. CoversOut
}

async function ouvrirPost(postId) {
  let post;
  try {
    post = await (await fetch(`/posts/${postId}`)).json();
  } catch (erreur) {
    alert("Échec du chargement du post : " + erreur.message);
    return;
  }

  const article = await fetchArticleById(post.article_id);

  // Un seul Chromium pour l'apercu, pas deux : `/covers` rend les 4 variantes
  // sur le fond du post et renvoie l'`overflow` de chacune (CoversOut) -- la
  // variante retenue (ou la premiere par defaut) y est deja, donc le meme
  // texte/fond qu'un appel a `/render` aurait mesure. Repayer un second
  // lancement pour le meme signal doublait le temps d'ouverture d'un post, le
  // geste que l'utilisateur fait chaque soir. Un echec (Chromium absent en
  // local -> 503, ou toute autre panne) ne doit jamais empecher l'ouverture du
  // detail -- on degrade sans badge plutot que de bloquer l'edition.
  let covers = null;
  try {
    covers = await chargerCovers(postId);
  } catch (erreur) {
    alert("Aperçu des covers indisponible : " + erreur.message);
  }

  renderPostDetail(post, article, covers);
}

function renderPostDetail(post, article, covers) {
  const cover = (post.slides || [])[0] || {};
  const variantes = (post.variants && post.variants.variantes) || [];
  const retenue = post.variants ? post.variants.retenue : null;
  // La cover EFFECTIVEMENT servie (slides[0]) est la variante retenue, ou la
  // premiere par defaut (cf. create_post) -- c'est donc aussi l'index a lire
  // dans `covers.overflow` pour savoir si CE qui sera publie tient.
  const indexActif = retenue != null ? retenue : 0;
  const enDefaut = !!(covers && covers.overflow && covers.overflow[indexActif]);

  const avertissementHtml = enDefaut ? `
      <div class="render-warning">
        ⚠ Texte trop long même à la taille de police minimale sur la cover retenue --
        à corriger avant publication.
      </div>` : "";

  const coversHtml = variantes.length ? variantes.map((v, i) => {
    const variantEnDefaut = !!(covers && covers.overflow && covers.overflow[i]);
    return `
    <div class="cover-choice${retenue === i ? " retenue" : ""}${variantEnDefaut ? " en-defaut" : ""}" data-index="${i}">
      ${covers ? `<img src="${covers.covers[i]}" loading="lazy">` : `<div class="media-empty">aperçu indisponible</div>`}
      <span class="tag">Variante ${i + 1}${retenue === i ? " · retenue" : ""}${variantEnDefaut ? " · texte trop long" : ""}</span>
    </div>`;
  }).join("") : `<div class="media-empty">Pas de variantes pour ce post.</div>`;

  const raisonReel = raisonPasDeReel(article ? article.media : null);
  const reelDisabled = raisonReel != null;
  const reasonHtml = reelDisabled
    ? `<div class="reel-reason" id="reel-reason">${escapeHtml(
        article ? raisonReel : "actu introuvable (probablement purgée -- 14 jours de rétention)"
      )}</div>`
    : "";

  const mediaList = (article && article.media) || [];
  const slidesMedia = (post.slides || []).slice(1);
  const mediaHtml = mediaList.length ? mediaList.map((m, i) => {
    const coche = slidesMedia.some((s) => s.url === m.url);
    const dims = (m.width && m.height) ? `${m.width}×${m.height}px` : "dimensions inconnues";
    const duree = m.duration_ms != null ? ` · ${Math.round(m.duration_ms / 1000)} s` : "";
    const vignette = m.preview_url || (m.type === "photo" ? m.url : null);
    // Une video trop longue pour une slide de carrousel reste visible (pour
    // qu'on sache qu'elle existe) mais n'est pas cochable -- meme logique que
    // le switch REELS : une case grisee muette serait une enigme.
    const tropLongue = m.type === "video" && m.duration_ms != null && m.duration_ms > DUREE_MAX_SLIDE_MS;
    // Meme cas que `raisonPasDeReel` : une video sans URL directe (source qui
    // ne donne qu'un lien de page) n'a rien a telecharger. Sans ce garde-fou la
    // case restait cochable et un PATCH avec `url: null` echouait en 422 pour
    // une action que l'UI presentait comme possible.
    const sansUrl = m.type === "video" && !m.url;
    // Decision du 2026-09-17 : jamais l'image ni la video d'un compte media.
    const interdit = !!(article && article.visuels_interdits);
    const desactivee = tropLongue || sansUrl || interdit;
    const raison = interdit
      ? "visuel d'un compte média : interdit"
      : tropLongue
      ? `trop longue pour une slide (max ${DUREE_MAX_SLIDE_MS / 1000} s)`
      : sansUrl
        ? "pas d'URL directe vers la vidéo (la source ne donne qu'un lien de page)"
        : null;
    return `
    <div class="media-choice" data-index="${i}">
      ${vignette ? `<img src="${escapeHtml(vignette)}" loading="lazy" onerror="this.remove()">` : ""}
      <label>
        <input type="checkbox" class="media-check" ${coche ? "checked" : ""} ${desactivee ? "disabled" : ""}>
        ${escapeHtml(m.type)} · ${dims}${duree}
      </label>
      ${raison ? `<span class="reel-reason">${escapeHtml(raison)}</span>` : ""}
    </div>`;
  }).join("") : `<div class="media-empty">${article ? "Aucun média sur cette actu." : "Actu introuvable (probablement purgée) -- pas de médias à proposer."}</div>`;

  const actifsHtml = (post.assets || []).map((x) => {
    const vignette = x.preview_url || (x.type === "photo" ? x.url : null);
    const origine = x.origine === "artiste"
      ? `📸 ${escapeHtml(x.compte || "?")} · post du ${fmtDate(x.publie_le) || "?"}`
      : (x.compte ? `📸 ${escapeHtml(x.compte)}` : "📸 photo de presse");
    const lien = x.permalink
      ? `<a href="${escapeHtml(x.permalink)}" target="_blank" rel="noopener">voir le post</a>` : "";
    return `
    <div class="media-choice">
      ${vignette ? `<img src="${escapeHtml(vignette)}" loading="lazy" onerror="this.remove()">` : ""}
      <label>${origine}</label>
      ${lien}
    </div>`;
  }).join("");
  const actifsSection = post.assets == null ? "" : `
      <div class="section-title">Visuels retenus</div>
      <div class="media-list">${actifsHtml || '<div class="media-empty">Aucun visuel autorisé retenu : fond à poser à la main.</div>'}</div>`;

  // D'où vient le FOND de la cover. Posé à la composition (`variants.fond`),
  // jamais déduit : une fois l'URL dans la slide, plus rien ne dirait si elle
  // vient de l'actu, du compte qui l'a publiée, d'un artiste cité — ou si tout
  // était une affiche et que la cover est partie sur l'aplat Kinda.
  const ORIGINES_FOND = {
    article: "📰 photo de l'actu",
    compte: "📸 photo du compte qui a publié l'actu (l'actu n'offrait qu'une affiche)",
    artiste: "🎤 photo d'un artiste suivi cité (l'actu n'offrait qu'une affiche)",
    web: "🌐 image trouvée sur le web (dernier recours) — le crédit cite le site",
    kinda: "🎨 fond Kinda — tout était une affiche, mieux vaut l'aplat sombre",
  };
  const origineFond = ((post.variants || {}).fond || {}).origine;
  const fondSection = origineFond
    ? `<div class="reel-reason">${escapeHtml(ORIGINES_FOND[origineFond] || origineFond)}</div>`
    : "";

  detailEl.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <h2></h2>
        <span class="status-pill ${post.status}">${STATUS_LABELS[post.status] || post.status}</span>
        <button class="close-btn">✕ Fermer</button>
      </div>
      ${avertissementHtml}
      <div class="hl-hint">Entoure un segment de <code>**deux astérisques**</code> dans une accroche pour le surligner en rose sur l'image.</div>

      <div class="section-title">Cover — 4 variantes</div>
      <div class="covers-grid">${coversHtml}</div>

      <div class="section-title">Format</div>
      <div class="template-switch">
        <button id="tpl-post" class="${post.template === "kinda_post" ? "on" : ""}">POST</button>
        <button id="tpl-reel" class="${post.template === "kinda_reel" ? "on" : ""}" ${reelDisabled ? "disabled" : ""}
          title="${reelDisabled ? escapeHtml(article ? raisonReel : "médias indisponibles") : ""}">REELS</button>
      </div>
      ${reasonHtml}

      <div class="section-title">Image de fond</div>
      ${fondSection}
      <div class="bg-field">
        <input type="text" id="bg-url" value="${escapeHtml(cover.image_url || "")}" placeholder="https://…">
        <button id="bg-valider">Valider</button>
      </div>

      ${actifsSection}
      <div class="section-title">Médias de l'actu (carrousel)</div>
      <div class="media-list">${mediaHtml}</div>

      <div class="field">
        <label>Légende</label>
        <textarea id="edit-caption">${escapeHtml(post.caption || "")}</textarea>
      </div>
      <div class="field">
        <label>Hashtags (séparés par des espaces)</label>
        <textarea id="edit-hashtags" rows="2">${escapeHtml((post.hashtags || []).join(" "))}</textarea>
      </div>
      <div class="detail-actions">
        <button class="primary" id="btn-save">Enregistrer</button>
        <button id="btn-approve">Valider le statut</button>
        <button id="btn-publish">Marquer comme publié</button>
        <a href="/posts/${post.id}/export.zip">⬇ Télécharger</a>
        ${post.status === "draft" ? '<button class="danger" id="btn-delete">🗑 Supprimer</button>' : ""}
      </div>
    </div>`;
  detailEl.querySelector("h2").textContent = post.article_title || "Post";
  detailEl.querySelector(".close-btn").onclick = () => { detailEl.hidden = true; detailEl.innerHTML = ""; };

  // --- Selection d'une variante de cover ---
  for (const choix of detailEl.querySelectorAll(".cover-choice")) {
    choix.onclick = async () => {
      const index = Number(choix.dataset.index);
      try {
        const updated = await enregistrerPost(post.id, { variante_retenue: index });
        // Les 4 covers rendues ne changent pas (meme fond, memes 4 textes) --
        // seule la marque "retenue" bouge : pas besoin de repayer un rendu.
        renderPostDetail(updated, article, covers);
      } catch (erreur) {
        alert("Échec de la sélection de la variante : " + erreur.message);
      }
    };
  }

  // --- Switch POST / REELS ---
  //
  // Deux `try` DISTINCTS et non un seul : le PATCH et le rendu des covers sont
  // deux appels reseau independants, et seul le premier engage un changement
  // persiste. Un seul `try` autour des deux ferait echouer silencieusement un
  // changement de format DEJA COMMIS cote serveur des que le rendu (Chromium,
  // 503 transitoire) rate -- l'utilisateur verrait "Echec du changement de
  // format" alors que le format a change, et l'UI resterait sur l'ancien
  // etat/anciennes covers sans aucun moyen de le voir sans fermer-rouvrir.
  // Meme principe que `ouvrirPost`, qui separe deja render et covers de la
  // lecture du post pour la meme raison.
  const basculerTemplate = async (template) => {
    if (template === post.template) return;
    let updated;
    try {
      updated = await enregistrerPost(post.id, { template });
    } catch (erreur) {
      alert("Échec du changement de format : " + erreur.message);
      return;
    }
    let nouvellesCovers = null;
    try {
      nouvellesCovers = await chargerCovers(post.id);
    } catch (erreur) {
      alert("Format changé, mais l'aperçu des covers a échoué : " + erreur.message);
    }
    renderPostDetail(updated, article, nouvellesCovers);
  };
  detailEl.querySelector("#tpl-post").onclick = () => basculerTemplate("kinda_post");
  const btnReel = detailEl.querySelector("#tpl-reel");
  if (!reelDisabled) btnReel.onclick = () => basculerTemplate("kinda_reel");

  // --- Fond de la cover ---
  // Meme separation que basculerTemplate, meme motif : le PATCH du fond est
  // deja commis quand le rendu des covers echoue, l'UI ne doit pas le cacher.
  detailEl.querySelector("#bg-valider").onclick = async () => {
    const url = detailEl.querySelector("#bg-url").value.trim() || null;
    const nouvelleCover = { ...cover, image_url: url };
    const slides = [nouvelleCover, ...slidesMedia];
    let updated;
    try {
      updated = await enregistrerPost(post.id, { slides });
    } catch (erreur) {
      alert("Échec de la mise à jour du fond : " + erreur.message);
      return;
    }
    let nouvellesCovers = null;
    try {
      nouvellesCovers = await chargerCovers(post.id);
    } catch (erreur) {
      alert("Fond mis à jour, mais l'aperçu des covers a échoué : " + erreur.message);
    }
    renderPostDetail(updated, article, nouvellesCovers);
  };

  // --- Choix des medias du carrousel ---
  for (const choix of detailEl.querySelectorAll(".media-choice")) {
    choix.querySelector(".media-check").onchange = async () => {
      const coches = [...detailEl.querySelectorAll(".media-choice")]
        .filter((el) => el.querySelector(".media-check").checked)
        .map((el) => mediaList[Number(el.dataset.index)]);
      const slides = [cover, ...coches.map((m) => ({ kind: "media", ...m }))];
      try {
        const updated = await enregistrerPost(post.id, { slides });
        renderPostDetail(updated, article, covers);
      } catch (erreur) {
        alert("Échec de la mise à jour des médias : " + erreur.message);
      }
    };
  }

  detailEl.querySelector("#btn-save").onclick = async () => {
    const caption = detailEl.querySelector("#edit-caption").value;
    const hashtags = detailEl.querySelector("#edit-hashtags").value.trim().split(/\s+/).filter(Boolean);
    try {
      const updated = await enregistrerPost(post.id, { caption, hashtags });
      renderPostDetail(updated, article, covers);
    } catch (erreur) {
      alert("Échec de l'enregistrement : " + erreur.message);
    }
  };
  detailEl.querySelector("#btn-approve").onclick = async () => {
    try {
      const updated = await enregistrerPost(post.id, { status: "approved" });
      renderPostDetail(updated, article, covers);
      if (!postsPanelEl.hidden) loadPostsPanel();
    } catch (erreur) {
      alert("Échec de la validation : " + erreur.message);
    }
  };
  detailEl.querySelector("#btn-publish").onclick = async () => {
    try {
      const updated = await enregistrerPost(post.id, { status: "published" });
      renderPostDetail(updated, article, covers);
      if (!postsPanelEl.hidden) loadPostsPanel();
    } catch (erreur) {
      alert("Échec de la publication : " + erreur.message);
    }
  };
  const btnDelete = detailEl.querySelector("#btn-delete");
  if (btnDelete) {
    btnDelete.onclick = async () => {
      if (!confirm("Supprimer ce brouillon ?")) return;
      try {
        const reponse = await fetch(`/posts/${post.id}`, { method: "DELETE" });
        if (!reponse.ok) throw new Error(await reponse.text());
        detailEl.hidden = true; detailEl.innerHTML = "";
        if (!postsPanelEl.hidden) loadPostsPanel();
      } catch (erreur) {
        alert("Échec de la suppression : " + erreur.message);
      }
    };
  }

  detailEl.hidden = false;
}

// --- Panneau Événements (Phase 2A, lecture seule, rien n'est éditable) ---

const PLATEFORMES_LABELS = {
  rss: "RSS", reddit_rss: "Reddit", bluesky: "Bluesky", x: "X", instagram: "Instagram",
};
// primary = compte artiste/festival/label/club (la source du fait) ; secondary
// = média (repackaging) ; unknown = catégorie non classée -- voir "Qui parle"
// dans CLAUDE.md.
const ROLES_LABELS = { primary: "source primaire", secondary: "média", unknown: "?" };

document.getElementById("event-sort").onchange = loadEventsPanel;

// Seuil de l'écart corroboration/pertinence (Tour de correction 1). Les deux
// grandeurs partagent la même échelle 0-100 (relevance_score est comparé aux
// mêmes seuils que le digest : 40/60/80, cf. CLAUDE.md). Un écart de 30 points
// où la corroboration dépasse largement la pertinence dit : la presse en
// parle beaucoup, mais l'article ne franchit même pas le seuil du digest (60)
// avec une marge confortable — exactement le cas Apple/procès/country du plan
// Phase 2A. Non calculable (pertinence inconnue, article purgé) : pas de
// signal, donc pas de classe .ecart plutôt qu'une fausse alerte.
const ECART_CORROBORATION_SEUIL = 30;

// Les features de la Phase 2C sont NULLABLES, et un null n'est pas un zéro :
// il dit « pas assez de matière pour mesurer » (une vélocité demande deux
// preuves datées, une accélération trois — 85 % des événements n'en ont
// qu'une). Le badge affiche donc « ? » plutôt que 0, sinon l'œil lirait
// « mesuré à plat » là où rien n'a été mesuré. Lecture seule : 2C expose,
// c'est 2D qui classera.
function badgeFeature(nom, valeur, decimales, aide) {
  const texte = valeur == null ? "?" : Number(valeur).toFixed(decimales);
  return `<span class="badge" title="${escapeHtml(aide)}">${nom} ${texte}</span>`;
}

async function loadEventsPanel() {
  const list = document.getElementById("events-list");
  list.innerHTML = "Chargement…";
  const sort = document.getElementById("event-sort").value;
  let events;
  try {
    const reponse = await fetch(`/events?sort=${sort}&limit=100`);
    if (!reponse.ok) throw new Error(await reponse.text());
    events = await reponse.json();
  } catch (erreur) {
    list.innerHTML = '<div id="empty">Échec du chargement des événements.</div>';
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent =
    `${events.length} événement${events.length > 1 ? "s" : ""}`;
  if (!events.length) {
    list.innerHTML = '<div id="empty">Aucun événement pour le moment — la dédup en crée un dès qu\'un article en rejoint un autre.</div>';
    return;
  }
  list.innerHTML = "";
  for (const ev of events) {
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <div class="event-head">
        <div class="grow">
          <div class="hl"></div>
          <div class="sub"></div>
        </div>
        <div class="event-metrics"></div>
      </div>
      <div class="event-observations" hidden></div>`;
    row.querySelector(".hl").textContent = ev.titre;
    row.querySelector(".sub").textContent =
      `événement #${ev.id}${ev.event_type ? ` · ${ev.event_type}` : ""} · vu du ${fmtDate(ev.first_seen_at)} au ${fmtDate(ev.last_seen_at)}`;
    // La corroboration mesure le bavardage de la presse, pas l'intérêt pour Kinda :
    // elle est affichée À CÔTÉ de la pertinence de l'article représentant, jamais
    // à sa place, pour que l'écart (les événements les plus corroborés sont
    // parfois hors ligne éditoriale) se voie dans l'interface plutôt qu'il ne se
    // découvre plus tard.
    const pertinence = ev.relevance_representant;
    const ecart = pertinence != null && (ev.corroboration - pertinence) >= ECART_CORROBORATION_SEUIL;
    row.querySelector(".event-metrics").innerHTML = `
      <span class="badge">${ev.source_count} source${ev.source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.independent_source_count} indépendante${ev.independent_source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.platform_count} plateforme${ev.platform_count > 1 ? "s" : ""}</span>
      <span class="badge">fraîcheur ${Math.round(ev.freshness)}</span>
      <span class="badge${ecart ? " corrob ecart" : ""}" title="${ecart ? "corroboration élevée, pertinence éditoriale faible : probablement hors ligne éditoriale" : ""}">pertinence ${pertinence ?? "?"}</span>
      <span class="badge corrob${ecart ? " ecart" : ""}">corroboration ${Math.round(ev.corroboration)}</span>
      ${badgeFeature("vélocité", ev.velocity, 2, "preuves par heure, sur les dates de publication")}
      ${badgeFeature("accélération", ev.acceleration, 2, "densité de la seconde moitié contre la première : positif, l'actu monte")}
      ${badgeFeature("nouveauté", ev.nouveaute, 0, "100 = rien d'antérieur n'y ressemble ; 0 = reprise d'une actu archivée")}
      ${badgeFeature("France", ev.pertinence_france, 0, "100 = marqueur France dans le titre ; 70 = compte primaire français ; 0 = aucun marqueur trouvé")}`;
    const obsZone = row.querySelector(".event-observations");
    let charge = false;
    row.querySelector(".event-head").onclick = async () => {
      obsZone.hidden = !obsZone.hidden;
      if (obsZone.hidden || charge) return;
      charge = true;
      obsZone.textContent = "Chargement…";
      try {
        const reponse = await fetch(`/events/${ev.id}`);
        if (!reponse.ok) throw new Error(await reponse.text());
        const detail = await reponse.json();
        obsZone.innerHTML = (detail.observations || []).map((o) => `
          <div class="obs-row">
            <span class="plateforme">${escapeHtml(PLATEFORMES_LABELS[o.platform] || o.platform)}</span>
            <span class="plateforme">${escapeHtml(ROLES_LABELS[o.source_role] || o.source_role)}</span>
            <a href="${escapeHtml(o.url)}" target="_blank" rel="noopener">${escapeHtml(o.title)}</a>
            <span>· ${escapeHtml(o.source_name)} · ${fmtDate(o.published_at) || "?"}${o.article_id == null ? " · archivé" : ""}</span>
          </div>`).join("") || '<div class="obs-row">Aucune observation.</div>';
      } catch (erreur) {
        obsZone.textContent = "Échec du chargement des observations.";
        charge = false;
      }
    };
    list.appendChild(row);
  }
}

// --- Bandeau de supervision ---------------------------------------------
// « La machine tourne-t-elle, et qu'a-t-elle fait en mon nom ? » Une seule
// requete (GET /supervision), aucun appel paye, aucun appel reseau vers Meta ni
// Anthropic : tout est deja ecrit en base et dans les fichiers d'etat.
//
// REGLE QUI GOUVERNE CE CODE : une valeur qu'on n'a pas pu lire s'affiche
// INCONNUE, jamais « tout va bien ». Donc aucun defaut vert nulle part -- le
// bandeau part en `inconnu`, une requete en echec le laisse en `inconnu` avec sa
// raison, et le niveau global vient du serveur (jamais recalcule ici, ou un
// `|| "ok"` bien intentionne le casserait).
const SUP_ICONES = { ok: "✅", attention: "⚠️", panne: "⛔", inconnu: "❔" };
const SUP_GLOBAL = {
  ok: "✅ Tout tourne",
  attention: "⚠️ À regarder",
  panne: "⛔ Panne en cours",
  inconnu: "❔ État inconnu",
};
let supDetailsOuverts = false;

document.getElementById("sup-plier").onclick = () => {
  supDetailsOuverts = !supDetailsOuverts;
  const zone = document.getElementById("sup-details");
  zone.hidden = !supDetailsOuverts;
  document.getElementById("sup-plier").setAttribute("aria-expanded", String(supDetailsOuverts));
};

function supInconnu(raison) {
  return {
    niveau: "inconnu",
    releve_le: null,
    voyants: [{ cle: "supervision", libelle: "Supervision", niveau: "inconnu", valeur: "?", raison, details: [] }],
  };
}

function rendreSupervision(etat) {
  const bandeau = document.getElementById("supervision");
  const niveau = SUP_ICONES[etat.niveau] ? etat.niveau : "inconnu";
  bandeau.className = "supervision niv-" + niveau;
  document.getElementById("sup-global").textContent = SUP_GLOBAL[niveau];
  document.getElementById("sup-releve").textContent = etat.releve_le
    ? "relevé " + fmtDate(etat.releve_le)
    : "relevé : inconnu";

  const voyants = Array.isArray(etat.voyants) ? etat.voyants : [];
  const pills = document.getElementById("sup-pills");
  pills.innerHTML = "";
  for (const v of voyants) {
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const pill = document.createElement("span");
    pill.className = "sup-pill niv-" + niv;
    pill.innerHTML = `${SUP_ICONES[niv]} <b></b> <span></span>`;
    pill.querySelector("b").textContent = v.libelle;
    pill.querySelector("span").textContent = v.valeur;
    pills.appendChild(pill);
  }

  // Les raisons des voyants qui ne sont pas au vert : visibles, pas en infobulle.
  const raisons = document.getElementById("sup-raisons");
  raisons.innerHTML = "";
  for (const v of voyants) {
    if (v.niveau === "ok" || !v.raison) continue;
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const ligne = document.createElement("div");
    ligne.className = "sup-raison niv-" + niv;
    ligne.innerHTML = `${SUP_ICONES[niv]} <b></b> — <span></span>`;
    ligne.querySelector("b").textContent = v.libelle;
    ligne.querySelector("span").textContent = v.raison;
    raisons.appendChild(ligne);
  }

  const details = document.getElementById("sup-details");
  details.innerHTML = "";
  for (const v of voyants) {
    if (!Array.isArray(v.details) || !v.details.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "sup-bloc";
    bloc.innerHTML = "<b></b>";
    bloc.querySelector("b").textContent = v.libelle + " : ";
    bloc.appendChild(document.createTextNode(v.details.join(" · ")));
    details.appendChild(bloc);
  }
  details.hidden = !supDetailsOuverts;
}

async function chargerSupervision() {
  try {
    const reponse = await fetch("/supervision");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    rendreSupervision(await reponse.json());
  } catch (erreur) {
    rendreSupervision(supInconnu(
      "supervision injoignable (" + erreur.message + ") : rien ne dit que la machine tourne."));
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

(async () => {
  const sources = await (await fetch("/sources")).json();
  const sel = document.getElementById("source");
  for (const s of sources) {
    sourceNames[s.id] = s.name;
    const opt = document.createElement("option");
    opt.value = s.id; opt.textContent = (s.active ? "" : "⏸ ") + s.name;
    sel.appendChild(opt);
  }
  load();
})();

chargerSupervision();
// Le bandeau vit sa vie : il doit rester vrai meme quand l'utilisateur laisse
// l'onglet ouvert toute la journee sur un panneau.
setInterval(chargerSupervision, 60000);
</script>
