async function enregistrerPost(postId, donnees) {
  const reponse = await fetch(`/posts/${postId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(donnees),
  });
  if (!reponse.ok) throw new Error(await reponse.text());
  return reponse.json();
}

const detailEl = document.getElementById("post-detail");

// --- Le tampon de la legende ----------------------------------------------
//
// `renderPostDetail` reconstruit TOUTE la fiche depuis la reponse du serveur, et
// SIX gestes de cette meme fiche la rappellent sans rien enregistrer : choisir
// une variante de cover, basculer POST/REELS, valider un fond, cocher un media,
// approuver, marquer publie. Le geste editorial normal -- ecrire la legende,
// puis choisir la cover qui va avec -- detruisait donc le texte en silence, et
// la fermeture le jetait aussi.
//
// UN SEUL point de capture, l'evenement `input` des deux zones de texte : un
// tampon rempli a la main dans chacun des six gestes serait a refaire au
// septieme. Et un seul point de lecture, `textesAReinjecter`, qui est volontairement
// PURE (pas de DOM) pour etre verifiable.
let brouillonTexte = null; // { postId, caption, hashtags }

function textesDuServeur(post) {
  return { caption: post.caption || "", hashtags: (post.hashtags || []).join(" ") };
}

// Les textes a reinjecter apres un re-rendu, ou `null` quand il n'y a rien a
// sauver : pas de tampon, tampon d'un AUTRE post, ou tampon identique a ce que
// le serveur vient de rendre (donc deja enregistre).
function textesAReinjecter(brouillon, post) {
  if (!brouillon || brouillon.postId !== post.id) return null;
  const serveur = textesDuServeur(post);
  if (brouillon.caption === serveur.caption && brouillon.hashtags === serveur.hashtags) return null;
  return { caption: brouillon.caption, hashtags: brouillon.hashtags };
}

// --- Predicat "video exploitable" reimplemente depuis app/content/media.py :
// on ne peut pas importer du Python dans le navigateur. Toute modification de
// la regle cote serveur doit etre reportee ici a la main.
const DUREE_MAX_REEL_MS = 90000;
// Limite Instagram pour une slide de carrousel (app.content.media.DUREE_MAX_SLIDE_MS) :
// une video plus longue reste affichee (pour qu'on sache qu'elle existe) mais n'est
// pas cochable comme slide.
const DUREE_MAX_SLIDE_MS = 60000;

function videosExploitables(media) {
  return (media || []).filter((m) =>
    m.type === "video" && m.url && (m.duration_ms == null || m.duration_ms <= DUREE_MAX_REEL_MS)
  );
}

function raisonPasDeReel(media) {
  if (videosExploitables(media).length) return null;
  const videos = (media || []).filter((m) => m.type === "video");
  if (!videos.length) return "aucune vidéo dans cette actu";
  if (!videos.some((m) => m.url)) return "pas d'URL directe vers la vidéo (la source ne donne qu'un lien de page)";
  const durees = videos.map((m) => m.duration_ms).filter((d) => d != null);
  if (durees.length) {
    const duree = Math.min(...durees);
    return `vidéo trop longue : ${Math.floor(duree / 1000)} s, maximum ${DUREE_MAX_REEL_MS / 1000} s pour un reel`;
  }
  return "aucune vidéo exploitable";
}

// Un post survit a la purge de son article (`retention_days`) : GET peut donc
// legitimement rendre 404, pas seulement en cas de panne reseau -- dans les
// deux cas on degrade a null plutot que de casser l'ouverture du detail.
async function fetchArticleById(id) {
  if (id == null) return null;
  try {
    const reponse = await fetch(`/articles/${id}`);
    if (!reponse.ok) return null;
    return await reponse.json();
  } catch {
    return null;
  }
}

async function chargerCovers(postId) {
  const reponse = await fetch(`/posts/${postId}/covers`, { method: "POST" });
  if (!reponse.ok) throw new Error(await reponse.text());
  return await reponse.json(); // { covers: [...], overflow: [...] } -- cf. CoversOut
}

async function ouvrirPost(postId) {
  // Le tampon est celui d'UNE fiche : ouvrir un autre post le perime.
  if (brouillonTexte && brouillonTexte.postId !== postId) brouillonTexte = null;
  let post;
  try {
    post = await (await fetch(`/posts/${postId}`)).json();
  } catch (erreur) {
    alert("Échec du chargement du post : " + erreur.message);
    return;
  }

  const article = await fetchArticleById(post.article_id);

  // Un seul Chromium pour l'apercu, pas deux : `/covers` rend les 4 variantes
  // sur le fond du post et renvoie l'`overflow` de chacune (CoversOut) -- la
  // variante retenue (ou la premiere par defaut) y est deja, donc le meme
  // texte/fond qu'un appel a `/render` aurait mesure. Repayer un second
  // lancement pour le meme signal doublait le temps d'ouverture d'un post, le
  // geste que l'utilisateur fait chaque soir. Un echec (Chromium absent en
  // local -> 503, ou toute autre panne) ne doit jamais empecher l'ouverture du
  // detail -- on degrade sans badge plutot que de bloquer l'edition.
  let covers = null;
  try {
    covers = await chargerCovers(postId);
  } catch (erreur) {
    alert("Aperçu des covers indisponible : " + erreur.message);
  }

  renderPostDetail(post, article, covers);
}

function renderPostDetail(post, article, covers) {
  const cover = (post.slides || [])[0] || {};
  const variantes = (post.variants && post.variants.variantes) || [];
  const retenue = post.variants ? post.variants.retenue : null;
  // La cover EFFECTIVEMENT servie (slides[0]) est la variante retenue, ou la
  // premiere par defaut (cf. create_post) -- c'est donc aussi l'index a lire
  // dans `covers.overflow` pour savoir si CE qui sera publie tient.
  const indexActif = retenue != null ? retenue : 0;
  const enDefaut = !!(covers && covers.overflow && covers.overflow[indexActif]);

  const avertissementHtml = enDefaut ? `
      <div class="render-warning">
        ⚠ Texte trop long même à la taille de police minimale sur la cover retenue --
        à corriger avant publication.
      </div>` : "";

  const coversHtml = variantes.length ? variantes.map((v, i) => {
    const variantEnDefaut = !!(covers && covers.overflow && covers.overflow[i]);
    return `
    <div class="cover-choice${retenue === i ? " retenue" : ""}${variantEnDefaut ? " en-defaut" : ""}" data-index="${i}">
      ${covers ? `<img src="${covers.covers[i]}" loading="lazy">` : `<div class="media-empty">aperçu indisponible</div>`}
      <span class="tag">Variante ${i + 1}${retenue === i ? " · retenue" : ""}${variantEnDefaut ? " · texte trop long" : ""}</span>
    </div>`;
  }).join("") : `<div class="media-empty">Pas de variantes pour ce post.</div>`;

  const raisonReel = raisonPasDeReel(article ? article.media : null);
  const reelDisabled = raisonReel != null;
  const reasonHtml = reelDisabled
    ? `<div class="reel-reason" id="reel-reason">${escapeHtml(
        article ? raisonReel : "actu introuvable (" + retentionTexte() + ")"
      )}</div>`
    : "";

  const mediaList = (article && article.media) || [];
  const slidesMedia = (post.slides || []).slice(1);
  const mediaHtml = mediaList.length ? mediaList.map((m, i) => {
    const coche = slidesMedia.some((s) => s.url === m.url);
    const dims = (m.width && m.height) ? `${m.width}×${m.height}px` : "dimensions inconnues";
    const duree = m.duration_ms != null ? ` · ${Math.round(m.duration_ms / 1000)} s` : "";
    const vignette = m.preview_url || (m.type === "photo" ? m.url : null);
    // Une video trop longue pour une slide de carrousel reste visible (pour
    // qu'on sache qu'elle existe) mais n'est pas cochable -- meme logique que
    // le switch REELS : une case grisee muette serait une enigme.
    const tropLongue = m.type === "video" && m.duration_ms != null && m.duration_ms > DUREE_MAX_SLIDE_MS;
    // Meme cas que `raisonPasDeReel` : une video sans URL directe (source qui
    // ne donne qu'un lien de page) n'a rien a telecharger. Sans ce garde-fou la
    // case restait cochable et un PATCH avec `url: null` echouait en 422 pour
    // une action que l'UI presentait comme possible.
    const sansUrl = m.type === "video" && !m.url;
    // Decision du 2026-09-17 : jamais l'image ni la video d'un compte media.
    const interdit = !!(article && article.visuels_interdits);
    const desactivee = tropLongue || sansUrl || interdit;
    const raison = interdit
      ? "visuel d'un compte média : interdit"
      : tropLongue
      ? `trop longue pour une slide (max ${DUREE_MAX_SLIDE_MS / 1000} s)`
      : sansUrl
        ? "pas d'URL directe vers la vidéo (la source ne donne qu'un lien de page)"
        : null;
    return `
    <div class="media-choice" data-index="${i}">
      ${vignette ? `<img src="${escapeHtml(vignette)}" loading="lazy" onerror="this.remove()">` : ""}
      <label>
        <input type="checkbox" class="media-check" ${coche ? "checked" : ""} ${desactivee ? "disabled" : ""}>
        ${escapeHtml(m.type)} · ${dims}${duree}
      </label>
      ${raison ? `<span class="reel-reason">${escapeHtml(raison)}</span>` : ""}
    </div>`;
  }).join("") : `<div class="media-empty">${article ? "Aucun média sur cette actu." : "Actu introuvable (probablement purgée) -- pas de médias à proposer."}</div>`;

  const actifsHtml = (post.assets || []).map((x) => {
    const vignette = x.preview_url || (x.type === "photo" ? x.url : null);
    const origine = x.origine === "artiste"
      ? `📸 ${escapeHtml(x.compte || "?")} · post du ${fmtDate(x.publie_le) || "?"}`
      : (x.compte ? `📸 ${escapeHtml(x.compte)}` : "📸 photo de presse");
    const lien = x.permalink
      ? `<a href="${escapeHtml(x.permalink)}" target="_blank" rel="noopener">voir le post</a>` : "";
    return `
    <div class="media-choice">
      ${vignette ? `<img src="${escapeHtml(vignette)}" loading="lazy" onerror="this.remove()">` : ""}
      <label>${origine}</label>
      ${lien}
    </div>`;
  }).join("");
  const actifsSection = post.assets == null ? "" : `
      <div class="section-title">Visuels retenus</div>
      <div class="media-list">${actifsHtml || '<div class="media-empty">Aucun visuel autorisé retenu : fond à poser à la main.</div>'}</div>`;

  // D'où vient le FOND de la cover. Posé à la composition (`variants.fond`),
  // jamais déduit : une fois l'URL dans la slide, plus rien ne dirait si elle
  // vient de l'actu, du compte qui l'a publiée, d'un artiste cité, ou du web.
  //
  // Deux de ces libellés décrivaient un comportement RETIRÉ. `kinda` disait
  // « mieux vaut l'aplat sombre » : depuis la Tâche 5 du chantier visuels
  // (2026-09-21), une composition neuve ne pose plus jamais cet aplat, elle
  // SAUTE le créneau — un brouillon qui porte encore cette origine est donc un
  // vestige, et le dire évite de chercher à comprendre pourquoi un post part
  // sur un fond uni. Et `web` promettait un crédit du site, retiré le même
  // jour : le crédit de la légende ne porte plus que des comptes (@artiste).
  const ORIGINES_FOND = {
    article: "📰 photo de l'actu",
    compte: "📸 photo du compte qui a publié l'actu (l'actu n'offrait qu'une affiche)",
    artiste: "🎤 photo d'un artiste suivi cité (l'actu n'offrait qu'une affiche)",
    web: "🌐 image trouvée sur le web (dernier recours) — le site n'est pas crédité",
    kinda: "🎨 aplat Kinda — brouillon composé avant le 2026-09-21 : aucune photo"
      + " n'avait été trouvée. Une composition d'aujourd'hui sauterait le créneau"
      + " au lieu de publier cet aplat.",
  };
  const origineFond = ((post.variants || {}).fond || {}).origine;
  const fondSection = origineFond
    ? `<div class="reel-reason">${escapeHtml(ORIGINES_FOND[origineFond] || origineFond)}</div>`
    : "";

  detailEl.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <h2></h2>
        <span class="status-pill ${post.status}">${STATUS_LABELS[post.status] || post.status}</span>
        <button class="close-btn">✕ Fermer</button>
      </div>
      ${avertissementHtml}
      <div class="hl-hint">Entoure un segment de <code>**deux astérisques**</code> dans une accroche pour le surligner en rose sur l'image.</div>

      <div class="section-title">Cover — 4 variantes</div>
      <div class="covers-grid">${coversHtml}</div>

      <div class="section-title">Format</div>
      <div class="template-switch">
        <button id="tpl-post" class="${post.template === "kinda_post" ? "on" : ""}">POST</button>
        <button id="tpl-reel" class="${post.template === "kinda_reel" ? "on" : ""}" ${reelDisabled ? "disabled" : ""}
          title="${reelDisabled ? escapeHtml(article ? raisonReel : "médias indisponibles") : ""}">REELS</button>
      </div>
      ${reasonHtml}

      <div class="section-title">Image de fond</div>
      ${fondSection}
      <div class="bg-field">
        <input type="text" id="bg-url" value="${escapeHtml(cover.image_url || "")}" placeholder="https://…">
        <button id="bg-valider">Valider</button>
      </div>

      ${actifsSection}
      <div class="section-title">Médias de l'actu (carrousel)</div>
      <div class="media-list" id="medias-actu">${mediaHtml}</div>

      <div class="field">
        <label>Légende</label>
        <textarea id="edit-caption">${escapeHtml(post.caption || "")}</textarea>
      </div>
      <div class="field">
        <label>Hashtags (séparés par des espaces)</label>
        <textarea id="edit-hashtags" rows="2">${escapeHtml((post.hashtags || []).join(" "))}</textarea>
      </div>
      <div class="render-warning" id="texte-non-enregistre" hidden>
        ⚠ Légende ou hashtags modifiés et NON enregistrés — « Enregistrer » pour les garder.
      </div>
      <div class="detail-actions">
        <button class="primary" id="btn-save">Enregistrer</button>
        <button id="btn-approve">Valider le statut</button>
        <button id="btn-publish">Marquer comme publié</button>
        <a href="/posts/${post.id}/export.zip">⬇ Télécharger</a>
        ${post.status === "draft" ? '<button class="danger" id="btn-delete">🗑 Supprimer</button>' : ""}
      </div>
    </div>`;
  // `article_url` etait dans la reponse de l'API et n'etait lu NULLE PART :
  // le titre s'affichait en clair, et ouvrir l'actu se faisait a la main.
  const titreFiche = detailEl.querySelector("h2");
  const libelleFiche = post.article_title || "Post";
  if (post.article_url) {
    titreFiche.textContent = "";
    titreFiche.appendChild(renvoiLien(
      libelleFiche, post.article_url, "Ouvrir l'actu d'origine", "titre-lien"));
    if (post.article_id != null) {
      const petit = document.createElement("small");
      petit.className = "ref-article";
      petit.appendChild(renvoiArticle(post.article_id, post.article_url));
      titreFiche.appendChild(petit);
    }
  } else {
    titreFiche.textContent = libelleFiche;
  }

  // Le texte en cours de frappe survit a ce re-rendu : il est repose AVANT tout
  // le reste, pour qu'aucun chemin (y compris un `return` plus bas) ne puisse
  // laisser la fiche afficher la version du serveur a la place de la saisie.
  const captionEl = detailEl.querySelector("#edit-caption");
  const hashtagsEl = detailEl.querySelector("#edit-hashtags");
  const aReinjecter = textesAReinjecter(brouillonTexte, post);
  if (aReinjecter) {
    captionEl.value = aReinjecter.caption;
    hashtagsEl.value = aReinjecter.hashtags;
  }
  const marquerNonEnregistre = () => {
    detailEl.querySelector("#texte-non-enregistre").hidden =
      textesAReinjecter(brouillonTexte, post) == null;
  };
  const capturerTextes = () => {
    brouillonTexte = { postId: post.id, caption: captionEl.value, hashtags: hashtagsEl.value };
    marquerNonEnregistre();
  };
  captionEl.oninput = capturerTextes;
  hashtagsEl.oninput = capturerTextes;
  marquerNonEnregistre();

  const fermerDetail = () => {
    if (textesAReinjecter(brouillonTexte, post)
        && !confirm("La légende n'est pas enregistrée. Fermer et perdre ces modifications ?")) return;
    brouillonTexte = null;
    detailEl.hidden = true;
    detailEl.innerHTML = "";
  };
  detailEl.querySelector(".close-btn").onclick = fermerDetail;

  // --- Selection d'une variante de cover ---
  for (const choix of detailEl.querySelectorAll(".cover-choice")) {
    choix.onclick = async () => {
      const index = Number(choix.dataset.index);
      try {
        const updated = await enregistrerPost(post.id, { variante_retenue: index });
        // Les 4 covers rendues ne changent pas (meme fond, memes 4 textes) --
        // seule la marque "retenue" bouge : pas besoin de repayer un rendu.
        renderPostDetail(updated, article, covers);
      } catch (erreur) {
        alert("Échec de la sélection de la variante : " + erreur.message);
      }
    };
  }

  // --- Switch POST / REELS ---
  //
  // Deux `try` DISTINCTS et non un seul : le PATCH et le rendu des covers sont
  // deux appels reseau independants, et seul le premier engage un changement
  // persiste. Un seul `try` autour des deux ferait echouer silencieusement un
  // changement de format DEJA COMMIS cote serveur des que le rendu (Chromium,
  // 503 transitoire) rate -- l'utilisateur verrait "Echec du changement de
  // format" alors que le format a change, et l'UI resterait sur l'ancien
  // etat/anciennes covers sans aucun moyen de le voir sans fermer-rouvrir.
  // Meme principe que `ouvrirPost`, qui separe deja render et covers de la
  // lecture du post pour la meme raison.
  const basculerTemplate = async (template) => {
    if (template === post.template) return;
    let updated;
    try {
      updated = await enregistrerPost(post.id, { template });
    } catch (erreur) {
      alert("Échec du changement de format : " + erreur.message);
      return;
    }
    let nouvellesCovers = null;
    try {
      nouvellesCovers = await chargerCovers(post.id);
    } catch (erreur) {
      alert("Format changé, mais l'aperçu des covers a échoué : " + erreur.message);
    }
    renderPostDetail(updated, article, nouvellesCovers);
  };
  detailEl.querySelector("#tpl-post").onclick = () => basculerTemplate("kinda_post");
  const btnReel = detailEl.querySelector("#tpl-reel");
  if (!reelDisabled) btnReel.onclick = () => basculerTemplate("kinda_reel");

  // --- Fond de la cover ---
  // Meme separation que basculerTemplate, meme motif : le PATCH du fond est
  // deja commis quand le rendu des covers echoue, l'UI ne doit pas le cacher.
  detailEl.querySelector("#bg-valider").onclick = async () => {
    const url = detailEl.querySelector("#bg-url").value.trim() || null;
    const nouvelleCover = { ...cover, image_url: url };
    const slides = [nouvelleCover, ...slidesMedia];
    let updated;
    try {
      updated = await enregistrerPost(post.id, { slides });
    } catch (erreur) {
      alert("Échec de la mise à jour du fond : " + erreur.message);
      return;
    }
    let nouvellesCovers = null;
    try {
      nouvellesCovers = await chargerCovers(post.id);
    } catch (erreur) {
      alert("Fond mis à jour, mais l'aperçu des covers a échoué : " + erreur.message);
    }
    renderPostDetail(updated, article, nouvellesCovers);
  };

  // --- Choix des medias du carrousel ---
  //
  // La recherche est BORNEE aux medias de l'actu (`#medias-actu`) : la section
  // « Visuels retenus » produit elle aussi des `.media-choice`, mais SANS case a
  // cocher et sans `data-index`. Un `querySelectorAll(".media-choice")` sur
  // toute la fiche les ramassait donc aussi, et `choix.querySelector(
  // ".media-check").onchange` levait un TypeError sur le premier d'entre eux --
  // au milieu de `renderPostDetail`, donc AVANT `detailEl.hidden = false` et
  // avant le branchement de « Enregistrer » : tout post portant des `assets`
  // (c'est-a-dire tous ceux composes depuis la migration 0018) ne s'ouvrait
  // PAS, et le clic sur la ligne ne faisait rien du tout. Meme sans le plantage,
  // la liste des coches lisait `mediaList[NaN]` pour ces divs sans index.
  const listeMedias = detailEl.querySelector("#medias-actu");
  for (const choix of listeMedias.querySelectorAll(".media-choice")) {
    choix.querySelector(".media-check").onchange = async () => {
      const coches = [...listeMedias.querySelectorAll(".media-choice")]
        .filter((el) => el.querySelector(".media-check").checked)
        .map((el) => mediaList[Number(el.dataset.index)]);
      const slides = [cover, ...coches.map((m) => ({ kind: "media", ...m }))];
      try {
        const updated = await enregistrerPost(post.id, { slides });
        renderPostDetail(updated, article, covers);
      } catch (erreur) {
        alert("Échec de la mise à jour des médias : " + erreur.message);
      }
    };
  }

  detailEl.querySelector("#btn-save").onclick = async () => {
    const caption = detailEl.querySelector("#edit-caption").value;
    const hashtags = detailEl.querySelector("#edit-hashtags").value.trim().split(/\s+/).filter(Boolean);
    try {
      const updated = await enregistrerPost(post.id, { caption, hashtags });
      // Le serveur porte ce texte : plus rien a sauver, et l'avertissement tombe.
      brouillonTexte = null;
      renderPostDetail(updated, article, covers);
    } catch (erreur) {
      alert("Échec de l'enregistrement : " + erreur.message);
    }
  };
  detailEl.querySelector("#btn-approve").onclick = async () => {
    try {
      const updated = await enregistrerPost(post.id, { status: "approved" });
      renderPostDetail(updated, article, covers);
      if (!postsPanelEl.hidden) loadPostsPanel();
    } catch (erreur) {
      alert("Échec de la validation : " + erreur.message);
    }
  };
  detailEl.querySelector("#btn-publish").onclick = async () => {
    try {
      const updated = await enregistrerPost(post.id, { status: "published" });
      renderPostDetail(updated, article, covers);
      if (!postsPanelEl.hidden) loadPostsPanel();
    } catch (erreur) {
      alert("Échec de la publication : " + erreur.message);
    }
  };
  const btnDelete = detailEl.querySelector("#btn-delete");
  if (btnDelete) {
    btnDelete.onclick = async () => {
      if (!confirm("Supprimer ce brouillon ?")) return;
      try {
        const reponse = await fetch(`/posts/${post.id}`, { method: "DELETE" });
        if (!reponse.ok) throw new Error(await reponse.text());
        brouillonTexte = null;
        detailEl.hidden = true; detailEl.innerHTML = "";
        if (!postsPanelEl.hidden) loadPostsPanel();
      } catch (erreur) {
        alert("Échec de la suppression : " + erreur.message);
      }
    };
  }

  detailEl.hidden = false;
}

// --- Panneau Événements (Phase 2A, lecture seule, rien n'est éditable) ---

const PLATEFORMES_LABELS = {
  rss: "RSS", reddit_rss: "Reddit", bluesky: "Bluesky", x: "X", instagram: "Instagram",
};
// primary = compte artiste/festival/label/club (la source du fait) ; secondary
// = média (repackaging) ; unknown = catégorie non classée -- voir "Qui parle"
// dans CLAUDE.md.
const ROLES_LABELS = { primary: "source primaire", secondary: "média", unknown: "?" };

document.getElementById("event-sort").onchange = loadEventsPanel;

// Seuil de l'écart corroboration/pertinence (Tour de correction 1). Les deux
// grandeurs partagent la même échelle 0-100 (relevance_score est comparé aux
// mêmes seuils que le digest : 40/60/80, cf. CLAUDE.md). Un écart de 30 points
// où la corroboration dépasse largement la pertinence dit : la presse en
// parle beaucoup, mais l'article ne franchit même pas le seuil du digest (60)
// avec une marge confortable — exactement le cas Apple/procès/country du plan
// Phase 2A. Non calculable (pertinence inconnue, article purgé) : pas de
// signal, donc pas de classe .ecart plutôt qu'une fausse alerte.
const ECART_CORROBORATION_SEUIL = 30;

// Les features de la Phase 2C sont NULLABLES, et un null n'est pas un zéro :
// il dit « pas assez de matière pour mesurer » (une vélocité demande deux
// preuves datées, une accélération trois — 85 % des événements n'en ont
// qu'une). Le badge affiche donc « ? » plutôt que 0, sinon l'œil lirait
// « mesuré à plat » là où rien n'a été mesuré. Lecture seule : 2C expose,
// c'est 2D qui classera.
function badgeFeature(nom, valeur, decimales, aide) {
  const texte = valeur == null ? "?" : Number(valeur).toFixed(decimales);
  return `<span class="badge" title="${escapeHtml(aide)}">${nom} ${texte}</span>`;
}

async function loadEventsPanel() {
  const list = document.getElementById("events-list");
  list.innerHTML = "Chargement…";
  const sort = document.getElementById("event-sort").value;
  let events;
  try {
    const reponse = await fetch(`/events?sort=${sort}&limit=100`);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status} ${(await reponse.text()).slice(0, 200)}`);
    events = await reponse.json();
  } catch (erreur) {
    afficherErreur(list, "Échec du chargement des événements : " + erreur.message, loadEventsPanel);
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent =
    `${events.length} événement${events.length > 1 ? "s" : ""}`;
  if (!events.length) {
    list.innerHTML = '<div id="empty">Aucun événement pour le moment — la dédup en crée un dès qu\'un article en rejoint un autre.</div>';
    return;
  }
  list.innerHTML = "";
  for (const ev of events) {
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <div class="event-head">
        <div class="hl"></div>
        <div class="sub"></div>
        <div class="event-metrics"></div>
      </div>
      <div class="event-observations" hidden></div>`;
    row.querySelector(".hl").textContent = ev.titre;
    row.querySelector(".sub").textContent =
      `événement #${ev.id}${ev.event_type ? ` · ${ev.event_type}` : ""} · vu du ${fmtDate(ev.first_seen_at)} au ${fmtDate(ev.last_seen_at)}`;
    // La corroboration mesure le bavardage de la presse, pas l'intérêt pour Kinda :
    // elle est affichée À CÔTÉ de la pertinence de l'article représentant, jamais
    // à sa place, pour que l'écart (les événements les plus corroborés sont
    // parfois hors ligne éditoriale) se voie dans l'interface plutôt qu'il ne se
    // découvre plus tard.
    const pertinence = ev.relevance_representant;
    const ecart = pertinence != null && (ev.corroboration - pertinence) >= ECART_CORROBORATION_SEUIL;
    row.querySelector(".event-metrics").innerHTML = `
      <span class="badge">${ev.source_count} source${ev.source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.independent_source_count} indépendante${ev.independent_source_count > 1 ? "s" : ""}</span>
      <span class="badge">${ev.platform_count} plateforme${ev.platform_count > 1 ? "s" : ""}</span>
      <span class="badge">fraîcheur ${Math.round(ev.freshness)}</span>
      <span class="badge${ecart ? " corrob ecart" : ""}" title="${ecart ? "corroboration élevée, pertinence éditoriale faible : probablement hors ligne éditoriale" : ""}">pertinence ${pertinence ?? "?"}</span>
      <span class="badge corrob${ecart ? " ecart" : ""}">corroboration ${Math.round(ev.corroboration)}</span>
      ${badgeFeature("vélocité", ev.velocity, 2, "preuves par heure, sur les dates de publication")}
      ${badgeFeature("accélération", ev.acceleration, 2, "densité de la seconde moitié contre la première : positif, l'actu monte")}
      ${badgeFeature("nouveauté", ev.nouveaute, 0, "100 = rien d'antérieur n'y ressemble ; 0 = reprise d'une actu archivée")}
      ${badgeFeature("France", ev.pertinence_france, 0, "100 = marqueur France dans le titre ; 70 = compte primaire français ; 0 = aucun marqueur trouvé")}`;
    const obsZone = row.querySelector(".event-observations");
    let charge = false;
    row.querySelector(".event-head").onclick = async () => {
      obsZone.hidden = !obsZone.hidden;
      if (obsZone.hidden || charge) return;
      charge = true;
      obsZone.textContent = "Chargement…";
      try {
        const reponse = await fetch(`/events/${ev.id}`);
        if (!reponse.ok) throw new Error(await reponse.text());
        const detail = await reponse.json();
        // Construit en DOM et non par concatenation : les renvois sont des
        // elements CLIQUABLES. Une observation liait jusqu'ici vers le web et
        // rien d'autre -- elle disait ce que la presse a publie, jamais ce que
        // Kinda en a fait.
        obsZone.innerHTML = "";
        const observations = detail.observations || [];
        if (!observations.length) {
          const vide = document.createElement("div");
          vide.className = "obs-row";
          vide.textContent = "Aucune observation.";
          obsZone.appendChild(vide);
        }
        for (const o of observations) {
          const ligne = document.createElement("div");
          ligne.className = "obs-row";
          ligne.innerHTML = `
            <span class="plateforme"></span>
            <span class="plateforme"></span>
            <a target="_blank" rel="noopener"></a>
            <span class="apres"></span>
            <span class="renvois"></span>`;
          const [plateforme, role] = ligne.querySelectorAll(".plateforme");
          plateforme.textContent = PLATEFORMES_LABELS[o.platform] || o.platform;
          role.textContent = ROLES_LABELS[o.source_role] || o.source_role;
          const lien = ligne.querySelector("a");
          lien.href = o.url;
          lien.textContent = o.title;
          ligne.querySelector(".apres").textContent =
            `· ${o.source_name} · ${fmtDate(o.published_at) || "?"}`;
          // `article_id` a NULL veut dire purge : l'observation survit a son
          // article (ON DELETE SET NULL), le renvoi ne peut donc pas exister.
          poserParties(ligne.querySelector(".renvois"), [
            o.article_id != null ? renvoiArticle(o.article_id, o.url) : "archivé",
            o.post_id != null ? renvoiPost(o.post_id) : null,
          ]);
          obsZone.appendChild(ligne);
        }
      } catch (erreur) {
        obsZone.textContent = "Échec du chargement des observations.";
        charge = false;
      }
    };
    list.appendChild(row);
  }
}

// --- Bandeau de supervision ---------------------------------------------
// « La machine tourne-t-elle, et qu'a-t-elle fait en mon nom ? » Une seule
// requete (GET /supervision), aucun appel paye, aucun appel reseau vers Meta ni
// Anthropic : tout est deja ecrit en base et dans les fichiers d'etat.
//
// REGLE QUI GOUVERNE CE CODE : une valeur qu'on n'a pas pu lire s'affiche
// INCONNUE, jamais « tout va bien ». Donc aucun defaut vert nulle part -- le
// bandeau part en `inconnu`, une requete en echec le laisse en `inconnu` avec sa
// raison, et le niveau global vient du serveur (jamais recalcule ici, ou un
// `|| "ok"` bien intentionne le casserait).
const SUP_ICONES = { ok: "✅", attention: "⚠️", panne: "⛔", inconnu: "❔" };
const SUP_GLOBAL = {
  ok: "✅ Tout tourne",
  attention: "⚠️ À regarder",
  panne: "⛔ Panne en cours",
  inconnu: "❔ État inconnu",
};
let supDetailsOuverts = false;
// Au-dela de deux raisons NON BLOQUANTES, le surplus se replie : l'entete est
// `sticky` et sa hauteur se paie en zone utile. Les pannes, elles, ne se
// replient jamais.
const SUP_RAISONS_DEPLIEES = 2;
let supRaisonsOuvertes = false;

document.getElementById("sup-plier").onclick = () => {
  supDetailsOuverts = !supDetailsOuverts;
  const zone = document.getElementById("sup-details");
  zone.hidden = !supDetailsOuverts;
  document.getElementById("sup-plier").setAttribute("aria-expanded", String(supDetailsOuverts));
};

function supInconnu(raison) {
  return {
    niveau: "inconnu",
    releve_le: null,
    voyants: [{ cle: "supervision", libelle: "Supervision", niveau: "inconnu", valeur: "?", raison, details: [] }],
  };
}

function rendreSupervision(etat) {
  const bandeau = document.getElementById("supervision");
  const niveau = SUP_ICONES[etat.niveau] ? etat.niveau : "inconnu";
  bandeau.className = "supervision niv-" + niveau;
  document.getElementById("sup-global").textContent = SUP_GLOBAL[niveau];
  document.getElementById("sup-releve").textContent = etat.releve_le
    ? "relevé " + fmtDate(etat.releve_le)
    : "relevé : inconnu";

  const voyants = Array.isArray(etat.voyants) ? etat.voyants : [];
  const pills = document.getElementById("sup-pills");
  pills.innerHTML = "";
  for (const v of voyants) {
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const pill = document.createElement("span");
    pill.className = "sup-pill niv-" + niv;
    pill.innerHTML = `${SUP_ICONES[niv]} <b></b> <span></span>`;
    pill.querySelector("b").textContent = v.libelle;
    pill.querySelector("span").textContent = v.valeur;
    pills.appendChild(pill);
  }

  // Les raisons des voyants qui ne sont pas au vert : visibles, pas en infobulle.
  //
  // REPLI, parce que l'entete est `sticky` : cinq raisons lui faisaient ~230 px
  // et mangeaient autant de zone utile. Mais gagner de la place ne doit jamais
  // faire disparaitre une panne -- une PANNE est toujours rendue, le repli ne
  // touche que les raisons `attention`/`inconnu`, et le bouton dit combien il
  // en cache, ce qui n'est donc pas un masquage mais un pli.
  const raisons = document.getElementById("sup-raisons");
  raisons.innerHTML = "";
  const ligneRaison = (v) => {
    const niv = SUP_ICONES[v.niveau] ? v.niveau : "inconnu";
    const ligne = document.createElement("div");
    ligne.className = "sup-raison niv-" + niv;
    ligne.innerHTML = `${SUP_ICONES[niv]} <b></b> — <span></span>`;
    ligne.querySelector("b").textContent = v.libelle;
    ligne.querySelector("span").textContent = v.raison;
    return ligne;
  };
  const aRaison = voyants.filter((v) => v.niveau !== "ok" && v.raison);
  const pannes = aRaison.filter((v) => v.niveau === "panne");
  const secondaires = aRaison.filter((v) => v.niveau !== "panne");
  for (const v of pannes) raisons.appendChild(ligneRaison(v));
  const replie = secondaires.length > SUP_RAISONS_DEPLIEES && !supRaisonsOuvertes;
  const montrees = replie ? secondaires.slice(0, SUP_RAISONS_DEPLIEES) : secondaires;
  for (const v of montrees) raisons.appendChild(ligneRaison(v));
  if (secondaires.length > SUP_RAISONS_DEPLIEES) {
    const caches = secondaires.length - montrees.length;
    const plus = document.createElement("button");
    plus.className = "sup-raison-plus";
    plus.setAttribute("aria-expanded", String(!replie));
    plus.textContent = replie
      ? `+ ${caches} autre${caches > 1 ? "s" : ""} point${caches > 1 ? "s" : ""} à regarder`
      : "Replier les points à regarder";
    plus.onclick = () => {
      supRaisonsOuvertes = !supRaisonsOuvertes;
      rendreSupervision(etat);
    };
    raisons.appendChild(plus);
  }

  const details = document.getElementById("sup-details");
  details.innerHTML = "";
  for (const v of voyants) {
    if (!Array.isArray(v.details) || !v.details.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "sup-bloc";
    bloc.innerHTML = "<b></b>";
    bloc.querySelector("b").textContent = v.libelle + " : ";
    bloc.appendChild(document.createTextNode(v.details.join(" · ")));
    details.appendChild(bloc);
  }
  details.hidden = !supDetailsOuverts;
  mesurerEntete();
}

// `scroll-padding-top` ne peut pas etre fige en CSS : le bandeau grandit avec le
// nombre de raisons affichees, et une ancre atterrirait sous l'entete `sticky`.
// On publie donc la hauteur REELLE dans `--entete-h`.
function mesurerEntete() {
  const entete = document.querySelector("header");
  if (!entete) return;
  document.documentElement.style.setProperty("--entete-h", entete.offsetHeight + "px");
}

async function chargerSupervision() {
  try {
    const reponse = await fetch("/supervision");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    rendreSupervision(await reponse.json());
  } catch (erreur) {
    rendreSupervision(supInconnu(
      "supervision injoignable (" + erreur.message + ") : rien ne dit que la machine tourne."));
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

(async () => {
  // La grille ne depend PAS de ce filtre, et son chargement ne doit donc jamais
  // dependre de lui : `load()` etait la derniere instruction d'un bloc sans
  // rattrapage, si bien qu'un `/sources` en echec laissait l'ecran d'accueil sur
  // « Chargement… » pour toujours -- sans un mot, et sans que la grille,
  // parfaitement joignable, soit meme tentee.
  // Les reglages d'abord : ils n'alimentent que des TEXTES, et leur echec est
  // deja traite (la phrase perd son chiffre). `await` ici plutot qu'en
  // parallele, pour que le premier rendu de la grille porte deja la bonne
  // cadence au lieu d'une phrase amputee reparee au rafraichissement suivant.
  await chargerReglages();
  const sel = document.getElementById("source");
  try {
    const reponse = await fetch("/sources");
    if (!reponse.ok) throw new Error("HTTP " + reponse.status);
    for (const s of await reponse.json()) {
      sourceNames[s.id] = s.name;
      const opt = document.createElement("option");
      opt.value = s.id; opt.textContent = (s.active ? "" : "⏸ ") + s.name;
      sel.appendChild(opt);
    }
  } catch (erreur) {
    // Inconnu, jamais « tout va bien » : le filtre dit qu'il n'a pas pu etre lu.
    sel.querySelector("option").textContent = "⚠ sources illisibles (" + erreur.message + ")";
  }
  load();
})();

mesurerEntete();
addEventListener("resize", mesurerEntete);

chargerSupervision();
// Le bandeau vit sa vie : il doit rester vrai meme quand l'utilisateur laisse
// l'onglet ouvert toute la journee sur un panneau.
setInterval(chargerSupervision, 60000);
</script>
</body>
</html>
