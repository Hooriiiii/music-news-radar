name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Parité modèles <-> migrations, sur une base VIDE et jetable.
  #
  # Motif concret (2026-08-09) : la migration 0009 n'avait jamais été appliquée à
  # Neon alors que `app/models.py` déclarait déjà `posts.render_report`. Résultat,
  # toute requête sur `posts` renvoyait un 500 -- découvert en ouvrant le
  # dashboard, pas par une alerte, parce que la trace part dans un log que
  # personne ne lit. Ni `ruff` ni `pytest` ne pouvaient le voir : les tests
  # tournent sur SQLite créé depuis les modèles, donc ils ne passent JAMAIS par
  # les migrations.
  #
  # Ce job est le seul endroit qui exécute la chaîne complète des migrations.
  # Il vérifie deux choses distinctes :
  #   1. `alembic upgrade head` -- la chaîne s'applique depuis zéro (une migration
  #      écrite à la main peut être valide en autogenerate et fausse à l'exécution) ;
  #   2. `alembic check` -- le schéma obtenu correspond aux modèles.
  #
  # Job séparé de `test` et non une étape de plus : les deux sont indépendants et
  # tournent donc en parallèle, et un échec dit tout de suite lequel des deux a
  # cassé.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Sans ce health check, les étapes démarrent avant que Postgres accepte
        # les connexions et le job échoue par intermittence.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `postgresql+psycopg` : le projet utilise psycopg 3, et l'URL sans le
      # suffixe ferait tomber SQLAlchemy sur psycopg2, absent des dépendances.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: La chaîne de migrations s'applique depuis une base vide
        run: uv run alembic upgrade head
      - name: Le schéma obtenu correspond aux modèles
        run: uv run alembic check
      - name: Et elle se déroule dans l'autre sens
        # Un downgrade cassé ne se voit qu'au moment où on en a besoin, c'est-à-dire
        # au pire moment. `base` déroule toute la chaîne à l'envers.
        run: uv run alembic downgrade base
